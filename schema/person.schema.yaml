$schema: "http://json-schema.org/draft-07/schema#"
$id: person.schema.yaml
title: Person
description: >
  Identity metadata for a single public person — the primary entity in
  this repo. Not necessarily a domain "expert": could be an interviewer,
  founder, scientist, investor, or anyone else who's spoken publicly.
  Kept intentionally minimal — no claims, opinions, or anything needing
  verification. Validates people/<id>.yaml.
type: object
required: [id, name, credentials, bio]
properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: Slug matching the filename (people/<id>.yaml).
  name:
    type: string
    description: Full public name.
  aliases:
    type: array
    items:
      type: string
    description: >
      Other names/spellings this person is known by in source material
      (e.g. "Nikhil", "Nikhil Kamath (WTF)"), used to resolve mentions
      to this canonical record instead of creating a duplicate person.
  credentials:
    type: string
    description: >
      One-line public description, e.g. "Co-founder, Zerodha" or
      "Neuroscientist, Stanford School of Medicine". Public factual
      info, not a claim.
  organization:
    type: string
    description: Optional current primary organization/affiliation.
  bio:
    type: string
    description: One or two sentence public bio.
  identity_confidence:
    type: string
    enum: [confirmed, likely, uncertain]
    description: >
      confirmed = a human created or reviewed this record (the default
      assumption when this field is absent, e.g. every person record
      predating this field). likely = auto-created from a strong
      signal (e.g. an explicit name in an episode title or in another
      statement's notes) but not yet human-reviewed. uncertain = weak
      or ambiguous signal; the record exists so statements aren't
      orphaned, but identity should be treated as provisional until a
      human confirms it.
additionalProperties: false
