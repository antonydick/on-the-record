$schema: "http://json-schema.org/draft-07/schema#"
$id: source.schema.yaml
title: Appearance
description: >
  One person's appearance in one episode. Validates
  sources/<person-slug>/<episode-slug>/metadata.yaml. The directory's
  <person-slug> segment must match this file's person field, and the
  <episode-slug> segment must match this file's episode field, which
  in turn must resolve to a sources/episodes/<episode-slug>.yaml id.
type: object
required:
  - id
  - person
  - episode
  - role
  - processing_status
properties:
  id:
    type: string
    description: Unique id for this appearance, referenced by statements[].source.
  person:
    type: string
    description: Must match a people/<id>.yaml id.
  episode:
    type: string
    description: Must match a sources/episodes/<id>.yaml id.
  role:
    type: string
    enum: [host, co-host, guest]
    description: This person's role in this specific appearance.
  processing_status:
    type: string
    enum: [pending, extracted, in_review, complete]
    description: >
      Pipeline stage for this appearance as a whole, independent of any
      single statement's verification status. pending = registered,
      nothing extracted yet. extracted = draft statements pulled from
      the transcript via the extraction prompt. in_review = at least
      one statement has been looked at by a human. complete = every
      statement from this appearance has reached a terminal status
      (verified or rejected).
additionalProperties: false
