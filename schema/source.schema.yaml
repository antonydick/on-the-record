$schema: "http://json-schema.org/draft-07/schema#"
$id: source.schema.yaml
title: Source
description: >
  Metadata for one appearance by one person — an interview, podcast
  episode, talk, or article featuring them, with a given interviewer
  (who need not be the same across a person's appearances). Validates
  sources/<person-slug>/<interviewer-slug>/metadata.yaml. The
  directory's <person-slug> and <interviewer-slug> segments must match
  this file's person and interviewer_slug fields.
type: object
required:
  - id
  - person
  - interviewer_slug
  - title
  - url
  - platform
  - published_date
  - format
  - processing_status
properties:
  id:
    type: string
    description: Unique id for this source, referenced by statements[].source.
  person:
    type: string
    description: Must match a people/<id>.yaml id. The person who appeared.
  interviewer_slug:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: >
      Slug identifying who interviewed/hosted this appearance; must
      match the second path segment under sources/<person>/. Does not
      need to correspond to a people/*.yaml entry — the interviewer is
      just an attribute of this appearance, not a tracked person here.
  title:
    type: string
  url:
    type: string
    format: uri
  platform:
    type: string
    enum: [youtube, podcast, article, book, other]
  published_date:
    type: string
    format: date
  duration:
    type: string
    description: Optional total runtime, e.g. "01:42:10".
  format:
    type: string
    enum: [podcast, video, article, book]
  processing_status:
    type: string
    enum: [pending, extracted, in_review, complete]
    description: >
      Pipeline stage for this appearance as a whole, independent of any
      single statement's verification status. pending = registered,
      nothing extracted yet. extracted = draft statements pulled from
      the transcript via the extraction prompt. in_review = at least
      one statement has been looked at by a human. complete = every
      statement from this appearance has reached a terminal status
      (verified or rejected).
additionalProperties: false
