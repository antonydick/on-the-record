$schema: "http://json-schema.org/draft-07/schema#"
$id: statement.schema.yaml
title: Statement
description: >
  One source-grounded statement extracted from one appearance. Validates
  each item in the `statements:` list of
  sources/<person-slug>/<interviewer-slug>/statements.yaml.

  Two concerns are kept in separate objects on purpose, as a core
  project rule — do not collapse them:
  - `verification`: did the person actually say this, accurately
    attributed to a specific place in the source? A provenance check,
    not a truth check.
  - `evidence`: what, if anything, supports the statement's content
    being true. A statement can be fully verified (the person really
    said it) while its content is false, contested, or simply
    unassessed — that's a separate axis entirely.

  A statement is always grounded in one specific source. Any narrative
  or progression connecting statements across multiple sources (e.g.
  "they went from X to Y to Z over several interviews") is something an
  agent constructs at answer time from several statements — it is never
  itself stored as a statement.
type: object
required: [id, person, source, type, text, verification]
properties:
  id:
    type: string
    description: Unique across the entire repo, not just this file.
  person:
    type: string
    description: Must match a people/<id>.yaml id.
  source:
    type: string
    description: Must match a sources/*/*/metadata.yaml id.
  type:
    type: string
    enum:
      - assertion
      - experience
      - belief
      - recommendation
      - observation
      - mechanism
      - evidence
      - qualification
      - example
    description: >
      assertion = a general statement not fitting a more specific type
      below. experience = a first-person memory, story, or lived event.
      belief = a subjective opinion, value judgment, or prediction.
      recommendation = prescriptive advice. observation = something
      noticed or reported as fact. mechanism = explains how or why
      something works. evidence = cites or references external support
      (a study, another person's work). qualification = a caveat,
      condition, or exception attached to another statement. example =
      a concrete illustrative instance.
  text:
    type: string
    description: The statement itself, in the person's own words where possible.
  topic:
    type: string
  verification:
    type: object
    description: >
      Provenance only: is this accurately attributed to the person at
      a specific point in the source. Says nothing about whether the
      statement's content is true — see `evidence` for that.
    required: [status]
    properties:
      status:
        type: string
        enum: [draft, unverified, reviewed, verified, rejected]
        description: >
          draft = auto-extracted by the extraction prompt, untouched
          by a human. unverified = a human has entered/edited it but
          not checked it against the primary source. reviewed = a
          human has looked at it and believes it's plausible but has
          not re-checked the primary source at a timestamp. verified =
          a human re-checked the primary source at the given
          timestamps and confirmed the attribution is accurate.
          rejected = checked and found inaccurate or misattributed —
          stays in the file, never deleted, for auditability.
      verified_at:
        type: ["string", "null"]
        format: date
        description: Required (non-null) when status is verified.
      verified_by:
        type: ["string", "null"]
      source_url:
        type: ["string", "null"]
        description: >
          Deep link to the exact clip/passage (e.g. a timestamped video
          URL). Required (non-null) when status is verified.
      start_timestamp:
        type: ["string", "null"]
        description: Required (non-null) when status is verified.
      end_timestamp:
        type: ["string", "null"]
        description: Required (non-null) when status is verified.
    additionalProperties: false
  evidence:
    type: object
    description: >
      Truth/support for the statement's content — deliberately separate
      from `verification`, which only covers attribution.
    properties:
      excerpt:
        type: ["string", "null"]
        description: >
          A concise excerpt of independent evidence bearing on the
          statement's truth, if any has been gathered. Not a transcript
          quote — that belongs to verification/attribution, not here.
    additionalProperties: false
  notes:
    type: string
additionalProperties: false
