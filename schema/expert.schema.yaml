$schema: "http://json-schema.org/draft-07/schema#"
$id: expert.schema.yaml
title: Expert
description: >
  Identity metadata for a single expert. Kept intentionally minimal —
  this is not the place for claims, opinions, or anything that needs
  verification, only who they publicly are. Validates experts/<id>.yaml.
type: object
required: [id, name, credentials, bio]
properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: Slug matching the filename (experts/<id>.yaml).
  name:
    type: string
    description: Full public name.
  credentials:
    type: string
    description: >
      One-line public credential/title, e.g. "Neuroscientist, Stanford
      School of Medicine". Public factual info, not a claim.
  bio:
    type: string
    description: One or two sentence public bio.
additionalProperties: false
