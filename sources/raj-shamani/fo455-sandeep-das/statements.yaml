    type: observation
    text: >
      Raj introduces the guest as Sandeep Das, who did his MBA from IIM
      Bangalore, has successfully led many companies, and is a
      successful leadership coach and best-selling author who has
      guided thousands of professionals. He says the episode will cover
      which skills AI cannot replace, why some managers advance while
      others stay behind, and why storytelling can become a career's
      most powerful skill.
    topic: guest-introduction
