  - id: raj-shamani-13914
    person: raj-shamani
    source: raj-shamani-fo455-sandeep-das
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook P Series,
      describing its on-device meeting assistant that automatically
      creates transcriptions and summaries, two-way AI noise
      cancellation that eliminates background noise on both ends of a
      call, and an AI camera that automatically adjusts framing and
      lighting, telling viewers to check Flipkart via the link in the
      description to learn more.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=JOsrihef5gM"
      start_timestamp: "00:03:20"
      end_timestamp: "00:04:20"
    evidence:
      excerpt: "ए नॉइज़ कैंसिलेशन दोनों तरफ का बैकग्राउंड नॉइज़ एलिमिनेट करके क्रिस्टल"
    notes: >
      ~[00:03:20]-[00:04:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This is a fourth distinct ASUS ExpertBook claim-set observed in
      the corpus (on-device meeting assistant / two-way AI noise
      cancellation / AI camera framing), differing from the
      25%-faster/call-center-hours, 30kg-panel/24-of-28-military-tests,
      and 50+ TOPS NPU/Copilot+ AI variants seen in other episodes.

  - id: raj-shamani-13915
    person: raj-shamani
    source: raj-shamani-fo455-sandeep-das
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests and ask the
      questions viewers want, comment on which guests they want to see
      on the podcast, and share the episode with at least one person
      because one conversation is enough to bring a positive change to
      someone's life. He signs off by telling viewers to keep figuring
      out until next time.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=JOsrihef5gM"
      start_timestamp: "02:28:40"
      end_timestamp: "02:29:20"
    evidence:
      excerpt: "क्वेश्चंस पूछ पाएं जो आप चाहते हो। नंबर टू मुझे कमेंट्स में यह बताओ कि आप और"
    notes: >
      ~[02:28:40]-[02:29:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This is the guest-suggestion + share variant of the standard
      closing outro, without the separate feedback (what did we do
