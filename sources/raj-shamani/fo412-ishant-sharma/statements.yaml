statements:
  - id: raj-shamani-14023
    person: raj-shamani
    source: raj-shamani-fo412-ishant-sharma
    type: observation
    text: >
      Raj introduces the guest as a cricketer who has played international
      cricket for 15 years and is one of the Indian cricket team's
      legendary fast bowlers: Ishant Sharma. He says the episode will
      cover how he established his career in cricket, the differences
      between Delhi's and Mumbai's cricket cultures, which young players
      could become cricket stars, whether he is retiring from cricket,
      whether he ever faced favoritism in team selection, and how he went
      into depression after conceding 30 runs in one over in a match,
      until his partner became his support and his whole mindset shifted,
      after which he consistently delivered high performance.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=TXkP_OrUVNs"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...15 साल से इंटरनेशनल क्रिकेट खेल रहे हैं और जो..."
    notes: >
      ~[00:02:20]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT for
