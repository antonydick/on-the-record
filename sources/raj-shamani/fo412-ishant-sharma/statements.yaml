  - id: raj-shamani-14024
    person: raj-shamani
    source: raj-shamani-fo412-ishant-sharma
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook laptop
      series, saying that just as high performance in business and work
      needs a reliable system, ASUS ExpertBook laptops are specifically
      designed for professionals and built for very-fast performance: the
      ASUS ExpertBook is up to 25% faster than a standard laptop, powered
      by a top-of-the-line Intel H-series processor, with thermal
      management systems that keep the laptop cool so users can deliver
      maximum performance consistently, saying that whether in cricket or
      life, consistent performance matters, and directing viewers to
      watch the episode till the end and get the best deals on the ASUS
      ExpertBook only on Flipkart during the Big Billion Days, with the
      link in the description.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=TXkP_OrUVNs"
      start_timestamp: "00:03:00"
      end_timestamp: "00:04:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...Intel H सीरीज प्रोसेसर और इनके थर्मल मैनेजमेंट सिस्टम्स आपके लैपटॉप को कूल..."
    notes: >
      ~[00:03:00]-[00:04:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Shares the "25% faster than a standard laptop" headline claim with
      other catalogued ASUS ExpertBook variants, but pairs it here with
      an Intel H-series processor and thermal management system detail
      not seen in those other variants (distinct from fo414-shikhar-
      dhawan's "expandable RAM/SSD + gaming cooling" pairing), so
      documented as a further distinct claim-set; also carries the same
      Flipkart Big Billion Days CTA seen in fo413-bobby-deol. Verified via
      on-screen YouTube caption at video timestamp ~205s, matching
      exactly.

  - id: raj-shamani-14025
    person: raj-shamani
    source: raj-shamani-fo412-ishant-sharma
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring better and more valuable guests and
      ask the questions viewers want answered, comment on what other
      guests they would like to see on the podcast, and share the episode
      with at least one person whose life could see a positive change,
      saying one conversation is enough to change someone's life. He
      signs off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=TXkP_OrUVNs"
