  - id: raj-shamani-13978
    person: raj-shamani
    source: raj-shamani-fo431-karan-bhagat
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring better and more valuable guests,
      comment on what they liked and disliked about the episode so the
      show can avoid repeating mistakes and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person, saying one conversation can change someone's life. He signs
      off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=bA5UANrRhe0"
      start_timestamp: "01:45:40"
