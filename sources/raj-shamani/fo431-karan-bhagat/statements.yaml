    type: observation
    text: >
      Raj introduces the guest as Karan Bhagat, Founder, Managing
      Director, and CEO of 360 ONE, one of India's top wealth management
      firms, saying the episode will cover how people's fears stay the
      same even as their money grows, the old money versus new money
      mindset, how much money can and cannot change a life, and how
      India's top thousand families manage their wealth and what their
      biggest fear is, and urges viewers to watch till the end.
