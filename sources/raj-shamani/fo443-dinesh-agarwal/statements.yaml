statements:
  - id: raj-shamani-13944
    person: raj-shamani
    source: raj-shamani-fo443-dinesh-agarwal
    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, describing it as a
      trusted growth partner for businesses of every scale, from SMEs
      to large enterprises, providing reliable transport solutions
      through a wide range of two-wheelers, three-wheelers, and trucks
      that handle goods from 20 kg to 4,500 kg, and calls Porter the
      episode's title sponsor, telling viewers to check the link in the
      description if they need a dependable partner for their business.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=IYWbbxdfGvc"
      start_timestamp: "00:01:40"
      end_timestamp: "00:02:20"
    evidence:
      excerpt: "जर्नी में एक डिपेंडेबल पार्टनर की जरूरत फील करता है। इसी ... दिस एपिसोड इज सपोर्टेड बाय आवर टाइटल स्पॉन्सर पोर्टल"
    notes: >
      ~[00:01:40]-[00:02:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT
      for this episode, not yet human-reviewed for transcription
      quality); text is a close paraphrase, not a verbatim quote. This
      is the Porter two-wheeler/logistics sponsor-read pattern
      (distinct from the Packers & Movers variant seen in
      fo454-saurabh-mukherjea) previously catalogued in this corpus.

  - id: raj-shamani-13945
    person: raj-shamani
    source: raj-shamani-fo443-dinesh-agarwal
    type: observation
    text: >
      Raj introduces the guest as Dinesh Agarwal, CEO of IndiaMART, an
      entrepreneur who has seen India's business world grow and change
      from the ground level, and says the episode will cover the
      difference between offline and online business, how money and
      business can both be made at the ground level, which sectors have
      the most growing demand based on IndiaMART's data, and hidden
      business opportunities available in India today.
    topic: guest-introduction
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=IYWbbxdfGvc"
      start_timestamp: "00:02:20"
      end_timestamp: "00:02:40"
    evidence:
      excerpt: "से बढ़ते एंड बदलते देखा है। हम उनसे जानेंगे आज के बिजनेस की रियलिटी ऑफलाइन"
    notes: >
      ~[00:02:20]-[00:02:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.

  - id: raj-shamani-13946
    person: raj-shamani
    source: raj-shamani-fo443-dinesh-agarwal
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests, comment on
      what they liked about the episode and which guests they want to
      see on the podcast, and share the episode with at least one
      person who might get a chance for a positive change in their
      life, saying one conversation can change someone's life. He signs
      off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=IYWbbxdfGvc"
      start_timestamp: "01:22:00"
      end_timestamp: "01:22:20"
    evidence:
      excerpt: "अच्छा लगा और और कौन से ऐसे गेस्ट हैं जो आप देखना चाहते हो हम इस एपिसोड"
    notes: >
      ~[01:22:00]-[01:22:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Slightly abbreviated variant of the standard closing outro
      (subscribe + combined feedback/guest-suggestion + share), plus
      the "keep figuring out" sign-off.
