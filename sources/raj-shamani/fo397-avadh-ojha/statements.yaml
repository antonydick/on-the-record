statements:
  - id: raj-shamani-14066
    person: raj-shamani
    source: raj-shamani-fo397-avadh-ojha
    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, saying that when getting
      something delivered the biggest stress is whether the delivery
      partner is reliable, whether the item will be safe, and how it
      will be tracked, which is why he uses Porter, whose verified
      delivery partners can always be depended on for reliability and
      psychological safety, and mentions that Porter has now launched
      "Scooter" for small deliveries that need extra space and extra
      care, such as bakery cake boxes, hardware shop items, or office
      documents, delivering them safely across the city, and directs
      viewers to click the link in the description to learn more.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=N7Q_56f39MQ"
      start_timestamp: "00:02:00"
      end_timestamp: "00:02:40"
