      video timestamp ~130s, matching exactly.

  - id: raj-shamani-14067
    person: raj-shamani
    source: raj-shamani-fo397-avadh-ojha
    type: observation
    text: >
      Raj introduces the guest as Avadh Ojha, a teacher and motivational
      speaker who understands how to hold power by understanding systems
      and use psychology to get things done, saying the episode will
      cover what matters more between love and power, how a 20-year-old
      can build power, when India will become a superpower, how the
      Indian society's mindset developed, and what mindset is needed to
      become psychologically dangerous, urging viewers to watch till the
      end and comment on what they learned from the episode.
    topic: guest-introduction
    verification:
