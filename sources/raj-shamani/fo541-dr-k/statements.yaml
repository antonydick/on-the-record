  - id: raj-shamani-07808
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: experience
    text: >
      The hardest thing for me is when things stay exactly the same —
      I find it very difficult to just keep doing something the same
      way without trying to change or improve it.
    topic: discomfort-with-staying-the-same
