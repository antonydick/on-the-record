      text is a close English translation of the original Hindi/Hinglish,
      not a verbatim quote. Said just before Raj asks Dr. K to explain
      why people are attracted to the specific traits/people they are.

  - id: raj-shamani-07802
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: observation
    text: >
      Among over-achievers I know — in my own circle of friends and
      people I've met, both men and women — I've often seen many
      young, very successful people develop a pattern where they only
      want to date someone who will improve their own social status.
    topic: successful-people-status-seeking-dating
