  - id: raj-shamani-07804
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: experience
    text: >
      Both my father and my mother used to give me hair-oil head
      massages, and they'd comfort me with pats to help me sleep when
      I was sick as a child — but my mother did it more than my
      father.
    topic: childhood-parental-touch
