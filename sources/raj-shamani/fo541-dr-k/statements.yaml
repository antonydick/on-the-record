statements:
  - id: raj-shamani-07801
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: observation
    text: >
      The more I talk to my friends about who they're attracted to, the
      more I feel like everyone is broken in their own way — I can
      think of about 20 friends whose patterns of attraction are all
      different from each other, and I still haven't figured out why
      this happens.
    topic: attraction-patterns-in-friends
    verification:
      status: draft
