  - id: raj-shamani-07809
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: observation
    text: >
      Whether it's harder for a man or a woman to find a life partner
      today seems to depend heavily on the country: in countries like
      the US, more men seem to be struggling; in countries like Japan,
      more women seem to be struggling; and in a country like India,
      it feels like everyone without resources/means is struggling.
    topic: dating-difficulty-varies-by-country
