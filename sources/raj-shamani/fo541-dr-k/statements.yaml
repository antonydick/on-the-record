  - id: raj-shamani-07805
    person: raj-shamani
    source: raj-shamani-fo541-dr-k
    type: experience
    text: >
      Being in love felt exciting, restless, and full of nervous
      anticipation — I wanted to do things for her, and I wanted to
      make sure she never faced any kind of inconvenience in her life.
    topic: falling-in-love-personal-experience
    verification:
