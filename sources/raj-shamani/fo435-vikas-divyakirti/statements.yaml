  - id: raj-shamani-13968
    person: raj-shamani
    source: raj-shamani-fo435-vikas-divyakirti
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can keep bringing valuable guests, comment on
      what they liked about the episode and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person who might get a chance to make a positive change in their
      life from it, saying one conversation can change someone's life. He
      signs off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=uLnJy8LddgM"
      start_timestamp: "02:18:40"
      end_timestamp: "02:19:20"
