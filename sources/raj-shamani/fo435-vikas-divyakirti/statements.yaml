    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, the episode's title
      sponsor, giving viewers a short recap: Porter's two-wheelers easily
      deliver items up to 20 kg, and when a bigger shipment is needed,
      like bulk orders up to 4,500 kg, their trucks handle the job
      effortlessly and without stress, whether running a business or
      otherwise, so viewers can focus on their work without unnecessary
      stress, and directs them to the link in the description to know
      more.
