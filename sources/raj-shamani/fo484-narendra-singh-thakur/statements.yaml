  - id: raj-shamani-13833
    person: raj-shamani
    source: raj-shamani-fo484-narendra-singh-thakur
    type: assertion
    text: >
      Raj reads a sponsor mention for Porter Packers & Movers, saying
      that whenever there's a big life upgrade like a new job, a new
      home, or a first property after marriage, the stress of shifting
      is a common thread — and in these moments of celebration you
      shouldn't have to worry about packing and moving, which is the
      problem Porter Packers & Movers solves by taking full
      responsibility for safe packing, loading, and unpacking through
      their trained partners, noting that over 1.3 million families
      have trusted Porter and given them a 4.8+ rating.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=Ys4WqB6KZlU"
      start_timestamp: "00:03:42"
      end_timestamp: "00:04:40"
    evidence:
      excerpt: "शिफ्टिंग का स्ट्रेस। एंड इन मोमेंट्स ऑफ सेलिब्रेशन यू शुडंट हैव"
    notes: >
      ~[00:03:40]-[00:04:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close English rendering, not a verbatim
      quote. Porter Packers & Movers sponsor read, a different Porter
      product line than the two-wheeler delivery sponsor read seen in
      fo485-khan-sir.

  - id: raj-shamani-13834
    person: raj-shamani
    source: raj-shamani-fo484-narendra-singh-thakur
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the episode
      to the end and says they have three things to do: subscribe to
      the channel right now so the show can bring more valuable guests,
      comment telling him what they learned from the episode and which
      guest they want to see brought on next for insightful
      conversations, and share the episode with one person since one
      conversation is enough to change someone's life.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=Ys4WqB6KZlU"
