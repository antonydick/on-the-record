    source: raj-shamani-fo524-dr-viju
    type: observation
    text: >
      Introducing the guest, Raj says the world's largest producer of spice
      extracts is a Kerala-based company that most people have probably
      never heard of. It supplies the flavors found in packaged foods, the
      fragrance in expensive perfumes like Chanel, and ingredients for
      supplements people take every morning.
