    source: raj-shamani-fo524-dr-viju
    type: observation
    text: >
      Raj summarizes his understanding of "fairy dusting" back to Dr.
      Viju: that the actual amount of a supplement's headline extract is
      often only about 1/10th to 1/100th of what is claimed on the label,
      comparing it to "magic dust" that doesn't actually work.
    topic: fairy-dusting
