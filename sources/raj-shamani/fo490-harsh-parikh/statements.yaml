statements:
  - id: raj-shamani-13816
    person: raj-shamani
    source: raj-shamani-fo490-harsh-parikh
    type: assertion
    text: >
      Raj reads a sponsor mention saying that while there's plenty of
      information about real estate, getting real advice is a
      challenge, which is why buyers always feel unsure about their
      decisions no matter how much research they do — and says that to
      bridge this trust gap, Birla Estates, the Aditya Birla Group's
      real estate arm, has started an initiative called Real Advice
      that brings experts and real experiences onto a single platform
      to help people make safer, better-informed decisions, and that
      this episode is part of a special series done with them.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=-MzmomicG-w"
      start_timestamp: "00:01:40"
      end_timestamp: "00:02:20"
    evidence:
      excerpt: "बाइंग अ हाउस कि क्या हम सही डिसीजन ले रहे हैं शुड आई लुक ... जो आदित्य बिरला ग्रुप का एक रियलस्टेट आर्म है"
    notes: >
      ~[00:01:40]-[00:02:20] Transcribed via YouTube Hindi/Hinglish
