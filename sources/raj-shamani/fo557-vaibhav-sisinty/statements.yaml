    source: raj-shamani-fo557-vaibhav-sisinty
    type: experience
    text: >
      As an entrepreneur, when a guest comes on his show because of the
      content they make and teaches him about AI, I get amazed and tend
      to fall into a passion for learning everything about it that stays
      relevant to me for the next 2, 3, or 4 days.
