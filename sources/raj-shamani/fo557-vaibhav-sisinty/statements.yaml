  - id: raj-shamani-11004
    person: raj-shamani
    source: raj-shamani-fo557-vaibhav-sisinty
    type: observation
    text: >
      Over roughly the past year and a half of having my team use AI
      properly, I've come to realize that some of my team members have
      become "dumb" — they were far smarter before I gave them AI.
    topic: team-ai-decline
    verification:
