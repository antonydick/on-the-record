  - id: raj-shamani-11007
    person: raj-shamani
    source: raj-shamani-fo557-vaibhav-sisinty
    type: experience
    text: >
      I've stopped using the AI tools I previously relied on for my own
      research and similar questions, cutting my usage down to roughly
      one-fourteenth of what it used to be, because I felt it was
      reducing my own intelligence and giving me generic output that
      anyone could have produced.
    topic: ai-usage-reduction
