      end_timestamp: "00:03:40"
    evidence:
      excerpt: "and bigger guests for you so that we can give you more value and learnings"
    notes: >
      ~[00:03:20]-[00:03:40] Transcribed via YouTube English
      auto-captions (freshly fetched and consolidated from the raw VTT
      for this episode, not yet human-reviewed for transcription
      quality); text is a close paraphrase, not a verbatim quote. This
      episode is spoken entirely in English, so English auto-captions
      were used instead of Hindi/Hinglish ones. This is a more elaborate
      variant of the standard subscriber-goal-appeal than the shorter
      "keep supporting us" wording seen in most other episodes.

  - id: raj-shamani-13899
    person: raj-shamani
    source: raj-shamani-fo461-sunita-williams
    type: observation
    text: >
      Raj introduces the guest by saying she has done nine spacewalks,
      spent more than 62 hours walking in space (more than any other
      woman in history), commanded the International Space Station
      twice, taken part in three ISS missions totaling 608 days in
      space (the second-most of any NASA astronaut), flown 40 different
      aircraft, served as a Navy captain, and is the first person ever
      to run a marathon in space. He names her as Sunita Williams and
      notes that she was stranded in space for nine months the previous
      year when a spacecraft failed, but did not panic and took charge.
    topic: guest-introduction
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=ULvplwBTbQk"
      start_timestamp: "00:03:40"
      end_timestamp: "00:05:00"
    evidence:
      excerpt: "today's guest has done nine spacewalks, spent more than 62 hours"
    notes: >
      ~[00:03:40]-[00:05:00] Transcribed via YouTube English
      auto-captions; text is a close paraphrase, not a verbatim quote.

  - id: raj-shamani-13900
    person: raj-shamani
    source: raj-shamani-fo461-sunita-williams
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to comment what the show did right so it
      can keep doing that, what it did wrong so it doesn't repeat
      mistakes, and suggestions for the next guest, and asks them to
      share the episode with at least one person who will get some
      insights because one conversation can change someone's life. He
      signs off by telling viewers to keep figuring out and to not
      forget to subscribe to the channel.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=ULvplwBTbQk"
