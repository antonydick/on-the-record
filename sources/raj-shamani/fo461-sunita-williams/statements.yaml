  - id: raj-shamani-13898
    person: raj-shamani
    source: raj-shamani-fo461-sunita-williams
    type: recommendation
    text: >
      Before starting the episode, Raj makes a request to viewers,
      saying his team works very hard to bring bigger guests so they
      can give more value and learnings through better conversations,
      and asks viewers to subscribe to the channel, noting it is free
      and takes only two seconds, promising that doing so will help the
      show keep bringing top 1% guests from around the world.
    topic: subscriber-goal-appeal
    verification:
      status: verified
