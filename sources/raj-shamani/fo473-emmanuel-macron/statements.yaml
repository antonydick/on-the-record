  - id: raj-shamani-13869
    person: raj-shamani
    source: raj-shamani-fo473-emmanuel-macron
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to comment what the show did right so it
      can keep doing that, what it did wrong so it doesn't repeat
      mistakes, and suggestions for the next guest, asks them to share
      the episode with at least one person since one conversation is
      enough to give someone ideas to change their life, and reminds
      them not to forget to subscribe to the channel.
