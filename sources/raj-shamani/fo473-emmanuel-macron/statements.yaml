    text: >
      Raj introduces the guest as President of the French Republic
      Emmanuel Macron, noting this is his first ever podcast in the
      world and that it's happening for the first time on the Figuring
      Out show; he says they discussed the India-France relationship,
      Macron's relationship with America and world leaders, what Europe
      is trying to do differently, and how India can become a strategic
      partner in a world heading toward multipolarity.
