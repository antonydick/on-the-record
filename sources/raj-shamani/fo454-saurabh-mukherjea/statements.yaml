    text: >
      Raj reads a sponsored segment for Porter Packers and Movers,
      saying they handle full house shifting including packing,
      loading, moving and unloading with trained partners, offer
      multi-layer packing for extra safety, and that over 1 million
      families have trusted Porter, which has a 4.8+ rating and is one
      of India's most trusted house-shifting partners. He calls Porter
      the episode's title sponsor and tells viewers to click the link
      in the description to know more.
