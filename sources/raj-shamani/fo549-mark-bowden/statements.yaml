  - id: raj-shamani-09413
    person: raj-shamani
    source: raj-shamani-fo549-mark-bowden
    type: mechanism
    text: >
      Raj describes his own technique of mentally sorting almost everyone
      he meets into a "green zone," "red zone," or "gold zone" within the
      first five to ten minutes of small talk, based on how well they
      respond to a deliberately slightly awkward or personal remark he
      makes.
    topic: interview-prep
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
