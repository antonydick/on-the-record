    source: raj-shamani-fo549-mark-bowden
    type: mechanism
    text: >
      Raj says he used to research guests extensively beforehand to find
      out what they hate, what topics they avoid or answer diplomatically,
      and what they are genuinely passionate about and talk about
      constantly, then use that to come up with an unusual, related
      question.
    topic: interview-prep
    verification:
