  source: raj-shamani-fo499-vaibhav-sisinty
  type: observation
  text: 'Raj says that this time they tried a new format where Vaibhav teaches him live and does things for him, so that everyone watching can grab pen and paper and follow along step by step as something is built from zero in the AI world — this episode isn''t Q&A, it''s "build in public," and if anyone likes the idea they built, they''re welcome to steal it.

    '
