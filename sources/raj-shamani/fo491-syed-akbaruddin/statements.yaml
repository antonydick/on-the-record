  - id: raj-shamani-13814
    person: raj-shamani
    source: raj-shamani-fo491-syed-akbaruddin
    type: assertion
    text: >
      Before starting the episode, Raj says their goal is to take an
      Indian podcast to a global level, and that as of today they need
      20.8 million subscribers to get there — so if the channel has
      provided any value, he asks viewers to subscribe, noting it's
      completely free and takes less than a minute, and mentions the
      audio experience of the episode is also available by following
      the show on Spotify.
    topic: subscriber-goal-appeal
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=5suNXiI1vjQ"
      start_timestamp: "00:02:00"
      end_timestamp: "00:02:35"
    evidence:
      excerpt: "to get there. So, if you have found anything valuable from"
    notes: >
      ~[00:02:00]-[00:02:40] Transcribed via YouTube English
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Near-identical wording (including the same 20.8-million figure) to
      the appeal seen in fo493-mrityunjay-sharma, fo494-suyash-saraf and
      fo496-arpit-agrawal, a reused script across episodes recorded
      around the same period.

  - id: raj-shamani-13815
    person: raj-shamani
    source: raj-shamani-fo491-syed-akbaruddin
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the episode
      to the end and says they have three things to do: subscribe to
      the channel right now so the show can bring better guests,
      comment with feedback on what the show got right or wrong so it
      can learn and create a better experience, and share the episode
      with one person, since one conversation is enough to change
      someone's life.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=5suNXiI1vjQ"
