      end_timestamp: "03:14:13"
    evidence:
      excerpt: "Thank you so much for watching this episode till the end. Now you have to do three things. Number one, subscribe to this channel right now"
    notes: >
      ~[03:13:20]-[03:13:40] Transcribed via YouTube English
      auto-captions; text is a close paraphrase, not a verbatim quote.
