  - id: raj-shamani-13813
    person: raj-shamani
    source: raj-shamani-fo491-syed-akbaruddin
    type: observation
    text: >
      Raj frames the episode by saying India is walking on a very thin
      line between global pressures and unpredictable world leaders, and
      that most importantly the episode asks where India stands today
      globally and what things could become reasons for India's
      downfall.
    topic: episode-framing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
