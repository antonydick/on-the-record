    source: raj-shamani-fo507-kiara-advani
    type: mechanism
    text: >
      Raj Shamani asks Kiara about something he calls the "shadow effect" —
      the idea that after growing up watching her very affectionate
      ("lovey-dovey") parents, a person subconsciously wants to shadow, or
      replicate in their own life, everything they saw their parents go
      through.
    topic: shadow-effect
