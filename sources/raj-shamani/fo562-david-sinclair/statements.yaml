  notes: '~[01:45:00] Transcribed via YouTube Hindi auto-captions; text is a close English translation of the original Hindi/Hinglish, not a verbatim quote. The ASR transcript renders the key word as "किसान" (farmer) throughout this passage, but given the surrounding context is entirely about pharmaceutical-industry competitors, drug patents, and rival longevity companies, this is almost certainly a mis-transcription of "फार्मा" (pharma); verifier should confirm the actual word said in the recording. Speaker turn inferred from context (host posing a provocative framing question, guest responding at length).


    Verified 2026-09-16 by Antony Dick: watched https://www.youtube.com/watch?v=gfCg5srOjN0&t=6289s in-browser. Caption reads ''Do you think there''s a farmer mafia?'' matching the statement (the original English auto-caption itself renders the key word as "farmer", confirming this is a genuine ASR artifact on both language tracks rather than a Hindi-translation-only quirk — almost certainly meant as "pharma").

