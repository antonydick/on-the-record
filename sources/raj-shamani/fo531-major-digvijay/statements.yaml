  - id: raj-shamani-05807
    person: raj-shamani
    source: raj-shamani-fo531-major-digvijay
    type: assertion
    text: >
      Raj states that when buying a laptop most people check speed,
      design, and storage but forget something important -- security --
      and says that because his own data is stored on his laptop he
      needs a highly secure one, which is why he uses the Asus
      ExpertBook. He highlights its enterprise-grade multi-layered
      security system that protects against malware and ransomware at
      the hardware, BIOS, and operating-system level, including an
      onboard TPM 2.0 chip and BitLocker encryption to keep sensitive
      files and documents safe from unauthorized access, and tells
      viewers the Asus ExpertBook is available on Flipkart with a link
      in the description.
    topic: episode-sponsorship
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
