statements:
  - id: raj-shamani-07001
    person: raj-shamani
    source: raj-shamani-fo537-kiran-mazumdar-shaw
    type: observation
    text: >
      Based on comparing three years of thumbnail-click data across Indian
      and international podcasters, Raj says thumbnails featuring female
      entrepreneurs get noticeably fewer clicks from the general public than
      thumbnails featuring male entrepreneurs, showing a clear gender bias
      among viewers — even though this doesn't mean the female entrepreneurs
      are actually less successful or doing worse.
    topic: podcast-thumbnail-gender-bias
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:12:31] Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. The transcript's wording here is garbled/internally
      contradictory about which direction the click gap runs (one clause
      literally reads as if female-entrepreneur thumbnails get more clicks),
      but the surrounding argument (about bias against women entrepreneurs)
      makes clear the intended point is that they get fewer clicks. A
      verifier should re-check the original clip for the exact wording.

