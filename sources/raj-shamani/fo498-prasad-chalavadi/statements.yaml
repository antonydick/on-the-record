  - id: raj-shamani-13001
    person: raj-shamani
    source: raj-shamani-fo498-prasad-chalavadi
    type: observation
    text: >
      Raj introduces today's guest by saying he did the opposite of the
      usual advice (build profits first, then a team, then scale): he
      hired real people on day one with zero sales, started with a
      small shop in his basement without any funding, and today owns a
      1600-crore business empire. Raj names him as Durga Prasad
      Chalavadi, founder and managing director of SSKL.
    topic: guest-introduction
