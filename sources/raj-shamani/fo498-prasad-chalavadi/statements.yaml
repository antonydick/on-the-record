      video (confirmed via the player's "Subtitles/closed captions
      unavailable" state and repeated yt-dlp caption-download failures);
      transcribed instead from a locally downloaded audio track using
      local faster-whisper (base model, English output despite
      Hindi/Hinglish source audio — language detected as Hindi at 97%
      confidence by the model, but much of its output text reads as an
      English paraphrase/translation rather than a verbatim
      transcript). Treat wording as an approximate paraphrase, not a
      verbatim quote, more so than the usual YouTube auto-caption
      notes elsewhere in this corpus.

