  - id: raj-shamani-13004
    person: raj-shamani
    source: raj-shamani-fo498-prasad-chalavadi
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the episode
      and says they have three things to do: subscribe to the channel
      so the show can bring better guests, comment on what the show did
      right or wrong so it can learn from the feedback and create a
      better experience, and share the episode with one person, since
      one conversation is enough to change someone's life.
