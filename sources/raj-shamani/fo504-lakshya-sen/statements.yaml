    source: raj-shamani-fo504-lakshya-sen
    type: example
    text: >
      Continuing the Napoleon story, Raj Shamani says that on the day of
      any battle, big or small, Napoleon would wake up very early and sit
      alone for about an hour beforehand.
    topic: napoleon-visualization
