    source: raj-shamani-fo504-lakshya-sen
    type: evidence
    text: >
      Raj Shamani says he has heard — at least from what he's seen on the
      internet — that at the Istora stadium in Indonesia the shuttle moves
      differently because the crowd generates so much heat and noise
      against any non-Indonesian player, making it the worst crowd
      atmosphere for such a player.
