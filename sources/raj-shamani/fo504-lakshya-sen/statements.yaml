    person: raj-shamani
    source: raj-shamani-fo504-lakshya-sen
    type: mechanism
    text: >
      Raj Shamani shares that, per this owner's framework, in any sport the
      first two or three pioneering athletes have to fight the whole world
      without pay — working day and night — to make their country win at
      the world level, getting little appreciation, money, or attention,
      and sometimes needing to fund themselves through loans.
