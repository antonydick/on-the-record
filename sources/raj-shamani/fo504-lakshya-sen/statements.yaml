  - id: raj-shamani-00415
    person: raj-shamani
    source: raj-shamani-fo504-lakshya-sen
    type: mechanism
    text: >
      Drawing on that book, Raj Shamani explains that in a close,
      high-pressure score like 19-all, both players are equally skilled
      (that's how they both got there), but mentally one player is
      thinking "I'm going to smash through and finish this" while the
      other player's morale collapses into "I just need to save these last
      couple of points."
    topic: winning-line-fever
