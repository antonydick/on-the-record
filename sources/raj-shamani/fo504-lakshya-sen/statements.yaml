  - id: raj-shamani-00407
    person: raj-shamani
    source: raj-shamani-fo504-lakshya-sen
    type: example
    text: >
      Telling a story about Napoleon, Raj Shamani says Napoleon was
      regarded as someone who never lost a fight, which is why he was
      considered one of the most fearsome/brutal commanders.
    topic: napoleon-visualization
