    source: raj-shamani-fo504-lakshya-sen
    type: belief
    text: >
      Raj Shamani states that in these "winning line fever" situations, the
      player who is mentally playing to "save" their lead usually ends up
      losing to the player who is playing to "finish" or "kill" the match.
