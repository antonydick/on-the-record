  - id: raj-shamani-13990
    person: raj-shamani
    source: raj-shamani-fo425-arshad-warsi
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook, saying that
      just as staying strong is necessary in life, durable tools are
      needed in business that can support you through every challenge,
      which is why professionals use the ASUS ExpertBook, built for
      worry-free durability: it has passed 24 of 28 military-grade
      tests, its panel can handle up to 30 kg of pressure, it has a
      spill-resistant keyboard, and its keys have been tested 1 crore
      times, calling it perfect for the everyday grind, and directs
      viewers to check out the ASUS ExpertBook available on Flipkart via
      the link in the description.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=T7dcQhjvTWU"
      start_timestamp: "00:02:40"
      end_timestamp: "00:03:20"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...नीडेड जो हर चैलेंज में साथ दें। इसीलिए प्रोफेशनल्स यूज़ करते हैं Asus एक्सपर्ट..."
    notes: >
      ~[00:02:40]-[00:03:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This ASUS ExpertBook sponsor-read claim-set (24-of-28 military-
      grade tests, 30 kg panel pressure, spill-resistant keyboard)
      matches the variant previously catalogued in this corpus from
      fo457 and fo429-nawazuddin-siddiqui closely, with one additional
      detail not previously seen: the keys have been tested 1 crore
      times. Verified via on-screen YouTube caption at video timestamp
      ~175s, matching exactly.

  - id: raj-shamani-13991
    person: raj-shamani
    source: raj-shamani-fo425-arshad-warsi
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests and ask the
      questions viewers want answered, comment on which other guests they
      want to see on the podcast, and share the episode with at least one
      person, saying one conversation is enough to bring a positive
      change to someone's life. He signs off by telling viewers to keep
      figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=T7dcQhjvTWU"
      start_timestamp: "01:51:00"
      end_timestamp: "01:51:20"
