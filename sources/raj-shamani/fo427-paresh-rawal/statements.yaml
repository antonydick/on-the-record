  - id: raj-shamani-13986
    person: raj-shamani
    source: raj-shamani-fo427-paresh-rawal
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests, comment on
      what they liked about the episode and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person, saying one conversation can change someone's life. He signs
      off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=BJ7ortOdLgg"
      start_timestamp: "01:47:40"
      end_timestamp: "01:48:00"
