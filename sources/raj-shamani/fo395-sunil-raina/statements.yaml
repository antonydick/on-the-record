  - id: raj-shamani-14072
    person: raj-shamani
    source: raj-shamani-fo395-sunil-raina
    type: observation
    text: >
      Raj introduces the guest as Sunil Raina, Managing Director of Lava
      International Limited, an Indian smartphone brand that is a
      perfect example of a downfall and rise again, saying the episode
      will cover what happened between 2014 and 2017 that caused Lava
      and other brands to almost crash out of the market, why they
      focused on feature phones after failing in the smartphone market,
      how sponsoring The Kapil Sharma Show became a game changer for
      them, and why they shifted from telecom to mobile manufacturing,
      urging viewers to watch till the end to understand how to build a
      business and turn around a downfall into profitability, and to
      check the link in the description to learn more about Lava
      smartphones.
    topic: guest-introduction
    verification:
