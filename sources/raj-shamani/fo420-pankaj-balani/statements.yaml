    source: raj-shamani-fo420-pankaj-balani
    type: observation
    text: >
      Raj introduces the guest as Pankaj Balani, co-founder of Delta
      Exchange, India's largest crypto derivatives platform, who
      graduated from IIT and ISB, worked in investment banking, and is
      now one of India's top crypto entrepreneurs, saying they will
      learn what crypto derivatives are and how they differ from normal
      crypto trading, what would happen to investors' money if the RBI
      banned crypto tomorrow, why India doesn't fully support crypto,
      what people should buy in crypto to make money, whether crypto is
      the new stock market or just a casino-like gamble, and whether AI
      can make crypto trading more profitable, and urges viewers to
      watch till the end and check out the Delta Exchange platform,
      which offers a 10% fee discount, via the link in the description.
