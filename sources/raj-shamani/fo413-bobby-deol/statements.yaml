  - id: raj-shamani-14020
    person: raj-shamani
    source: raj-shamani-fo413-bobby-deol
    type: observation
    text: >
      Raj introduces the guest as an actor who went from being one of the
      biggest rising stars to years of silence and rejection, facing
      addiction, self-doubt, and embarrassment, with people thinking he
      could disappear, but who instead made a massive comeback with
      back-to-back hits: Bobby Deol. He says the episode will cover what
      it was like growing up in a family where every member was already a
      star, why his parents were so overprotective of him, his bond with
      his brother Sunny Deol, the pressure of carrying a celebrity family
      tag, why he lost out on films and why talent agencies, producers,
      and directors were hesitant to work with him, his struggles with
      alcohol, and how he slowly made his way back, piece by piece.
    topic: guest-introduction
    verification:
