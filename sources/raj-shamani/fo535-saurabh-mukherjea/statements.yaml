  type: assertion
  text: 'Raj says the most stressful part of house shifting is safely packing belongings, worrying whether everything will be loaded properly and arrive undamaged, and that this is why he uses Porter, whether shifting within the same city or to a different one. He says Porter handles both packing and moving, doing multi-layer packing with professional loading and unloading to keep belongings safe, which is why more than 1.3 million (13 lakh) families trust Porter, with a rating of 4.8 or higher.

    '
