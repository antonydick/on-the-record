statements:
  - id: raj-shamani-14006
    person: raj-shamani
    source: raj-shamani-fo419-manvir-bhatia
    type: recommendation
    text: >
      Raj reads a sponsored segment for Circle DNA, saying that every
      year 1.4 million people in India are diagnosed with cancer, and
      that according to research, 30 to 50% of cases are preventable
      through early awareness and lifestyle changes, and that Circle
      DNA's advanced DNA test, based on NGS technology with 99.9%
      accuracy, gives more than 500 health reports across 20-plus
      categories including cancer risk, heart health, mental health,
      fitness, sleep, skin, and digestion, and directs viewers to the
      link in the description, mentioning that using code "RAJ" at
      circledna.com gives a 40% discount.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=ixNpmM5FdlE"
      start_timestamp: "00:01:20"
      end_timestamp: "00:02:00"
