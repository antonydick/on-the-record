  - id: raj-shamani-14007
    person: raj-shamani
    source: raj-shamani-fo419-manvir-bhatia
    type: observation
    text: >
      Raj introduces the guest as Dr. Manvir Bhatia, a senior neurologist
      and one of India's top sleep specialists, saying the episode will
      cover what good sleep means and how to achieve it, whether
      sleeping pills and melatonin are safe, what sleep apnea is, why
      people snore, which diseases can result from insufficient sleep,
      and whether pillows and mattresses affect sleep quality, and urges
      viewers to watch till the end and comment on what they learned
      from the episode.
    topic: guest-introduction
