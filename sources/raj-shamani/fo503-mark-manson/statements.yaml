      Suggests, building on something Mark said about insecure people
      being drawn to toxic partners, that another reason some people
      (women or men) stay attracted to toxic people is a kind of victim
      mentality -- that they like identifying as a victim, on some
      subconscious level, and become used to staying in that state.
    topic: victim-mentality
    verification:
      status: draft
