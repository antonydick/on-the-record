  - id: raj-shamani-00217
    person: raj-shamani
    source: raj-shamani-fo503-mark-manson
    type: evidence
    text: >
      Says he was reading a research article in which researchers found
      that people who experience serious trauma and then dedicate their
      lives to teaching others about resilience show different brain
      patterns than people who simply heal and move on -- with the
      "teachers" getting stuck in a repeating cycle of explaining their
      trauma, a phenomenon the researchers reportedly termed "performative
      healing" -- and asks Mark whether he thinks he relates to this.
    topic: trauma-and-teaching
    verification:
      status: draft
      verified_at: null
