    source: raj-shamani-fo503-mark-manson
    type: evidence
    text: >
      Brings up "the theory propounded by Rene Girard" that female desire
      is triangular -- that a woman's desire for a man needs another
      woman to validate him as a target -- and says that per this theory,
      women like men more when other women want them; asks Mark whether
      he thinks this is true.
    topic: mimetic-desire
    verification:
