  - id: raj-shamani-14075
    person: raj-shamani
    source: raj-shamani-fo394-shokin-chauhan
    type: observation
    text: >
      Raj introduces the guest as retired Lieutenant General Shokin
      Chauhan, a soldier, strategic thinker, and former Director General
      of Assam Rifles, saying the episode will cover whether China or
      Pakistan is a bigger threat for India, the ground reality of
      Kashmir and the Northeast, how the Indian Army sets strategy on the
      border, and whether future wars will be fought on the basis of
      intelligence and technology, urging viewers to watch till the end
      and click the link below to learn more about Outskill's AI training
      program.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=_9_0AyCLDNY"
