statements:
  - id: raj-shamani-14074
    person: raj-shamani
    source: raj-shamani-fo394-shokin-chauhan
    type: recommendation
    text: >
      Raj reads a sponsored segment for Outskill, describing it as the
      world's first AI educational platform running a 2-day live AI
      training program (Saturday and Sunday, 10am to 7pm) normally priced
      at ₹10,000 but free for viewers, where participants can learn 10+
      AI tools, prompt engineering without coding, data analysis, task
      automation, and how to create presentations, videos, and images
      using AI within minutes, noting people from almost 100 countries
      are taking the training and it is relevant for any field, and
      directing viewers to click the link in the description to secure
      their seat.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=_9_0AyCLDNY"
      start_timestamp: "00:01:40"
      end_timestamp: "00:02:20"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...है कि एआई आ गया है। प्रॉब्लम यह है कि हमें एआई यूज करना नहीं..."
    notes: >
      ~[00:01:40]-[00:02:20] Transcribed via YouTube Hindi/Hinglish
