      not a verbatim quote. Raj states this as a prior belief he held,
      corrected in the moment by Sanjiv Goenka's explanation.

  - id: raj-shamani-10208
    person: raj-shamani
    source: raj-shamani-fo553-sanjiv-goenka
    type: experience
    text: >
      My podcast's office once lost power, and we had to change that office
      because we later found out the problem was excessive electricity
      consumption — this happened around the time our podcast was scheduled
      to go live in the evening.
    topic: podcast-office-power-outage
    verification:
      status: draft
