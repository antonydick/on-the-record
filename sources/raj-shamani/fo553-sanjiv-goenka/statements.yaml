  - id: raj-shamani-10207
    person: raj-shamani
    source: raj-shamani-fo553-sanjiv-goenka
    type: belief
    text: >
      I always used to think that transformers burst because of some loose
      connection inside them, and that's what caused all these power-outage
      problems — I didn't know that it was actually about excessive
      electricity consumption.
    topic: transformer-power-outage-belief
    verification:
      status: draft
