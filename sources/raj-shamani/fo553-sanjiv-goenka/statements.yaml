    person: raj-shamani
    source: raj-shamani-fo553-sanjiv-goenka
    type: experience
    text: >
      During that power-outage incident at my podcast's office, I was not
      even in India, and I didn't know it was happening — my team didn't
      tell me until after they had already dealt with it.
