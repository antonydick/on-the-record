  - id: raj-shamani-10201
    person: raj-shamani
    source: raj-shamani-fo553-sanjiv-goenka
    type: belief
    text: >
      I find the question of how billionaires and big industrialists/business
      leaders spot opportunities before everyone else absolutely fascinating —
      it's one of the biggest questions almost everyone searches for on the
      internet. Honestly, it's a very novice and naive question, but it's a
      true one.
    topic: billionaire-opportunity-question
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:03:07]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. This is Raj's framing remark opening the "how do
      billionaires spot opportunities" segment of the interview.

