      not a verbatim quote. The ASR text is garbled around the exact
      scheduled time (it mentions both "7:00" and "9:09") and includes an
      unclear term ("Khalifics"/"खलीफिक्स") whose meaning could not be
      confidently determined, so those specifics are omitted here.

