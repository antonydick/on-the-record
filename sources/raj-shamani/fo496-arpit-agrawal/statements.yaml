  type: assertion
  text: 'Before starting the episode, Raj says their goal is to take an Indian podcast to a global level, and that as of today they need 20.8 million subscribers to get there — so if the channel has provided any value, he asks viewers to subscribe, noting it''s completely free and costs nothing, and mentions the audio experience of the episode is also available by following the show on Spotify.

    '
