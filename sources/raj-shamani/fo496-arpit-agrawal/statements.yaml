- id: raj-shamani-13203
  person: raj-shamani
  source: raj-shamani-fo496-arpit-agrawal
  type: belief
  text: 'Raj shares a personal observation with the guest that friendships in tier-2 and tier-3 cities tend to be more loyal than in metro cities — describing how, in his hometown of Indore, if a friend did something wrong and got into a fight, you''d still stand by them without judging whether they were at fault, in a way he contrasts with metro-city friendships, where people are quicker to walk away once they feel the other person was somewhat at fault.

    '
  topic: tier-two-friendship-loyalty
