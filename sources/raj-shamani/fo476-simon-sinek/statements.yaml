  - id: raj-shamani-13858
    person: raj-shamani
    source: raj-shamani-fo476-simon-sinek
    type: observation
    text: >
      Raj introduces the guest as Simon Sinek, saying he has delivered
      one of the most watched TED Talks ever, has authored global
      bestsellers translated into multiple languages, and whose
      frameworks have been adopted by top leaders, Fortune 500
      companies, and military leaders worldwide; he says in this
      episode they discussed why trust is collapsing everywhere, why
      Gen Z already feels behind, whether love and ambition can
      coexist, and whether Simon would do anything differently, and
      asks viewers to watch the episode to the end and share their key
      takeaways in the comments.
    topic: guest-introduction
    verification:
      status: verified
      verified_at: "2026-09-18"
