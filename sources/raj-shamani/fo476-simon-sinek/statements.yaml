  - id: raj-shamani-13857
    person: raj-shamani
    source: raj-shamani-fo476-simon-sinek
    type: assertion
    text: >
      Before starting the episode, Raj says their goal is to make an
      Indian podcast reach world number one, and that as of today they
      need 20.8 million subscribers to get there — so if the channel
      has provided any value, he asks viewers to subscribe, noting it's
      free and takes less than a minute, and promises in return to keep
      bringing bigger and better guests to make the conversation more
      valuable.
    topic: subscriber-goal-appeal
