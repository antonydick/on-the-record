  - id: raj-shamani-13859
    person: raj-shamani
    source: raj-shamani-fo476-simon-sinek
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to comment what the show did right so
      it can keep doing that, what it did wrong so it doesn't repeat
      mistakes, and suggestions for the next guest, and asks them to
      share the episode with at least one person since one conversation
      is enough to give someone ideas to change their life.
    topic: audience-engagement
    verification:
