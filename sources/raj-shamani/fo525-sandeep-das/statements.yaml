- id: raj-shamani-04604
  person: raj-shamani
  source: raj-shamani-fo525-sandeep-das
  type: observation
  text: 'Raj Shamani observes that in his generation, people have consumed so much relationship-related content that even before a relationship starts, or after just one date, they have already mentally played out how it will end (assuming it will fade in a few months, that the person''s "true colors" will show, or that the person will turn controlling) — so they don''t genuinely try to build a good relationship, because they are already mentally rehearsing the heartbreak.

    '
  topic: anticipatory-heartbreak
