    source: raj-shamani-fo515-jason-redman
    type: belief
    text: >
      Raj observes that, unlike in countries such as India where someone
      born in a border region may naturally want to join the military after
      witnessing atrocities firsthand, the US is not currently engaged in
      any border war, and asks why people still choose to join the Navy,
      SEALs, or the military when they could become anything in America --
      even a millionaire or billionaire.
