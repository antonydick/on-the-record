  - id: raj-shamani-14053
    person: raj-shamani
    source: raj-shamani-fo402-madhuri-agarwal
    type: observation
    text: >
      Raj introduces the guest as Dr. Madhuri, an expert dermatologist,
      noting that new skin products go viral on social media every day
      (like rice water toner, charcoal masks, Korean creams) and asking
      whether these things actually work, saying the episode will cover
      why India is obsessed with fairness, why tanning happens, whether
      every age group needs a different skincare routine, whether
      drinking more water really makes skin glow, how often sunscreen
      should be reapplied, what oral sunscreen is, and whether
      microneedling, gua sha, collagen, and DNA-based skincare are
      science-based or just trends, urging viewers to watch till the end
      and comment on what they learned.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=5nUd5md4oVA"
      start_timestamp: "00:01:20"
      end_timestamp: "00:02:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...हमारी गेस्ट हैं डॉक्टर माधुरी जो एक एक्सपर्ट डर्मेटोलॉजिस्ट हैं।..."
    notes: >
