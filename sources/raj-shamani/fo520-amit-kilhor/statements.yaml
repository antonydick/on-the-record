  - id: raj-shamani-03606
    person: raj-shamani
    source: raj-shamani-fo520-amit-kilhor
    type: observation
    text: >
      Pushes back on Amit's claim that corruption in the IAS starts from
      an officer's very first posting, saying it can't be that easy or
      simple.
    topic: corruption-skepticism
    verification:
      status: draft
