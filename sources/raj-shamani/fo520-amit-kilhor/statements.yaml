      transcript is not clearly diarized; attributed to Raj based on his
      recurring "aapne bola" (you said) framing device used elsewhere in
      the episode.

  - id: raj-shamani-03607
    person: raj-shamani
    source: raj-shamani-fo520-amit-kilhor
    type: evidence
    text: >
      Asks whether raising IAS/IPS officers' salaries to exceptionally
      high, market-matching levels would stop corruption, citing what he
      describes as his own loose paraphrase of a statement by
      Singapore's first Prime Minister that civil servants must be paid
      at market rate or they will find corrupt ways to match market pay
      themselves.
    topic: civil-service-pay
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
