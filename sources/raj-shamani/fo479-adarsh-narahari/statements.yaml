    source: raj-shamani-fo479-adarsh-narahari
    type: observation
    text: >
      Raj introduces the guest as Adarsh Narahari, MD and founder of
      Primus Senior Living and Marzi, saying he has studied countries
      like Japan, Costa Rica, and Greece where people live healthy and
      happy lives up to 90-100 years, and learned that longevity isn't
      just about medical care but also community, purpose, and
      independence.
    topic: guest-introduction
