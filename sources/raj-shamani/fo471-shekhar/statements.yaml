    text: >
      In his closing outro, Raj thanks viewers for watching the episode
      to the end and says they have three things to do: subscribe to
      the channel right now so the show can bring better and more
      valuable guests, comment telling him what they liked or disliked
      about the episode so mistakes aren't repeated and which guests
      they want to see brought back on the podcast, and share the
      episode with one person since one conversation can change
      someone's life.
