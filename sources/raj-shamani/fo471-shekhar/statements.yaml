    type: observation
    text: >
      Raj introduces the guest as a global supply chain titan who grew
      Walmart's business from $30 million to billions of dollars, born
      in the slums, whose mother had to sell her jewelry for his
      education, and who today is recognized as one of the pioneers who
      helped develop modern package delivery systems — Shekhar
      Natarajan, founder and CEO of Orchestro.AI; he says in this
      episode they will learn why a giant company like NVIDIA could see
      a downturn, what "angelic intelligence" is and whether it will
      change the AI world, and how personal life pain points can
      actually become billion-dollar business ideas; he asks viewers to
      watch the episode to the end and click the link in the
      description to learn more about Orchestro.AI.
    topic: guest-introduction
