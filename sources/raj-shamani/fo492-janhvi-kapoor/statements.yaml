statements:
  - id: raj-shamani-13807
    person: raj-shamani
    source: raj-shamani-fo492-janhvi-kapoor
    type: observation
    text: >
      In the episode's cold open, Raj narrates that Janhvi Kapoor is a
      name constantly in the spotlight, that audiences see the comments
      under her videos, and that the audience starts forming a
      perception of a woman's character based on how she dresses — which
      he calls a tragedy and wrong, but says it is what it is.
    topic: guest-introduction
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=x5lkswNc1Wc"
      start_timestamp: "00:00:00"
      end_timestamp: "00:00:40"
    evidence:
      excerpt: "जानवी कपूर अ नेम दैट्स कांसेंटली इन द स्पॉटलाइट। ... कैरक्टर बेस्ड ऑन हाउ शी ड्रेसेस। इट्स अ ट्रेजेडी इट्स रोंग"
    notes: >
      ~[00:00:20]-[00:00:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT
      for this episode, not yet human-reviewed for transcription
      quality); text is a close English rendering, not a verbatim
      quote. The caption track transliterates Janhvi's English speech
      phonetically into Devanagari script rather than showing the
      original English text.

  - id: raj-shamani-13808
    person: raj-shamani
    source: raj-shamani-fo492-janhvi-kapoor
    type: assertion
    text: >
      Raj frames the podcast as being about what it really feels like to
      be constantly judged, to have people form opinions about you from
      just a few clips, saying this episode is just about success or
      struggle, and about what happens behind the scenes.
    topic: episode-framing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=x5lkswNc1Wc"
      start_timestamp: "00:00:38"
      end_timestamp: "00:00:58"
    evidence:
      excerpt: "कॉन्सटेंटली। टू हेव पीपल फॉर्म ओपिनियंस अबाउट यू फ्रॉम जस्ट अ फ्यू क्लिप"
    notes: >
      ~[00:00:40]-[00:01:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close English rendering, not a verbatim
      quote.

  - id: raj-shamani-13809
    person: raj-shamani
    source: raj-shamani-fo492-janhvi-kapoor
    type: assertion
    text: >
      Raj reads a sponsor mention for Urban Platter, saying that's
      exactly where Urban Platter helps — they make products that feel
      indulgent but are actually cleaner and thoughtfully sourced, so
      that people don't have to choose between discipline and
      enjoyment, because growth is only sustainable when you
      consciously pick things, and that awareness starts from your
      pantry.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=x5lkswNc1Wc"
      start_timestamp: "00:02:40"
      end_timestamp: "00:03:00"
    evidence:
      excerpt: "वेयर अर्बन प्लैटर हेल्प्स। वो ऐसे प्रोडक्ट्स बनाते हैं जो इंडल्जेंट फील ... अवेयरनेस शुरू होती है आपकी पेंट्री से"
    notes: >
      ~[00:02:40]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close English rendering, not a verbatim
      quote. Urban Platter sponsor read, tied thematically to the
      discipline-vs-indulgence discussion in the interview.

