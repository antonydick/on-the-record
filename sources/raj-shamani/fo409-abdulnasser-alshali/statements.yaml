    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching, and the
      outro is heard in two bracketed fragments around a BTS/behind-the-
      scenes segment: he begins "Thank you so much, number two..." and
      later resumes with "...and number three, [share this] episode
      [because] one conversation can change someone's life. I'll see you
      next time. Until then, keep figuring out." This is the standard
      three-part closing ask (subscribe, comment, share) seen across the
      show, though the middle portion is obscured here by overlapping
      behind-the-scenes dialogue in the source video.
