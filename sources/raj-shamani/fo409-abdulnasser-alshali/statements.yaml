    type: observation
    text: >
      Raj introduces the guest by noting that 30 years ago the UAE was a
      desert, and today it is one of the richest, safest, and most
      futuristic countries in the world, and asks how this transformation
      happened. He introduces today's guest as Dr. Abdul Nasir Alshali,
      the ambassador of the UAE to India, saying the episode will cover
      whether the UAE real estate boom is real or hype waiting to crash,
      and the top three opportunities to build wealth in the UAE today
      for people in their 20s.
