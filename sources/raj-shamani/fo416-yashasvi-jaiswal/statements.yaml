statements:
  - id: raj-shamani-14012
    person: raj-shamani
    source: raj-shamani-fo416-yashasvi-jaiswal
    type: observation
    text: >
      Raj introduces the guest by recounting that at age 11 a boy came to
      Mumbai to play cricket and used to live in a tent, doing odd jobs
      like selling pani puri after practice, and that today, at age 23,
      he is India's opener: Yashasvi Jaiswal. He says the episode will
      cover how childhood visualization techniques helped him get to play
      for Team India, how being from a humble background led people to
      insult him, why the Under-19 World Cup was a turning point in his
      career, how he balances self-belief and aggression, and how he
      developed such a resilient mindset and hunger that nothing besides
      his game matters to him.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=lmjQ4ymSqnw"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...जैसी ऑड जॉब्स करता था और आज 23 इयर्स की ऐज में वो इंडिया के ओपनर हैं।..."
    notes: >
      ~[00:02:20]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
