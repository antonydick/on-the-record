  - id: raj-shamani-14013
    person: raj-shamani
    source: raj-shamani-fo416-yashasvi-jaiswal
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook business
      laptops, saying that just as hunger is necessary to win in life and
      cricket, hunger in business only works when you have reliable tools
      that can keep up with your pace, which is why professionals choose
      ASUS ExpertBook laptops built for very-fast durability: they pass
      24 out of 28 military-grade durability tests, the top panel can
      handle up to 30kg of pressure, and the keyboard is spill-resistant
      and tested for over 1 crore keypresses, directing viewers to check
      the link in the description to learn more about the ASUS
      ExpertBook built for very-fast business.
    topic: sponsor-read
    verification:
      status: verified
