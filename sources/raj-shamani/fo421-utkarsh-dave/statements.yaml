  - id: raj-shamani-14001
    person: raj-shamani
    source: raj-shamani-fo421-utkarsh-dave
    type: observation
    text: >
      Raj introduces the guest as Utkarsh Dave, an advocate at the
      Gujarat High Court, and says he explained that India has only 21
      judges per 1 million people, that lower courts in India have 4.5
      crore pending cases, and that even if the backlog were cleared at
      the current pace with no new cases added, it would take 300 years
      to close all cases.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=giZk-zQKGSI"
      start_timestamp: "00:00:20"
