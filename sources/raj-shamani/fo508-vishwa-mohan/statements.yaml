    source: raj-shamani-fo508-vishwa-mohan
    type: observation
    text: >
      Raj challenges the guest: if he believes the degree-based college
      education system is completely broken, why does his own institute
      still attach itself to degrees, giving out a B.Tech affiliated with
      an existing university — effectively becoming part of the same
      "broken system" it criticizes.
