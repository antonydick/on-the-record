  - id: raj-shamani-01205
    person: raj-shamani
    source: raj-shamani-fo508-vishwa-mohan
    type: observation
    text: >
      Raj asks Vishwa Mohan — noting that he has worked at Amazon,
      Oracle, and LinkedIn, has sat in hiring rooms, and has seen people
      hired from the other side as well as having been hired himself —
      what a world-class hiring manager or HR person at a company like
      Amazon looks at when comparing a resume from an IIT against one
      from MIT or Stanford, and whether the MIT/Stanford candidate
      actually gets preference.
    topic: iit-vs-mit-hiring
