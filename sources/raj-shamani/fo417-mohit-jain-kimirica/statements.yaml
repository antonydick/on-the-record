  - id: raj-shamani-14010
    person: raj-shamani
    source: raj-shamani-fo417-mohit-jain-kimirica
    type: observation
    text: >
      Raj introduces the guest as Mohit Jain, co-founder of Kimirica, an
      Indian luxury self-care brand that today owns 70% market share in
      its industry and is known worldwide, saying the episode will cover
      how the business started, where the idea came from, how a 500-soap
      order was completed without a manufacturing unit, how they
      convinced luxury hotels to buy their products, whether bribes are
      needed to work in the hotel industry, what they learned from the
      Chinese mindset and how they then out-competed Chinese products and
      beat them in India, and urges viewers to watch till the end and
      comment on what they learned from the episode.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=Iyk1MbNkU1s"
      start_timestamp: "00:02:40"
      end_timestamp: "00:03:40"
