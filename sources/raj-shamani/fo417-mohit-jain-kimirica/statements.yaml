    type: recommendation
    text: >
      Raj reads a sponsored segment for Outskill, describing it as the
      world's first AI educational platform running a 2-day live AI
      training program (Saturday and Sunday, 10am to 7pm) where
      participants can learn 10+ AI tools to boost productivity, prompt
      engineering without coding, data analysis, task automation, and how
      to generate presentations, videos, and images using AI within
      minutes, noting the program is normally priced but is free via the
      link in the description to secure a seat.
    topic: sponsor-read
