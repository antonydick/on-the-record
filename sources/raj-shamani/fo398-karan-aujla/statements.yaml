  - id: raj-shamani-14065
    person: raj-shamani
    source: raj-shamani-fo398-karan-aujla
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests, comment on
      what they liked about the episode and which guests they would like
      to see on the podcast, and share the episode with at least one
      person who could get a positive change in their life from it,
      saying one conversation can change someone's life. He signs off by
      telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=8OU4D731NVE"
      start_timestamp: "01:16:40"
      end_timestamp: "01:17:00"
