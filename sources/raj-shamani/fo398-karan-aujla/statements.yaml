statements:
  - id: raj-shamani-14063
    person: raj-shamani
    source: raj-shamani-fo398-karan-aujla
    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, saying that while
      parties, events, weddings, and concerts sound exciting, organizing
      them is very stressful, especially moving large amounts of
      equipment, which is why he uses Porter, whose two-wheelers deliver
      small items carefully, such as speakers borrowed from a friend for
      a house party, and whose trucks safely deliver large items, such as
      logistics for a business event, calling it a convenient delivery
      service and directing viewers to click the link in the description
      to learn more.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=8OU4D731NVE"
      start_timestamp: "00:02:00"
      end_timestamp: "00:02:40"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...सबसे बड़ा प्रॉब्लम कि इतने सारे सामान को मूव करना इट्स..."
    notes: >
      ~[00:02:00]-[00:02:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT for
      this episode, not yet human-reviewed for transcription quality);
      text is a close paraphrase, not a verbatim quote. This is a new,
      distinct Porter sponsor-read claim-set in the corpus catalogue
      (house-party/business-event logistics framing: two-wheelers for
      small items, trucks for large items), distinct from the previously
      catalogued two-wheeler/three-wheeler/truck, Packers & Movers,
      9/10/14/17ft truck weight-capacity, combined 20kg+4500kg,
      11-years-trusted-partner, and festival-season/business-hampers
      variants. Verified via on-screen YouTube caption at video timestamp
      ~130s, matching exactly.

  - id: raj-shamani-14064
    person: raj-shamani
    source: raj-shamani-fo398-karan-aujla
    type: observation
    text: >
      Raj introduces the guest as Karan Aujla, a singer and lyricist
      known globally for his Punjabi music, saying the episode will
      cover why he doesn't feel safe living in Canada, why he writes
      songs from a girl's point of view, the stories behind some of his
      famous songs, whether he still feels the void of losing his
      parents, what his relationship with his wife is like, and why he
      still feels lonely despite having become so successful.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=8OU4D731NVE"
      start_timestamp: "00:02:40"
      end_timestamp: "00:03:00"
