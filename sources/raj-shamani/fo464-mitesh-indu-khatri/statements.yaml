  - id: raj-shamani-13891
    person: raj-shamani
    source: raj-shamani-fo464-mitesh-indu-khatri
    type: recommendation
    text: >
      Raj tells viewers that if they want to learn the techniques and
      tools discussed to achieve their relationship and life goals, the
      link is in the description, and notes that although such courses
      and tools are usually very expensive, the guests have given
      viewers this link for free because they are viewers of the show.
    topic: guest-offer-promotion
    verification:
