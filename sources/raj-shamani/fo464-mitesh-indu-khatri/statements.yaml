    type: observation
    text: >
      Raj introduces the guests by saying they trained the mindset of
      Harmanpreet Kaur, captain of India's World Cup-winning women's
      cricket team, have worked with 300+ Fortune 500 companies, and
      have run training programs in more than 25 countries globally. He
      names them as Mitesh and Indu Khatri, India's most trusted Law of
      Attraction coaches and national bestselling authors, and notes they
      have been frequent guests on the podcast before.
    topic: guest-introduction
