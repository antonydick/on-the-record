  - id: raj-shamani-14017
    person: raj-shamani
    source: raj-shamani-fo414-shikhar-dhawan
    type: observation
    text: >
      Raj introduces the guest as a cricketer always seen in attack mode
      on the field but smiling, joking, and fun off the field, though
      nobody knows how he struggled behind the scenes with rejection,
      loss, and insecurity: Shikhar Dhawan, Indian opener, a cricketer who
      built his career through the strength of his mindset. He says the
      episode will cover the most painful part of his public divorce, how
      he handles being away from his son as a father, how he trains
      himself to fight back after a bad innings, and how he developed a
      mindset that lets external noise not affect him in cricket or life.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=J0TkybCKaJI"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:00"
