  - id: raj-shamani-13959
    person: raj-shamani
    source: raj-shamani-fo438-vikas-divyakirti
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can keep bringing valuable guests, comment on
      what they liked about the episode and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person who might get a chance to make a positive change in their
      life from it, saying one conversation can change someone's life. He
      signs off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=2hl-uVjXZzc"
      start_timestamp: "01:49:00"
      end_timestamp: "01:49:20"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...अब आपको पता है आपको तीन चीजें करनी है। सबसे..."
    notes: >
      ~[01:49:00]-[01:49:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Combined variant of the standard closing outro (subscribe +
      feedback/guest-suggestion + share), plus the "keep figuring out"
      sign-off, wording near-identical to fo442-runjhun-sharma's and
      fo440-sandeep-ghosh's outros. Verified via on-screen YouTube
      caption at video timestamp ~6543s, matching exactly.
