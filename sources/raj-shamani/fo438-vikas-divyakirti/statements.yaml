statements:
  - id: raj-shamani-13957
    person: raj-shamani
    source: raj-shamani-fo438-vikas-divyakirti
    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, the episode's title
      sponsor, saying that just as one can have different conversations
      with the same person, Porter adjusts to each customer's multiple
      needs, having started with two-wheelers and small trucks and now
      having introduced 9, 10, 14, and 17-foot trucks that can easily
      carry 1,700 kg to 4,500 kg of goods, delivering every size of
      shipment smoothly and hassle-free, and tells viewers not to
      overthink it next time they need to send something, directing them
      to the link in the description for more information.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=2hl-uVjXZzc"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...हर कस्टमर की मल्टीपल जरूरतों के हिसाब से एडजस्ट करते हैं। टू व्हीलर्स..."
    notes: >
      ~[00:02:20]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT
      for this episode, not yet human-reviewed for transcription
      quality); text is a close paraphrase, not a verbatim quote. This
      is a third distinct Porter sponsor-read claim-set (9/10/14/17-foot
      trucks, 1,700-4,500 kg capacity), separate from the two-wheeler/
      three-wheeler/truck logistics variant in fo443-dinesh-agarwal and
      the Packers & Movers variant in fo454-saurabh-mukherjea, now
      catalogued in this corpus. Verified via on-screen YouTube caption
      at video timestamp ~168s, matching exactly.

