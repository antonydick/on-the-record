      a close English translation of the original Hindi/Hinglish, not
      a verbatim quote. Standard host-read plug for the "Figuring Out
      AI" community.

  - id: raj-shamani-02402
    person: raj-shamani
    source: raj-shamani-fo514-vaibhav-sisinty
    type: observation
    text: >
      Raj says he read a tweet by Vaibhav about Mark Zuckerberg,
      describing a report that Zuckerberg is building an AI to do his
      own job, and remarks that this means the CEO of one of the
      world's most powerful companies is building his own AI so it can
      take over his role, then asks Vaibhav what that means.
    topic: zuckerberg-ai-job
    verification:
