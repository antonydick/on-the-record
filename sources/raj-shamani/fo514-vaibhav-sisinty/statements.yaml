  - id: raj-shamani-02404
    person: raj-shamani
    source: raj-shamani-fo514-vaibhav-sisinty
    type: observation
    text: >
      Partway through a philosophical discussion about AI and job
      losses, Raj remarks that they had gone too philosophical,
      apologizes, and redirects the conversation back to the earlier
      topic of "observed exposure" and how many jobs in India might be
      at risk, asking Vaibhav to reopen the chart he had shown earlier.
    topic: episode-redirect
