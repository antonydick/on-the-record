    source: raj-shamani-fo514-vaibhav-sisinty
    type: experience
    text: >
      Raj says that after every episode with Vaibhav he spends his
      entire next Saturday or Sunday applying what he learned; he
      recalls that after a previous episode about building "skills," he
      built nine skills over two days, including waking up at 7am one
      Sunday and working on it from morning until night.
    topic: weekend-skill-building
