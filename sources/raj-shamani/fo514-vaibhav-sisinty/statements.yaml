      Vaibhav was demoing live, but attribution to Raj rather than
      Vaibhav is not fully certain.

  - id: raj-shamani-02406
    person: raj-shamani
    source: raj-shamani-fo514-vaibhav-sisinty
    type: observation
    text: >
      Raj introduces a new closing segment for the show that he says he
      wants to try doing in every episode, provisionally called the
      "Countdown Clock": he gives the guest 60 seconds to pause and
      think, then asks them to boil the entire episode down into three
      key, highly actionable steps or insights for viewers.
    topic: countdown-clock-format
    verification:
