statements:
  - id: raj-shamani-02401
    person: raj-shamani
    source: raj-shamani-fo514-vaibhav-sisinty
    type: assertion
    text: >
      Raj says that he and Vaibhav together built a free, AI-focused
      community that teaches AI in depth, for anyone who wants to learn
      to fully utilize AI to make their work faster and better, with
      the join link in the video description.
    topic: ai-community-plug
    verification:
      status: draft
