  - id: raj-shamani-02407
    person: raj-shamani
    source: raj-shamani-fo514-vaibhav-sisinty
    type: experience
    text: >
      Raj says he is genuinely grateful for what he learns from these
      episodes with Vaibhav, and that after every episode he sends the
      recording to four or five of his employees, assigning each of
      them a different part to fully go through and telling them that
      doing so is now their job.
    topic: gratitude-employee-homework
    verification:
