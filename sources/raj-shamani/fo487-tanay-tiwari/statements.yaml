  - id: raj-shamani-13822
    person: raj-shamani
    source: raj-shamani-fo487-tanay-tiwari
    type: observation
    text: >
      In the episode's cold open, Raj narrates that Tanay Tiwari, one of
      the most loved cricket commentators, is back, and that in this
      episode he explains how IPL auctions happen, how captaincy is
      decided, and shares some IPL secrets that every cricket fan wants
      to know — adding that cricket fans should not miss this episode.
    topic: guest-introduction
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=t0ZYA4-_XCs"
      start_timestamp: "00:00:30"
      end_timestamp: "00:00:44"
    evidence:
      excerpt: "वन ऑफ़ द मोस्ट लव्ड क्रिकेट कमेंटेटर्स तने ... के कुछ ऐसे सीक्रेट्स भी बताए, जो हर क्रिकेट फैन जानना चाहता है। अगर आप एक"
    notes: >
      ~[00:00:20]-[00:00:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions (freshly fetched and consolidated from the raw VTT
      for this episode, not yet human-reviewed for transcription
