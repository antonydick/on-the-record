  - id: raj-shamani-11408
    person: raj-shamani
    source: raj-shamani-fo559-sahar-yousef
    type: experience
    text: >
      Raj says he learned through hosting his own podcast that when his
      phone is right next to him, his attention during the conversation
      drops noticeably; because of this he now always hands his phone
      away during recording (out of the room or elsewhere) and keeps it
      on airplane mode, arriving without needing it about 30 minutes
      beforehand.
    topic: phone-podcast-focus
    verification:
      status: draft
      verified_at: null
