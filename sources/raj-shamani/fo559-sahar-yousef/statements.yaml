      Raj says that one thing he consistently fails at is waking up very
      early. He says he has tried many times and really pushed hard, and
      has only managed to train himself to wake up around 7:30-8:00 AM,
      but still cannot join the "5 AM club."
    topic: early-rising-struggle
    verification:
