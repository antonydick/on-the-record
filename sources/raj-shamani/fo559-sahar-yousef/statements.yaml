  - id: raj-shamani-11404
    person: raj-shamani
    source: raj-shamani-fo559-sahar-yousef
    type: experience
    text: >
      Raj says this happens to him often: he'll have an irrational belief
      about his work, and even while sitting somewhere at random in the
      afternoon he'll start noticing "spots" of opportunity that suddenly
      appear and eventually turn into valuable opportunities worth
      millions of dollars, which he then goes on to capture.
    topic: opportunity-belief
