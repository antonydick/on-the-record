  - id: raj-shamani-13830
    person: raj-shamani
    source: raj-shamani-fo485-khan-sir
    type: assertion
    text: >
      Raj reads a sponsor mention for Porter, saying that when you need
      to send or receive something and it's hard to find the right
      option, especially for smaller items, Porter's two-wheelers can
      easily handle up to 20 kg — and the best part is that the price
      shown on the app is the final price, so you don't have to
      negotiate rates and their partners will never ask for extra cash,
      letting you focus on your work tension-free while a reliable
      expert carries your item; he mentions the link is in the
      description to learn more.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=VAtgcFtqIqw"
      start_timestamp: "00:02:43"
      end_timestamp: "00:03:03"
    evidence:
      excerpt: "इसीलिए आई सजेस्ट पोर्टर इनके टू व्हीलर्स कैन इजीली हैंडल अप टू 20 kg एंड द बेस्ट"
    notes: >
      ~[00:02:20]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
