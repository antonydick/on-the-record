  - id: raj-shamani-13980
    person: raj-shamani
    source: raj-shamani-fo429-nawazuddin-siddiqui
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook, saying that
      success in film or business goes to those who can handle pressure,
      not just talent, and that just as Nawaz turned every pressure in
      his journey into performance, business professionals choose the
      ASUS ExpertBook, a business laptop built for extreme durability
      that has cleared 24 of 28 military-grade tests, whose top panel can
      easily handle up to 30 kg of pressure, and which has a spill-
      resistant keyboard, calling it the perfect partner for a daily
      grind, and directing viewers to check it out on Flipkart via the
      link in the description.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=IcIo8A4Jw0k"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...प्रोफेशनल्स चूज़ करते हैं Asus एक्सपर्ट बुक। एक ऐसा बिजनेस लैपटॉप जो बना है..."
    notes: >
      ~[00:02:20]-[00:03:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This ASUS ExpertBook sponsor-read claim-set (24-of-28 military-
      grade tests cleared, 30 kg top-panel pressure tolerance) matches
      the variant previously catalogued in this corpus from
      fo457 exactly, rather than being a new distinct claim-set. Verified
      via on-screen YouTube caption at video timestamp ~158s, matching
      exactly.

  - id: raj-shamani-13981
    person: raj-shamani
    source: raj-shamani-fo429-nawazuddin-siddiqui
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests and ask the
      questions viewers want answered, comment on which other guests they
      want to see on the podcast, and share the episode with at least one
      person, saying one conversation is enough to bring a positive
      change to someone's life. He signs off by telling viewers to keep
      figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=IcIo8A4Jw0k"
      start_timestamp: "01:47:40"
      end_timestamp: "01:48:00"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...लिए अब आपको तीन चीजें करनी है। नंबर वन इस चैनल को सब्सक्राइब कर लो..."
    notes: >
      ~[01:47:40]-[01:48:00] Transcribed via YouTube Hindi/Hinglish
