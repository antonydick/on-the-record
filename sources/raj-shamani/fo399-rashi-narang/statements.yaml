  - id: raj-shamani-14062
    person: raj-shamani
    source: raj-shamani-fo399-rashi-narang
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring better and more valuable guests,
      comment on what they liked and disliked about the episode so the
      show can avoid repeating mistakes and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person, saying one conversation can change someone's life. He signs
      off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=-mBFOLc-Gyk"
      start_timestamp: "01:24:40"
      end_timestamp: "01:25:20"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...और वैल्यूुएबल गेस्ट हम ला पाएंगे आपके लिए। नंबर टू मुझे कमेंट्स में बताओ इस..."
    notes: >
      ~[01:24:40]-[01:25:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Standard combined closing outro (subscribe + feedback/guest-
      suggestion + share) plus the "keep figuring out" sign-off, wording
      near-identical to other recent episodes' outros. Verified via
      on-screen YouTube caption at video timestamp ~5084s, matching
      exactly.
