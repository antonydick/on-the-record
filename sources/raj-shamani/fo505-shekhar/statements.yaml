  - id: raj-shamani-00617
    person: raj-shamani
    source: raj-shamani-fo505-shekhar
    type: evidence
    text: >
      Recounts a tweet's argument that once a country's per-capita GDP
      reaches around $8,000, people start demanding better government
      services (such as clean roads and clean air) because by that point
      the government also has enough resources to deliver them -- and
      says India's per-capita GDP is currently only around $2,000-3,000,
      meaning that stage is still a long way off (a post-2030 story).
    topic: gdp-per-capita-threshold
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:42:47]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. This same claim also appears verbatim in the
      episode's cold-open highlight montage at the very start of the
      video, directly following the tweet-reading remark in
      raj-shamani-00618, supporting that both are part of one continuous
      statement by the host.

  - id: raj-shamani-00618
    person: raj-shamani
    source: raj-shamani-fo505-shekhar
    type: evidence
    text: >
      Says he was reading a tweet, written by an American, arguing that
      Western issues and opinions (such as work-life-balance debates,
      shorter work weeks, and carbon credits) should only matter once a
      country has Western-level salaries and tax rates; says the tweet
      was defending N.R. Narayana Murthy against people mocking his call
      for a 70-hour work week, on the grounds that India's per-capita
      income, infrastructure, and social conditioning are not at Western
      levels.
    topic: work-life-balance-debate
    verification:
      status: draft
