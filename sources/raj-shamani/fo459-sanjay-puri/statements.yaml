  - id: raj-shamani-13904
    person: raj-shamani
    source: raj-shamani-fo459-sanjay-puri
    type: observation
    text: >
      Raj introduces the guest as Sanjay Puri, the principal architect
      of Sanjay Puri Architects, who will explain the most common
      mistakes people make when building a house, how to naturally cool
      a home without air conditioning, and cost-efficient hacks to make
      a home look bigger and grander. He also tells viewers to check the
      link in the description to learn more about Birla Estates and the
      Real Advice initiative.
    topic: guest-introduction
