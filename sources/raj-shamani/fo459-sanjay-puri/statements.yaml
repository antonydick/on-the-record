    type: recommendation
    text: >
      Raj reads a sponsored segment for Birla Estates, the real estate
      arm of the Aditya Birla Group, describing their "Real Advice"
      initiative that brings experts and real experiences onto a single
      platform to help people make better-informed real estate
      decisions, and says this episode is the first in a special series
      with them about how to make the best decisions for one's home.
    topic: sponsor-read
