    type: observation
    text: >
      Raj introduces the guest as Amit Dubey, one of India's top cyber
      security experts, saying he will explain how a simple phone call
      can let someone hack an account, what Facebook tracks from a
      phone, how a single OTP can compromise an entire financial system,
      how Gmail can be hacked through a phone call, whether Aadhaar card
      details can be misused, and how quantum computing will change the
      face of future cyberattacks.
