  - id: raj-shamani-13909
    person: raj-shamani
    source: raj-shamani-fo457-rajiv-talreja
    type: recommendation
    text: >
      Raj reads a sponsored segment for the ASUS ExpertBook P Series,
      saying it passes 24 out of 28 military-grade tests, that its
      screen's top panel can withstand up to 30 kg of pressure, and
      that it has a spill-resistant keyboard tested for 10 million
      keystrokes, plus dependable ASUS support available Monday to
      Saturday across 15,500+ pin codes in India and global warranty in
      80 countries, telling viewers to check Flipkart via the link in
      the description to learn more.
    topic: sponsor-read
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=JqxZGXQf0qg"
      start_timestamp: "00:03:20"
      end_timestamp: "00:04:00"
    evidence:
      excerpt: "28 मिलिट्री ग्रेड टेस्ट पास करता है और इसकी स्क्रीन का टॉप पैनल अप टू 30 kg तक"
    notes: >
      ~[00:03:20]-[00:04:00] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This matches the "30kg-panel/24-of-28-military-tests" ASUS
      ExpertBook claim-set previously catalogued in this corpus,
      distinct from the "25%-faster/call-center-hours" and "50+ TOPS
      NPU/Copilot+ AI" variants seen in other episodes.

  - id: raj-shamani-13910
    person: raj-shamani
    source: raj-shamani-fo457-rajiv-talreja
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring more valuable guests and ask the
      questions viewers want, comment on which guests they want to see
      on the podcast, and share the episode with at least one person
      because one conversation is enough to bring a positive change to
      someone's life. He signs off by telling viewers to keep figuring
      out until next time.
    topic: audience-engagement
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=JqxZGXQf0qg"
      start_timestamp: "01:59:40"
      end_timestamp: "02:00:44"
    evidence:
      excerpt: "थैंक यू सो मच ये एपिसोड एंड तक देखने के"
    notes: >
      ~[01:59:40]-[02:00:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This is the guest-suggestion + share variant of the standard
      closing outro, without the separate feedback (what did we do
      right/wrong) line seen in most other episodes, plus the "keep
      figuring out" sign-off.
