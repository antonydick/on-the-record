  - id: raj-shamani-13969
    person: raj-shamani
    source: raj-shamani-fo434-sajeev-nair
    type: observation
    text: >
      Raj introduces the guest as Dr. Sajeev Nair, serial entrepreneur,
      longevity researcher, and founder of Vieroots and the World
      Biohack Summit, who introduced the concept of biohacking and
      epigenetic testing in India, and says they will learn how some
      people's genes trigger heart attacks and how an AI health coach
      can suggest daily lifestyle and nutrition changes based on blood
      and genetic data, noting that while you cannot change your genes
      you can control them. He urges viewers to watch till the end since
      his own genetic test report is discussed at the end of the
      episode.
    topic: guest-introduction
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=zrdFjOltFJ0"
      start_timestamp: "00:02:00"
