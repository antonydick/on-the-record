  person: raj-shamani
  source: raj-shamani-fo510-jayant
  type: belief
  text: 'Asks why, even though India is repeatedly described -- with plenty of data behind it -- as one of the fastest-growing economies in the world, people at an individual level, including salaried employees like himself, feel poorer rather than richer, as if inflation is eroding their money faster than the economy is growing.

    '
