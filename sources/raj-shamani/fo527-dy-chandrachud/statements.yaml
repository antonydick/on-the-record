  type: belief
  text: 'Raj argues that today''s laws and legal system feel as though someone wrote them in the 1940s-50s for the India that existed at that time, and that although today''s India is very different, it still has to follow that same system every year — meaning today''s generation has to live up to the standards of right and wrong set by people roughly 70 years older than them.

    '
