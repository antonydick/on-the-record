  source: raj-shamani-fo527-dy-chandrachud
  type: observation
  text: 'After Chandrachud lists Delhi University classmates who went on to prominent careers (e.g. Arvind Subramanian as Chief Economic Advisor, K.P. Krishnan, Ajay Banga at the World Bank), Raj remarks that, if there had to be one reason, it''s that all of them performed brilliantly in life.

    '
