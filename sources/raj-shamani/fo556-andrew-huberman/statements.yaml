  - id: raj-shamani-10804
    person: raj-shamani
    source: raj-shamani-fo556-andrew-huberman
    type: experience
    text: >
      Reflecting on his own generation, says the real problem is that
      many young people like him watch people like Huberman and think
      they'll learn everything from them, but then half the things they
      talk about on a Monday, after getting excited watching such
      content, have gone nowhere by Thursday -- nothing has really
      changed, and most people don't end up making much real change in
      their lives.
    topic: motivation-vs-action
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
