statements:
  - id: raj-shamani-10801
    person: raj-shamani
    source: raj-shamani-fo556-andrew-huberman
    type: assertion
    text: >
      Frames the central challenge of the episode: based on everything
      Huberman has learned, experimented with, watched fail, and gained
      both from others' knowledge and his own experiments, if given a
      25-year-old person right now with the sole task of making them
      "mentally dangerous" over the next 10 years -- meaning an
      unbreakable, unshakeable mindset like a high performer who never
      breaks under pressure, who can handle everything in their life, and
      who can figure out exactly what to do and then actually do it --
      where would Huberman start?
    topic: mentally-dangerous-challenge
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:02:57]-[00:07:47] (a condensed version of this same framing is
      also used in the episode's cold-open trailer at
      ~[00:00:40]-[00:02:04]). Transcribed via YouTube Hindi
      auto-captions; text is a close English translation of the original
      Hindi/Hinglish, not a verbatim quote. This whole passage is heavily
      merged with the guest's reply in the ASR text with no
      diarization, but the near-exact match with the cold-open trailer
      clip gives reasonably high confidence this framing/question is
      Raj's.

