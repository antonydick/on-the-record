      In a puzzle posed to him about buying either two intact mugs for 100
      rupees, or two intact mugs plus one broken mug for the same 100
      rupees, Raj picked the option that included the broken mug, and
      explained that he felt like he was getting something extra by
      choosing it.
    topic: decision-making-bias-example
