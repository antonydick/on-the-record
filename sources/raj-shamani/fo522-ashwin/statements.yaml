statements:
  - id: raj-shamani-04001
    person: raj-shamani
    source: raj-shamani-fo522-ashwin
    type: observation
    text: >
      Every year, 11 million Indian students finish high school, but not a
      single Indian university ranks among the world's top 100 universities.
      Because of this, India's most talented students leave the country to
      earn degrees abroad.
    topic: indian-higher-education-gap
