      not a verbatim quote. This was said during a live role-play exercise
      where Ashwin asked Raj to demonstrate how he would open an interview
      with him; the transcript has no speaker labels, so attribution to Raj
      (via first-person "I" statements about his own interviewing approach,
      addressed to "Ashwin") should be verified against the recording.

  - id: raj-shamani-04009
    person: raj-shamani
    source: raj-shamani-fo522-ashwin
    type: mechanism
    text: >
      Raj illustrated the difference between open and closed questions with
      an example: asking "Ashwin, tell me what people should do" is an open
      question, while asking "should someone go to university or join a
      startup" is a closed question, because it already offers two
      pre-set options.
    topic: open-vs-closed-questions
    verification:
      status: draft
