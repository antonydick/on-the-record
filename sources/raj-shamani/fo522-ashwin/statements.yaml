  - id: raj-shamani-04008
    person: raj-shamani
    source: raj-shamani-fo522-ashwin
    type: mechanism
    text: >
      Describing his approach to opening an interview, Raj said he starts
      by thinking about his audience -- what useful information a guest
      like Ashwin can give them and how best to present it -- and that he
      prefers to ask an open question, such as "How would you do this? Give
      me some advice," rather than a closed one.
    topic: raj-interview-technique
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
