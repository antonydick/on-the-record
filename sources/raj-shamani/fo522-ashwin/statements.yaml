      Raj pointed out what he saw as a contradiction in Ashwin's answer:
      Ashwin said he wanted the discussion to work as a full masterclass to
      improve people's careers, while also wanting to answer very small,
      short-term questions -- and noted that these two approaches serve
      different audiences.
    topic: podcast-audience-framing
