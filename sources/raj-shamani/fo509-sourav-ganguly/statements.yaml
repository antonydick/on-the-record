  - id: raj-shamani-01404
    person: raj-shamani
    source: raj-shamani-fo509-sourav-ganguly
    type: observation
    text: >
      States that when Ganguly became captain in 2000, he inherited a
      team that was struggling in the aftermath of the match-fixing
      scandal, that trust in Indian cricket had dropped, and that in
      the preceding ten years India had won only around two away Test
      matches.
    topic: indian-cricket-history-2000
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:12:02] (the same framing also appears in the episode's
      cold-open at ~[00:00:00], reusing the same audio). Transcribed
      via YouTube Hindi auto-captions; text is a close English
      translation of the original Hindi/Hinglish, not a verbatim quote.
      The "roughly two away Tests in ten years" figure is Raj's own
      framing as stated in his question, not an independently confirmed
      statistic.

