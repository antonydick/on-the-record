      saying it's built for professionals and made for durability — its
      top panel can withstand up to 30 kg of weight and it passes 24
      out of 28 military-grade tests — and mentions their call center
      is open 9am-9pm Monday to Saturday with on-site warranty in over
      15,500 pin codes so work never stops.
