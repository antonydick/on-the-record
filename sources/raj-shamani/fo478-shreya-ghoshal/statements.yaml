    text: >
      In his closing outro, Raj thanks viewers for watching the episode
      to the end and says they have three things to do: subscribe to
      the channel so the show can bring more valuable guests and ask
      them the questions viewers want asked, comment telling him which
      other guests they want to see on the podcast, and share the
      episode with one person since one conversation is enough to
      change someone's life.
    topic: audience-engagement
