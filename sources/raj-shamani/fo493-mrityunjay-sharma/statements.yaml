  - id: raj-shamani-13805
    person: raj-shamani
    source: raj-shamani-fo493-mrityunjay-sharma
    type: belief
    text: >
      At the close of the interview, Raj says the next state in the
      series will be Assam, that he thinks this could become an iconic
      series for young people in the country like him, and that the
      earlier Bihar episode in the series was exceptionally good.
    topic: state-series-value
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=7B9ouInLN9E"
      start_timestamp: "02:20:00"
      end_timestamp: "02:20:36"
    evidence:
      excerpt: "आएंगे आई पिक बिकॉज आई थिंक जस्ट दैट वन सीरीज ... यंग पीपल लाइक मी। [संगीत] वो एक आइकॉनिक सीरीज ... जिस तरीके से आप समझाते हो बहुत अच्छा है। लाइक आई रियली लाइक बिहार वाज़ एक्सेप्शनली"
