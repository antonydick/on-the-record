  - id: raj-shamani-13802
    person: raj-shamani
    source: raj-shamani-fo493-mrityunjay-sharma
    type: assertion
    text: >
      Before starting the episode, Raj says their goal is to take an
      Indian podcast to a global level, and that as of today they need
      20.8 million subscribers to get there — so if the channel has
      provided any value, he asks viewers to subscribe, noting it's
      completely free and costs nothing, and mentions the audio
      experience of the episode is also available by following the
      show on Spotify.
    topic: subscriber-goal-appeal
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=7B9ouInLN9E"
      start_timestamp: "00:02:15"
      end_timestamp: "00:02:35"
    evidence:
      excerpt: "आज का एपिसोड स्टार्ट करने से पहले मेरी आप लोगों से एक रिक्वेस्ट ... चाहिए। तो अगर हमारे चैनल ने आपको थोड़ी भी वैल्यू प्रोवाइड करी है तो प्लीज"
    notes: >
      ~[00:02:00]-[00:02:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close English rendering, not a verbatim
      quote. Near-identical wording (including the same 20.8-million
      figure) to the appeal seen in fo494-suyash-saraf and
      fo496-arpit-agrawal, a reused script across episodes recorded
      around the same period.

  - id: raj-shamani-13803
    person: raj-shamani
    source: raj-shamani-fo493-mrityunjay-sharma
    type: belief
    text: >
      Raj tells the guest that every time he comes on to discuss a
      state and fully decode its history, he genuinely likes it, and
      that he feels he learns more about the history of India's states
      from these conversations than he ever read in his school
      textbooks — adding that he thinks they should do this for every
      state, one state at a time.
    topic: state-series-value
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: "Antony Dick"
      source_url: "https://www.youtube.com/watch?v=7B9ouInLN9E"
      start_timestamp: "00:02:55"
      end_timestamp: "00:03:15"
    evidence:
      excerpt: "उनकी हिस्ट्री पैदा आई रियली लाइक दैट आई फील आई जेनुइनली एंड आई एम टू से दिस"
    notes: >
      ~[00:03:00]-[00:03:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close English rendering, not a verbatim
      quote.

