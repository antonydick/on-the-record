    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks Bremmer whether he doesn't believe in "prospect theory" —
      the idea that if you feel your power is about to be taken away, you
      become more willing to take risky actions rather than avoid risk —
      in relation to Trump.
    topic: trump-risk
    verification:
