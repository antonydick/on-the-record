    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj observes that Bremmer speaks very openly about everything, is
      very honest about his views across all platforms and media, and
      doesn't shy away from making judgment calls or calling truth as
      truth, and asks him whether he ever feels afraid.
    topic: bremmer-candor
