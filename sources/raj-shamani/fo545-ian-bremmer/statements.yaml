statements:
  - id: raj-shamani-08601
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj introduces Ian Bremmer as a political scientist and one of the
      world's leading experts in geopolitics, and frames the episode as
      being for anyone who wants to understand where the world is headed,
      why the global order is breaking down, how governments, technology,
      and power are being redefined, and what impact that will have on the
      viewer's future.
    topic: episode-intro
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:00:18]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. This is part of the cold-open/intro narration before
      the interview proper begins.

  - id: raj-shamani-08602
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: belief
    text: >
      Raj says he thinks American companies are the real superpowers — not
      America as an American nation-state.
    topic: us-corporate-power
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:06:06]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Attribution to Raj (rather than Bremmer) is confirmed
      later in the transcript (~[00:19:08]) when Bremmer says "you said you
      think American companies are really the leaders" while recapping this
      exchange.

  - id: raj-shamani-08603
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: belief
    text: >
      Raj says he believes it is a handful of companies, rather than the
      American government, that are deciding where and how things will go
      — though he adds that this view of his could be biased, or the effect
      could be very small; he isn't sure.
    topic: us-corporate-power
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:06:06]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Immediately follows raj-shamani-08602 in the same
      turn.

  - id: raj-shamani-08604
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj asks Bremmer whether he doesn't think the US is still trying to
      protect its interests worldwide, and in some cases still asserts its
      dominance, telling other countries: if you don't follow this
      particular way of doing trade or business, we will punish you.
    topic: us-power
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:14:38]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. This is Raj pushing back on Bremmer's earlier claim
      that the US no longer wants to be a superpower/leader.

  - id: raj-shamani-08605
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj observes that on Russia and Ukraine, the US's position amounts to
      saying it won't fully back Ukraine but will still push for sanctions
      on Russia, insisting the whole world stop trading with Russia — and
      that any country that doesn't stop trading with Russia is treated as
      an enemy.
    topic: us-russia-sanctions
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:15:07]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Continues the same turn as raj-shamani-08604. One
      short clause in this passage was too garbled in the ASR to confidently
      render and was omitted.

  - id: raj-shamani-08606
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj notes that on Taiwan, the US has its own interests there and has
      openly said that if China ever tries to seize Taiwan, the US will
      defend it.
    topic: taiwan
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:15:53]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Concludes the same turn as raj-shamani-08604 and
      raj-shamani-08605.

  - id: raj-shamani-08607
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: belief
    text: >
      Raj agrees with Bremmer's assessment that the United States is still,
      overall, the most powerful country in the world.
    topic: us-power
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:17:43]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Rendered as "मुझे भी ऐसा ही लगता है" (repeated twice)
      immediately after Bremmer states this view; attribution to Raj as the
      agreeing party is inferred from the back-and-forth structure and
      carries some uncertainty.

  - id: raj-shamani-08608
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks Bremmer who, in his view, are the three most powerful people
      today who could shape the future.
    topic: powerful-people
    verification:
      status: draft
      verified_at: null
      verified_by: null
