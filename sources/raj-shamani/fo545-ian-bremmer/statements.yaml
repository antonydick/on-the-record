      excerpt: null
    notes: >
      ~[00:59:52]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote.

  - id: raj-shamani-08612
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: evidence
    text: >
      Raj says he was reading a report stating that in the 1950s, more than
      75% of people in America trusted the government and its institutions,
      whereas now fewer than 20% do.
    topic: institutional-trust
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:04:17]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Raj cites this figure himself ("I was reading a
      report...").

  - id: raj-shamani-08613
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks whether this decline in public trust isn't a major problem,
      and whether it's exactly the kind of opening that lets other
      countries "win."
    topic: institutional-trust
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:04:45]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Follows directly from raj-shamani-08612.

  - id: raj-shamani-08614
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks: based on what Bremmer just said, what happens when a
      country's youth stop believing in the system, and what happens to
      that country next — specifically, given this is now happening in the
      United States, what does Bremmer see coming next?
    topic: youth-trust
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:09:05]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Raj explicitly frames this as "I have two questions
      about this."

  - id: raj-shamani-08615
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks what it means when the world's financial capital — a place
      where capitalism has run in people's blood — starts electing leaders
      who are not staunch supporters of capitalism, and whether that is a
      good thing for a country or not.
    topic: nyc-politics
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:11:33]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Context (Bremmer's answer that follows, about Zohran
      Mamdani) indicates this refers to New York City's mayoral politics.

  - id: raj-shamani-08616
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj observes that America used to follow the principle of not
      interfering with companies or markets — letting the market pick
      winners, with government meant to set the rules rather than directly
      run the economy.
    topic: us-economic-policy
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:15:35]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Raj frames this as something he recently read about.
      The exact phrasing of government's role in the ASR text is somewhat
      garbled/self-contradictory; this translation reflects the most
      plausible reading given the surrounding non-interventionist framing.

  - id: raj-shamani-08617
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: observation
    text: >
      Raj observes that this is now changing — the government is
      intervening and possibly buying shares in a number of companies,
      particularly in sectors like technology, semiconductors, and
      critical minerals — and asks Bremmer whether he thinks this is a good
      thing.
    topic: us-economic-policy
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[01:15:35]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Continues the same turn as raj-shamani-08616.

  - id: raj-shamani-08618
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks whether all these developments are leading toward a
      financial crisis.
    topic: financial-crisis
    verification:
      status: draft
