    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj proposes discussing three places — India, which he suggests could
      be called a "pivot state"; the Europe region; and West Asia — and
      asks Bremmer to explain what is happening in each of the three right
      now.
    topic: geopolitics-regions
    verification:
      status: draft
