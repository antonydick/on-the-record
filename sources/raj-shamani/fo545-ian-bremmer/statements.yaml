  - id: raj-shamani-08609
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj points out that although Bremmer considers Xi Jinping the world's
      most powerful person, in his firm's risk report for this year Bremmer
      identified the world's biggest threat as being neither China, nor
      Russia, nor nuclear war, and asks him about this.
    topic: risk-report
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:46:58]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. A follow-up clause in the ASR ("आपने यह क्यों नहीं
      बताया कि वह शी जिनपिंग को पसंद करती हैं...") was too garbled/unclear
      to confidently translate and was omitted.

  - id: raj-shamani-08610
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj directly asks Bremmer whether he likes Donald Trump.
    topic: trump
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      ~[00:56:21]. Transcribed via YouTube Hindi auto-captions; text is a
      close English translation of the original Hindi/Hinglish, not a
      verbatim quote. Bremmer answers "No, I don't."

  - id: raj-shamani-08611
    person: raj-shamani
    source: raj-shamani-fo545-ian-bremmer
    type: assertion
    text: >
      Raj asks whether today's young people believe the American Dream is
      dead in America.
    topic: american-dream
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
