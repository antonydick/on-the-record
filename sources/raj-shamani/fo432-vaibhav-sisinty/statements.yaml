  - id: raj-shamani-13975
    person: raj-shamani
    source: raj-shamani-fo432-vaibhav-sisinty
    type: observation
    text: >
      Raj announces that this episode marks the launch of a new
      recurring series called "Figuring Out AI," where he and Vaibhav
      Sisinty will release one AI-focused episode every month to help
      viewers stay updated on AI tools that can improve productivity and
      grow their business, and tells viewers there is a free WhatsApp
      community linked in the description for viewers of the show to
      stay updated on such tools, asking them to comment at the end of
      the episode what they learned from it.
    topic: series-announcement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=NcTcYDjBNNk"
      start_timestamp: "00:02:20"
      end_timestamp: "00:03:20"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...जहां हर महीने हम एक एआई एपिसोड बनाएंगे। वि माय फ्रेंड वैभव सिसिंटी..."
    notes: >
      ~[00:02:20]-[00:03:20] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      This episode's audience-engagement ask (WhatsApp community +
      "tell me what you learned") is a distinct variant from the
      standard subscribe/comment/share outro, tied specifically to the
      launch of this new monthly AI series. Verified via on-screen
      YouTube caption at video timestamp ~165s, matching exactly; the
      episode description independently confirms the WhatsApp community
      link (figuringoutai.co).

  - id: raj-shamani-13976
    person: raj-shamani
    source: raj-shamani-fo432-vaibhav-sisinty
    type: recommendation
    text: >
      In his closing outro, Raj thanks viewers for watching the podcast
      to the end and asks them to do three things: subscribe to the
      channel so the show can bring better and more valuable guests,
      comment on what they liked and disliked about the episode so the
      show can avoid repeating mistakes and suggest guests they would
      like to see on the podcast, and share the episode with at least one
      person, saying one conversation can change someone's life. He signs
      off by telling viewers to keep figuring out until next time.
    topic: audience-engagement
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=NcTcYDjBNNk"
      start_timestamp: "02:04:20"
      end_timestamp: "02:04:40"
      verified_at: "2026-09-18"
      verified_by: "Antony Dick"
    evidence:
      excerpt: "...इनसेन। दिस इज वैभव सिसडी। थैंक यू सो मच ये एपिसोड एंड तक देखने के लिए। अब आपको..."
    notes: >
      ~[02:04:20]-[02:04:40] Transcribed via YouTube Hindi/Hinglish
      auto-captions; text is a close paraphrase, not a verbatim quote.
      Standard combined closing outro (subscribe + feedback/guest-
      suggestion + share), plus the "keep figuring out" sign-off, wording
      near-identical to fo442-runjhun-sharma's and fo433-pooja-makhija's
      outros. Verified via on-screen YouTube caption at video timestamp
      ~7463s, matching exactly.
