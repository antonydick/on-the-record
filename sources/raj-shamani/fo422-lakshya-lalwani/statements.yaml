statements:
  - id: raj-shamani-13998
    person: raj-shamani
    source: raj-shamani-fo422-lakshya-lalwani
    type: recommendation
    text: >
      Raj reads a sponsored segment for Porter, the episode's title
      sponsor, saying that before the festival season people expect
      holidays and relaxation, but once festivals arrive chaos begins,
      especially for businesses that need to send hampers to clients and
      deliver goods to customers while also spending time at home, and
      that this is when a reliable logistics partner is needed, which is
      why he recommends Porter, whose two-wheelers can easily and safely
      move small items to any corner of the city, offering affordable
      and business-friendly service to keep customers stress-free, and
      directs viewers to check the link in the description to know more.
    topic: sponsor-read
    verification:
      status: verified
      source_url: "https://www.youtube.com/watch?v=pt6HbNMxUdk"
      start_timestamp: "00:02:00"
      end_timestamp: "00:02:40"
