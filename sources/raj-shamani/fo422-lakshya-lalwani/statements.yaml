  - id: raj-shamani-13999
    person: raj-shamani
    source: raj-shamani-fo422-lakshya-lalwani
    type: observation
    text: >
      Raj introduces the guest as Lakshya, a boy from a middle-class
      home in Delhi with big dreams, who started his journey in TV
      serials, earning up to 30 lakh a month before taking the step of
      leaving his comfort zone to pursue lead roles in films, saying his
      journey is one of belief, courage, and full trust in his dreams,
      and urges viewers to watch till the end and comment on what they
      learned from the episode.
    topic: guest-introduction
