  - id: saad-khaja-02035
    person: saad-khaja
    source: saad-khaja-saad-clip-j3trsquh3tk
    type: recommendation
    text: >
      Saad recommends that when a ghosting prospect picks up, you say that
      you missed them and it has been a while, then ask whether they figured
      out the solution they were looking for.
    topic: follow-up-script
    speaker_confidence: high
