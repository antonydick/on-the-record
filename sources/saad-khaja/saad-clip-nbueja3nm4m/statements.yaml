    type: example
    text: >
      On a cold call that reached a sales representative rather than the
      intended person, Saad says it is a cold call and that he can ask
      the representative instead of wasting time calling the marketing
      manager, asking whether the company wants help with social media.
    topic: wrong-person-pitch
    speaker_confidence: high
