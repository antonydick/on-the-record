    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Yann
      LeCun), no diarization. This episode is a long, deeply technical
      tutorial on AI/ML concepts with very little personal disclosure
      from Nikhil -- extraction here is correspondingly sparse. Content
      confirmed present via NotebookLM (exact line: "in my world it's
      always been, I work in finance and hedge funds and fund managers
      have always been attempting to pump a lot of data into a neural
      network to recognize patterns, right... but what I've realized,
      Yann, is it's even today it's very easy to tweak data that you
      have collected retrospectively to make something appear like it
      makes sense, but financial activity tends to be so random that I
      don't know if you can build a model based on that"), immediately
      following a discussion of "adaptive filter theory" and an analogy
