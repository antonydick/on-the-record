    source: nikhil-kamath-yann-lecun
    type: belief
    speaker_confidence: high
    text: >
      Mentions his own background working in finance and hedge funds,
      where fund managers have long tried to feed large amounts of data
      into neural networks to recognize patterns, but expresses
      skepticism that this works well for markets -- saying it is easy
      to retrospectively tweak data to make a model appear to make
      sense, while financial activity tends to be too random to reliably
      model this way.
    topic: investing
    verification:
