  - id: nikhil-kamath-201
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-edtech-ep5
    type: belief
    speaker_confidence: high
    text: >
      Says that if he had to name something to change about education, it
      would be moving away from the modern nuclear-family construct
      (husband, wife, child) as the primary vehicle for a child's
      upbringing, arguing it subconsciously dictates to children what
      religion to follow and what to study; he'd prefer an environment
      with fewer such inherited ("mimetic") influences, closer to how
      children historically learned from and fixated on skills within a
      wider community, allowing a child's learning choices to be more
      organic.
    topic: worldview
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
