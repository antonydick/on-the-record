      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-200. Given as his
      own closing answer, explicitly framed as "a very dystopian" view he
      is choosing to voice, in response to being asked what one thing he
      would change about education.
