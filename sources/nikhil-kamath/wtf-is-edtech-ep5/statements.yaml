    text: >
      Recounts a night out in Bombay with Jay Kotak that began with dinner
      at Mekong at Land's End, then moved through a couple of other spots
      near Kamala Mills, and ended at a friend's house where Jay met a
      woman (later identified as Aditi) after only a brief conversation
      without exchanging numbers; a few months later Jay told him in
      Bangalore that he had started dating her, and the two are getting
      married in November (of the year this episode was recorded).
    topic: relationships
