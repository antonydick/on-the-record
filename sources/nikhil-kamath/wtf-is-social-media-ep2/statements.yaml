statements:
  - id: nikhil-kamath-154
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-social-media-ep2
    type: experience
    speaker_confidence: high
    text: >
      Explains a "Be Here Now" tattoo he has, referencing a book by an
      author transcribed as "AK Ramdas" (likely Ram Dass, whose famous
      book is titled "Be Here Now") that he read roughly 8-9 years
      before this recording. Says he went through a long period of
      chronic anxiety about the future and procrastination, and
      describes coming to terms with actuarial life-expectancy math --
      framing himself, at 36, as statistically having about 34 years
      left -- as what reoriented him toward living in the present.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SkU3J2vWUK8&t=4621s"
      start_timestamp: "1:17:01"
      end_timestamp: "1:18:23"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: multi-guest panel (Nikhil hosting Tanmay
      Bhat, Umang Bedi, and Aprameya Radhakrishna), no diarization, very
      fast cross-talk throughout. This specific exchange is
      high-confidence for Nikhil: a direct question about a tattoo the
      host has, followed by a first-person answer including his stated
      age (36), which is internally consistent with nikhil-kamath-101
      (Kiran Mazumdar-Shaw episode, also age 36, published within three
      months of this episode). Confirmed via this video's dense
      transcript (1221 segments) at 1:17:01-1:18:23: "be here now...
      tell me the story behind it... there was this author I used to
      read his books... maybe like 8, 9 years ago... his name was AK
      ramdas[Ram Dass, confirming the garbled author name]... I spent a
      disproportionately large amount of time... living like I will live
      forever[,] so I would procrastinate[,] I would constantly worry
      about what will happen 10, 20, 30, 40 years from now... I have
      come to terms with the fact that we are Indians[,] we will on
      average live... 70 years[,] so if I am 36 I have 34 years left[,]
      so this is a reminder... that you're not here forever."

  - id: nikhil-kamath-155
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-social-media-ep2
    type: experience
    speaker_confidence: high
    text: >
      Says his reading focus has shifted in recent years from books on
      finance, economics, and the stock market to books on psychology,
      specifically citing an interest in theories linking difficult
      childhoods to outsized adult ambition/success.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SkU3J2vWUK8&t=4963s"
      start_timestamp: "1:22:43"
      end_timestamp: "1:23:16"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-154. Confirmed
      via this video's dense transcript at 1:22:43-1:23:16: "...my new
      big thing is psychology[,] okay[,] I['m not] reading all books on
      finance[,] economy[,] stock market[,] I just read psychology[,]
      and this has been [my] deal for the last few years[,] so it talks
      about people who are successful and correlates how horrible their
      childhood was[.] It says most successful people, especially
      startup founders and stuff like that..." -- confirming the shift
      to psychology reading and the specific difficult-childhood/
      success-correlation theory word-for-word. Note this occurs a few
      minutes after nikhil-kamath-154 (both in the same broader
      conversational stretch), not in the immediately adjacent speaking
      turn as the draft's note suggested.

  - id: nikhil-kamath-156
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-social-media-ep2
    type: experience
    speaker_confidence: high
    text: >
      Recounts a recent trip to Saudi Arabia where he was shown major
      investment projects, including a large-scale villa development
      (referred to as "Rosan," on the order of 45,000 villas), as part
      of scouting investment opportunities in the country.
    topic: travel
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SkU3J2vWUK8&t=4250s"
      start_timestamp: "1:10:50"
      end_timestamp: "1:11:21"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-154. Confirmed
      via this video's dense transcript at 1:10:50-1:11:21: "...I went
      to a few of [the projects][,] I was there for a while and they
      took me to show me different projects and investing
      opportunities... we went to a villa project called rosan[,] you
      know how many villas they're building at one time[?] 45,000..."
      The project name is still rendered "rosan" in this dense
      transcript rather than "Roshn," so the exact spelling remains
      unconfirmed, but the villa-count figure (45,000) and Saudi
      investment-scouting context are confirmed word-for-word.

  - id: nikhil-kamath-157
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-social-media-ep2
    type: experience
    speaker_confidence: high
    text: >
      Describes difficulty trying to set up a company and a fund in
      Dubai's DIFC -- a roughly three-month wait for a corporate bank
      account, a one-month DIFC licensing process that required medical
      tests, and a requirement to maintain physical office real estate
      -- and contrasts this with his fund being one of the first to set
      up in India's GIFT City roughly three years earlier, when the
      zone had only a handful of tenants and has since grown rapidly.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SkU3J2vWUK8&t=4520s"
      start_timestamp: "1:15:20"
      end_timestamp: "1:16:23"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-154.
      Cross-reference: corroborates his early presence in GIFT City,
      consistent with nikhil-kamath-059 (Ruchir Sharma episode).
      Confirmed via this video's dense transcript at 1:15:20-1:16:23:
      "...I was trying to create a company and a fund there[, Dubai]...
      they take 3 months to create a bank account for a company[,]
      D[I]FC license takes one month[,] for some reason you have to do
      medical test[s] and prove you don't have certain kind of diseases
      to get that license to open a company[,]... you're mandated to
      have physical real estate inside D[I]FC to be able to operate a
      company out of there... geographies like gift have totally
      transformed[.] We were the first fund[,] first company[,] one of
      the first to set up in gift maybe 3 years ago... there were maybe
      four or five people... today... there [are] like 20-30,000 people
      working there." Confirmed word-for-word, including the specific
      three-month bank account wait, one-month DIFC license, medical
      test requirement, physical-office mandate, and the ~3-year-old,
      then-nearly-empty GIFT City comparison.

