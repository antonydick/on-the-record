    type: experience
    speaker_confidence: high
    text: >
      Explains a "Be Here Now" tattoo he has, referencing a book by an
      author transcribed as "AK Ramdas" (likely Ram Dass, whose famous
      book is titled "Be Here Now") that he read roughly 8-9 years
      before this recording. Says he went through a long period of
      chronic anxiety about the future and procrastination, and
      describes coming to terms with actuarial life-expectancy math --
      framing himself, at 36, as statistically having about 34 years
      left -- as what reoriented him toward living in the present.
    topic: personal habits
