      detail (a chance hallway encounter that turned into a multi-hour
      conversation). Confirmed via the video's dense transcript at
      2:24:58-2:25:15: "I had this interesting guy, Michael Milken. He
      spent a lot of money and time coming up with this plan where he
      wants to give every child who's born a certain amount of equity...
      trying to give more people a stake in the system, a financial
      stake, is a good thing."

  - id: nikhil-kamath-145
    person: nikhil-kamath
    source: nikhil-kamath-rishi-sunak-akshata-murty
    type: experience
    speaker_confidence: high
    text: >
      Says he recently hired someone who spends an hour or two with him
      every day teaching him to code, starting with an open-source
      Claude-based coding agent self-hosted on a Mac mini; says he has
      done about a month of these daily lessons and is starting to feel
      more comfortable "vibe coding," though he does not yet consider
      himself skilled at writing detailed prompts.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=spdUv7OFOu4&t=9097s"
      start_timestamp: "2:31:37"
      end_timestamp: "2:32:32"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-140. The coding
      tool's name in the auto-transcript ("open claw") is confirmed to
      be "Open Claude" (formerly "Claude Bot"), consistent with the
      "OpenClaw"/"ClawdBot" product name confirmed in the dario-amodei
      episode. Confirmed via the video's dense transcript at
      2:31:37-2:32:32: "...we started with Claude Bot, so this is a
      little bit -- now it's called Open Claude... you kind of host it
      on a tiny -- on this Mac mini, right? -- yeah, and you give it
      access to everything. But the thing I realised about prompting...
      even when you use Claude Code for the first time, how specific
      you are while you prompt is a skill set in itself which I don't
      have... I was watching the interview of the guy who built Claude
      Bot or Open Claude now, he said it's like playing the piano, you
      can't expect somebody to sit in front of the piano and prompt for
      the very first time... you need like a few lessons -- yeah, but
      it's not too many, I've done like maybe a month of lessons,
      that's about it."

