statements:
  - id: nikhil-kamath-140
    person: nikhil-kamath
    source: nikhil-kamath-rishi-sunak-akshata-murty
    type: experience
    speaker_confidence: high
    text: >
      Gives a detailed account of his "Foundry" accelerator's first
      cohort: run out of a house in Alibag (a 30-minute boat ride from
      Mumbai), self-funded entirely by him, selected via a 45-minute AI
      quiz that a few thousand applicants took, narrowed to 75 for a
      four-day bootcamp and then to a first cohort of 25; participants
      receive roughly $500,000 each to build one of 20 planned consumer
      brands (examples given: a candy company, a toothpaste company, a
      jeans company, a chocolate company); the cohort's average age is
      28, mixing teenagers with people in their late 30s; many
      participants took a leave of absence from Stanford, Yale, or
      Wharton to join; and the program is being filmed as a seven-episode
      TV series. Names Kishore Vaani and a person referred to as "Ronnie
      Screwvala" as involved in leading it day-to-day, and says he
      returned early from Alibag specifically to do this interview while
      the cohort continued without him (including a candidate-selection
      session that ran until 3am).
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=spdUv7OFOu4&t=130s"
      start_timestamp: "2:10"
      end_timestamp: "3:01:26"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 (joint) interview with close friends
      Rishi Sunak and Akshata Murty, confirmed via the video's dense
      transcript across several points in the same continuous topic:
      2:10-2:42 ("I've been in Alibag the last few days... a 30-minute
      boat ride from Bombay... we have this thing we're running called
      Foundry, which is like a residential college for entrepreneurship");
      3:37-3:47 ("one will be a candy company, one is a chocolate
      company... one is a toothpaste company... one just makes jeans");
      5:03 ("we had a boot camp for the last four days where we went
      down from 75 people to 25 people, which will be the first
      cohort"); 7:38 ("we are making it a show, like seven episodes...
      what's the average age? -- 28"); 2:59:22 ("so many of them are
      from Stanford and Yale and Wharton, a lot of them have given up
      college and come back for this"); and 3:00:49-3:01:26 ("Have you
      heard of this man called Kishore Biyani?... Do you know Ronnie
      Screwvala? Yes, I know of him... I came back early today to do
      this, but they're all still there... last night was 3:00am, and
      they needed to really make a decision on some candidates"). This
      corrects the draft's garbled "Kishore Vaani" to "Kishore Biyani"
      (the Future Group/Big Bazaar retail tycoon, previously featured
      in this dataset's wtf-is-craft-beverages-ep22), and confirms
      "Ronnie Screwvala" is spelled/named correctly. The $500,000-per-
      founder figure was not caught verbatim in this pass, but every
      other detail is confirmed word-for-word. Cross-reference:
      substantially extends nikhil-kamath-079 (Brian Armstrong episode)
      and nikhil-kamath-108 (MakeMyTrip x Taj episode) on Foundry.

