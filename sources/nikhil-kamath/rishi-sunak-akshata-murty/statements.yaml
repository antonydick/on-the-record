  - id: nikhil-kamath-142
    person: nikhil-kamath
    source: nikhil-kamath-rishi-sunak-akshata-murty
    type: experience
    speaker_confidence: high
    text: >
      Recounts attending the cremation of Kiran Mazumdar-Shaw's husband
      John (in 2022) alongside Sudha Murthy (Akshata Murty's mother),
      who told him a lengthy story there about the Hindu deity in
      charge of crematoriums.
    topic: relationships
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=spdUv7OFOu4&t=559s"
      start_timestamp: "9:19"
      end_timestamp: "9:50"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-140. Touches on
      a death in a close friend's family -- treated with care; John
      Mazumdar-Shaw's death is already public record. Confirmed via the
      video's dense transcript at 9:19-9:50: "...this was unfortunately
      when Kiran's husband had passed away, and we were at the... 2022,
      we were at the crematorium. And there was a poster of a god on the
      ceiling. So I was looking at it and she came up to me and she's
      like, 'Nikhil, you know what that is?' It was the god who's in
      charge of... of death... Yama, Yamaraj -- no, he's a god of
      crematoriums, who's in charge of... very specific... so she sat
      me down and told me the story for ten minutes."

  - id: nikhil-kamath-143
    person: nikhil-kamath
    source: nikhil-kamath-rishi-sunak-akshata-murty
    type: belief
    speaker_confidence: high
    text: >
      Offers his own theory that South Indians, having historically
      experienced less war and conflict than North Indians, are
      culturally more inclined to "embrace the moment" -- drawing a
      parallel to how people with a shorter life expectancy tend to
      live more presently.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=spdUv7OFOu4&t=6409s"
      start_timestamp: "1:46:49"
      end_timestamp: "1:47:02"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-140. Confirmed
      via the video's dense transcript at 1:46:49-1:47:02: "...and I've
      had that as a young person. -- I have a theory for this... I feel
      like us South Indians never saw war as frequently as the North
      Indians did. -- We didn't see conflict. -- I have the exact same
      theory."

