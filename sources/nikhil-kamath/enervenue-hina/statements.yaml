  - id: nikhil-kamath-089
    person: nikhil-kamath
    source: nikhil-kamath-enervenue-hina
    type: belief
    text: >
      Says that after this trip to China he wants to go back to India
      and start a business, and that he is undecided between starting
      an electric car company or a battery company -- explaining that
      he is putting his questions to the two guests partly through that
      lens.
