  - id: nikhil-kamath-090
    person: nikhil-kamath
    source: nikhil-kamath-enervenue-hina
    type: experience
    text: >
      Says his fund has been reviewing an Indian rare-earth-elements
      company as a potential investment, but that the finished product
      would end up far more expensive than simply importing from China,
      making the domestic-sourcing case look unfeasible at least at the
      time.
