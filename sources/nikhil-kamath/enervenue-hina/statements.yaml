    type: experience
    text: >
      Recounts a recent weekend trip to Hong Kong where he and
      companions went to a Sichuan restaurant (named as "Royal Majestic
      Sichuan") and asked for a chili chicken dish to be made as spicy
      as possible -- which he says was a mistake.
