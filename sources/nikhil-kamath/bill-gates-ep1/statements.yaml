  - id: nikhil-kamath-014
    person: nikhil-kamath
    source: nikhil-kamath-bill-gates-ep1
    type: experience
    speaker_confidence: high
    text: >
      Describes co-running a foundation called "Rainmatter" that works
      on climate issues, and separately mentions a school project and
      a malnutrition initiative done in collaboration with the Gates
      Foundation.
    topic: philanthropy
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=ckNEdxQ0Tc0&t=116s"
      start_timestamp: "1:56"
      end_timestamp: "12:58"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-011. Relevant
      cross-reference: the Ep #6 health-panel extraction (see
      sources/nikhil-kamath/wtf-is-health-ep6) includes an unattributed
      "Rainmatter Health" passage that was deliberately left unassigned
      to any speaker due to panel-attribution uncertainty. This
      statement -- Nikhil describing Rainmatter as "our foundation" in
      a clean 1:1 setting -- suggests it may be a joint initiative
      rather than solely his brother Nithin's, which is worth
      reconsidering when verifying the Ep #6 material. Confirmed via
      the video's dense transcript in two separate places: the Gates
      Foundation collaboration at 1:56-2:05 ("...the Gates Foundation,
      who I worked with in the past, we've done a school project
      together, we're doing something around malnutrition together...")
      and the Rainmatter mention at 12:50-12:58 ("...so we have a
      foundation, Bill, which does work around clim[ate], it's called
      Rainmatter...").
