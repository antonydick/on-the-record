    type: experience
    speaker_confidence: high
    text: >
      Says he joined the Giving Pledge the year before this recording,
      and that he is one of four Indian signatories, all based in
      Bangalore and all friends of his.
    topic: relationships
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=ckNEdxQ0Tc0&t=91s"
      start_timestamp: "1:31"
      end_timestamp: "1:48"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-011. "The year
      before this recording" is relative to this episode's publish date
      (2024-06-14 per metadata.yaml), so "last year" as spoken points to
      2023. Confirmed via the video's dense transcript at 1:31-1:48:
      "...joined Bill's [pledge] last year... the one thing I want to
      clarify is a lot of Indians, when they hear about an Indian
      sign[ing] on to the pledge -- I think there's four of us, right,
      we're all from Bangalore and all of us are friends -- people
      somehow assume that the money is going out of India... it's
      actually not the case."

