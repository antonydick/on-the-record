    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview, confirmed via the video's
      dense transcript at 0:44-1:00: "...there's no better person to
      learn from, so we do this once in a month, Bill, and uh we
      primarily cater to the young entrepreneur in India -- the idea is
      to get really good people on the show..." Corroborates
      nikhil-kamath-006 from the Sam Altman episode, which makes the
