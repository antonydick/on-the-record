  - id: nikhil-kamath-081
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    speaker_confidence: high
    text: >
      Mentions a friend, a private-equity investor based in San
      Francisco, who was an early investor in Coinbase and once gave him
      a memorable argument for thinking of crypto/bitcoin as a form of
      "energy as the unit of transaction."
    topic: relationships
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=5110s"
      start_timestamp: "1:25:10"
      end_timestamp: "1:25:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 1:25:10-1:25:40:
      "So, whenever I see Micky... He made a very nice argument for
      it... [it] is a unit equivalent to something, but some form of
      energy." Confirms the friend's first name as "Micky" (auto-
      transcript elsewhere garbles this as "Mickey Mala") and the
      energy-as-unit-of-transaction argument; the specific PE-investor/
      San-Francisco/early-Coinbase-investor biographical details were
      not caught verbatim within the sampled window.

  - id: nikhil-kamath-082
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: belief
    speaker_confidence: high
    text: >
      Says that if he were to short a broad basket of private AI
      companies today, he believes he could be profitable within five
      years, reflecting skepticism that current private AI valuations
      are justified even though he thinks AI itself has real use cases.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=5350s"
      start_timestamp: "1:29:10"
      end_timestamp: "1:29:21"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 1:29:10-1:29:21:
      "I don't see the reason to pay the multiples... I mean, right now,
      the demand for intelligence seems to be unlimited," reflecting his
      stated valuation skepticism while acknowledging real AI use cases.
      The specific "short a basket... profitable within five years"
      framing was not caught verbatim within the sampled window, but the
      core valuation-skepticism content is confirmed. Cross-reference:
      consistent in spirit with Ruchir Sharma's AI-bubble skepticism
      discussed in the nikhil-kamath-ruchir-sharma episode, though this
      is Nikhil's own independently stated view.
