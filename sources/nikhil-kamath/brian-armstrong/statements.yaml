  - id: nikhil-kamath-079
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    text: >
      Describes founding "Foundry," a Y Combinator-style startup
      accelerator in India, where roughly 20-25 young founders are given
      about $500,000 each every six months and live together in a house
      while building consumer companies.
    topic: business
