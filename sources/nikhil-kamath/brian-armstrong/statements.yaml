  - id: nikhil-kamath-080
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: assertion
    text: >
      Says the brokerage business he runs in India (not named in this
      exchange, but consistent with Zerodha) has operated as a discount
      broker for about 18 years, and compares its regulatory constraints
      (e.g. on fractionalizing shares) to Robinhood's in the US.
