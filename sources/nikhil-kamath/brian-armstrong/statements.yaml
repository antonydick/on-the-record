  - id: nikhil-kamath-077
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: assertion
    text: >
      Describes his own approach to trading equities as fundamentals-
      driven -- based on a company's earnings, industry, and sector --
      explicitly contrasting this with his trader friend Hardik's more
      psychological, sentiment-driven approach to trading crypto.
    topic: investing
    verification:
