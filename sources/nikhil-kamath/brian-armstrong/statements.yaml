statements:
  - id: nikhil-kamath-072
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    speaker_confidence: high
    text: >
      Opens the conversation by describing himself as a crypto critic,
      saying he has never bought any bitcoin, blockchain tokens, Solana,
      or Ethereum, and that he expects to remain a skeptic even after
      talking to Brian Armstrong (though he isn't fully sure he will).
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=30s"
      start_timestamp: "0:30"
      end_timestamp: "1:04"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Coinbase
      CEO Brian Armstrong; his friend Hardik and an aide referred to as
      Arian join partway through), no diarization. Attribution inferred
      from conversational role and the opening framing, not diarized
      video (this video's transcript panel repeatedly failed to load;
      confirmed via live captions instead). Confirmed via live captions
      at 0:30-1:04: "Everything from Bitcoins, blockchains, Solana,
      Ethereum... I'm no expert in these, but I've always wondered
      what... and today is probably a good day to find out. I am a
      critic, I have never bought any of these, ever... I don't know if
      I'll remain a critic after this, but I suspect I will." Cross-
      reference: corroborates and extends nikhil-kamath-058 (never
      personally bought Bitcoin, from the Ruchir Sharma episode) to
      crypto assets more broadly.

