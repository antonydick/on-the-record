  - id: nikhil-kamath-074
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    text: >
      Recalls a story from a childhood book (source not specified) about
      a kingdom where the king holds a large majority -- but not
      all -- of the wealth and society remains stable, versus one where
      the king holds almost everything and the people come for him; uses
      it as his mental model for when wealth concentration becomes
      socially destabilizing.
    topic: personal habits
    verification:
      status: draft
      verified_at: null
      verified_by: null
