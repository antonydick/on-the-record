  - id: nikhil-kamath-079
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    speaker_confidence: high
    text: >
      Describes founding "Foundry," a Y Combinator-style startup
      accelerator in India, where roughly 20-25 young founders are given
      about $500,000 each every six months and live together in a house
      while building consumer companies.
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=3800s"
      start_timestamp: "1:03:20"
      end_timestamp: "1:03:31"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 1:03:20-1:03:31:
      "I tried to copy Y Combinator and start our own version in
      India... every, like, six months... we give about 20-25 kids...
      half a million dollars each." The "live together in a house"
      detail was not caught verbatim within the sampled window but is
      independently corroborated by nikhil-kamath-140 (Rishi
      Sunak/Akshata Murty episode), which describes this same Foundry
      program's Alibag residential accelerator in detail.

  - id: nikhil-kamath-080
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: assertion
