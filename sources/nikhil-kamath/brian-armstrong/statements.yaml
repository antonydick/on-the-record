statements:
  - id: nikhil-kamath-072
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    text: >
      Opens the conversation by describing himself as a crypto critic,
      saying he has never bought any bitcoin, blockchain tokens, Solana,
      or Ethereum, and that he expects to remain a skeptic even after
      talking to Brian Armstrong (though he isn't fully sure he will).
    topic: investing
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Coinbase
      CEO Brian Armstrong; his friend Hardik and an aide referred to as
      Arian join partway through), no diarization. Attribution inferred
      from conversational role, not confirmed via video. Cross-reference:
      corroborates and extends nikhil-kamath-058 (never personally
      bought Bitcoin, from the Ruchir Sharma episode) to crypto assets
      more broadly.

  - id: nikhil-kamath-073
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    text: >
      Says that over the past year his philanthropic focus has included
      a bit of climate-related giving, and a larger push around
      entrepreneurship -- providing seed capital to people in India who
      need it to get a business started.
    topic: philanthropy
    verification:
