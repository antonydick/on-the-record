    text: >
      Says the brokerage business he runs in India (not named in this
      exchange, but consistent with Zerodha) has operated as a discount
      broker for about 18 years, and compares its regulatory constraints
      (e.g. on fractionalizing shares) to Robinhood's in the US.
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=4930s"
      start_timestamp: "1:22:10"
      end_timestamp: "1:22:25"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 1:22:10-1:22:25:
      "sort of trying to do protectionism, you know... We've been
      discount brokers... for about 18 years now." The explicit
      Robinhood comparison was not caught verbatim within the sampled
