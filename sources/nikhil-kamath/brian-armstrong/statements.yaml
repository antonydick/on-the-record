  - id: nikhil-kamath-075
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: experience
    speaker_confidence: high
    text: >
      Says that a couple of years earlier he tried to explore building a
      business around remittances into India using stablecoins, given
      how large India's remittance inflows are, but concluded there was
      no viable stablecoin off-ramp in India at the time and that the
      Indian government had good reason to be wary of enabling one.
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=1875s"
      start_timestamp: "31:15"
      end_timestamp: "31:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 31:15-31:40,
      immediately after discussing India's ~$150 billion/year remittance
      market: "I tried for a little while, a couple of years ago... the
      problem is there were no off-ramps back then in India." Cross-
      reference: corroborates nikhil-kamath-064 (Ruchir Sharma episode),
      where he mentions researching a rupee/gold-backed stablecoin for
      remittances -- this statement adds that the exploration dates back
      roughly two years and was shelved over the lack of an off-ramp.

  - id: nikhil-kamath-076
    person: nikhil-kamath
    source: nikhil-kamath-brian-armstrong
    type: mechanism
    speaker_confidence: high
    text: >
      Pitches his own idea for a gold-tokenization system: local
      custody/clearing-house centers where Indian households could
      deposit jewelry they aren't currently wearing, in exchange for a
      gold-backed coin they could then lend, invest, or pledge, given
      how much gold Indian families accumulate over generations.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=p8O6SFwXqok&t=2118s"
      start_timestamp: "35:18"
      end_timestamp: "35:43"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-072 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 35:18-35:43:
      "People have, say, 10, 20, 30 different pieces of jewellery...
      and in return for that you get a coin backed by gold... you can
      also tokenise gold, you can tokenise stocks... you can tokenise
      treasuries, bonds..." The specific "local custody/clearing-house
      center" wording was not caught verbatim, but the core
      jewelry-deposit-for-a-gold-backed-coin mechanism is confirmed.

