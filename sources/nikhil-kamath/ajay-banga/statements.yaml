  - id: nikhil-kamath-070
    person: nikhil-kamath
    source: nikhil-kamath-ajay-banga
    type: belief
    speaker_confidence: high
    text: >
      Argues, by analogy to the slowdown in transistor density gains
      (Moore's Law), that the cost of AI compute will eventually stop
      being artificially subsidized by large Western tech companies, and
      says that today he would rather buy shares in a large Indian IT
      services company trading at roughly 15x earnings than in a large
      US AI company, on the view that Indian labor-cost arbitrage still
      holds.
    topic: investing
