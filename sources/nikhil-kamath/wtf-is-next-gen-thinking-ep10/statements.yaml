      time, and separately started his own company building small,
      two-screen multiplexes for tier-2/tier-3 Indian towns (combined
      with a grocery store and community-center concept in the same
      building), citing specific unit economics he worked with -- a
      target of 60-70% occupancy, tickets around 150 rupees, and roughly
      1.5 crore rupees of capex per center.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=nGpir4oUfJI&t=4381s"
