  - id: nikhil-kamath-162
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-next-gen-thinking-ep10
    type: experience
    speaker_confidence: high
    text: >
      Describes his working relationship with his brother Nithin
      Kamath: he started trading full-time at 17, and the two of them
      founded "Kamath Associates" together about 16 years before this
      recording; he handles all stock-market and investing decisions
      while Nithin handles people and the broking business, and they
      have operated without external investors or debt, formalizing
      their arrangement early on with lawyers and a written
      constitution.
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=nGpir4oUfJI&t=7121s"
      start_timestamp: "1:58:41"
      end_timestamp: "1:58:56"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-159. A specific,
      checkable business/biography timeline claim confirmed via the
      video's dense transcript at 1:58:41-1:58:56: "...this is an old
      journey, right, like when I started trading full-time I was 17,
      when we started working together full-time we started a company
      called Kat[h] Associates, which is what, 16 years ago now, and
      we've been on this journey for so long, along the way we've had
      lawyers, we've had constitutions, we've had many ups and downs,
      but the one thing we've never had is anyone outside..." (auto-
      transcript garbles "Kamath Associates" as "Kat Associates"). The
      division-of-labor detail (he handles markets/investing, Nithin
      handles people/broking) was not caught verbatim within the
      sampled window, but the founding timeline, lawyers/constitution,
      and no-outside-investors claims are confirmed word-for-word.

  - id: nikhil-kamath-163
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-next-gen-thinking-ep10
    type: experience
    speaker_confidence: high
    text: >
      Describes a personal habit, sustained for about a year, of
      writing down his dreams within the first five minutes of waking
      (even at 4am), after reading that dream recall fades quickly;
      also mentions he has been writing a book for a long time that he
      says he will never publish, purely for his own personal
      reflection.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=nGpir4oUfJI&t=6924s"
      start_timestamp: "1:55:24"
      end_timestamp: "1:55:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-159. Confirmed
      via the video's dense transcript at 1:55:24-1:55:40: "...when you
      dream, right, when you have vivid dreams you only remember them
      for the first 10 minutes that you're awake, yeah, so I did this
      like a habit, I was reading some school of psychology, so I would
      wake up every morning and write down my dreams in the first 5
      minutes even if I woke up at 4:00am, I would write it down, the
      crazy thing is even in your dreams there is a pattern." The
      "writing a book he will never publish" detail was not caught
      verbatim within the sampled window, but the dream-journaling habit
      is confirmed word-for-word.

