      for every 30 to 40 people there's one multiplex... we started a
      company to set up theaters in tier-2, tier-3 towns... each theater
      two screens, 60 and 40 tickets at about 150 rupees, in between the
      two screens there would be like a grocery store, community-center
      kind of a concept, at 60-70% occupancy, one and a half crore capex
      per center."
