  - id: nikhil-kamath-165
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-next-gen-thinking-ep10
    type: experience
    speaker_confidence: high
    text: >
      Discloses having been to therapy ("I've been to a few [therapists],
      nine out of ten are horrible"), and shares that he has never had
      a strong sense of self-worth and does not feel lasting
      fulfillment from what he has built -- describing satisfaction as
      fleeting, followed by a need to chase something new.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=nGpir4oUfJI&t=6841s"
      start_timestamp: "1:54:01"
      end_timestamp: "1:54:51"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-159. Sensitive
      personal/psychological content -- treated with care, confirmed
      directly against the recording rather than presented as a
      clinical diagnosis. Confirmed via the video's dense transcript at
      1:54:01-1:54:51: "...I've not had a sense of self-worth, and
      nothing makes me happy beyond a fleeting minute, really, it's hot
      for a minute and then I need something else to chase, something
      new to do, something big -- you don't have that like long-term
      fulfillment after everything that you've built? -- really, I
      don't, and I'm 10 years down the journey, and I can tell you this,
      that it won't come from anything you do outside or any other
      person, but from you going back to your childhood... I'll tell you
      the thing with therapists... I've been to a few, and the problem
      with therapy is nine out of 10 are horrible, like they're
      terrible, they suck."
