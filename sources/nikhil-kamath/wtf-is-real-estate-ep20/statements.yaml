  - id: nikhil-kamath-219
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-real-estate-ep20
    type: experience
    text: >
      Reveals he recently bought a house, breaking from his previously
      stated position that he would not buy property; explains that
      renting's main drawback for him was the lack of certainty over how
      long he could stay somewhere -- he had to move out of a home he
      would have preferred to keep living in -- and that not wanting to
      deal with that uncertainty again is what made buying make sense.
    topic: personal life
