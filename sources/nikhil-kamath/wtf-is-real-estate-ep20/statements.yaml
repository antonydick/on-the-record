      transcript. Stated in first person after Irfan directly calls him
      out as a "convert" for having bought a house.

  - id: nikhil-kamath-220
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-real-estate-ep20
    type: belief
    text: >
      Says he dislikes real estate's illiquidity as an asset class and
      would rather hold something like gold for that reason, while
      separately noting a personal desire, as someone whose wealth is
      largely in "virtual" stock-market holdings, to eventually convert
      some of that paper wealth into tangible assets since he does not
      know when the stock market might correct.
    topic: investing
