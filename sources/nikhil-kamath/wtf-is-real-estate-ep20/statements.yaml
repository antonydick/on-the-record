      classes. Cross-reference: consistent with his stated gold
      investment history in nikhil-kamath-171 (WTF is Finance Ep 4) and
      other episodes.

  - id: nikhil-kamath-221
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-real-estate-ep20
    type: experience
    text: >
      Describes a friend, a real estate investor in his 70s referred to
      in the transcript as "Marcel Areno" (likely a garbled transcription
      of the investor's actual name -- confirm during verification) who
      has signed the Giving Pledge, with whom he had dinner in the US
      shortly before this recording; says this friend gave him a roughly
      two-hour presentation making the case for shorting commercial real
      estate in parts of America and China, citing changed work culture
      and mispriced properties, though not India specifically since he
      had not researched it.
