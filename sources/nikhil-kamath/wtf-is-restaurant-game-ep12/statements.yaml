    notes: >
      SPEAKER ATTRIBUTION: three-person panel (Nikhil hosting patissier
      Pooja Dhingra, Massive Restaurants' Zorawar Kalra, and Impresario's
      Riyaaz Amlani), no diarization in the auto-transcript, but
      confirmed via video at 3:18:25-3:19:30: Nikhil is visually on
      camera speaking directly to the group -- "whatever you suggest,
      what are you looking for, I'm in" ... "that, okay, I'll -- I'll do,
      let me start it off and say I'll do 25 lakhs" ... "10, okay, 50,
      that's 50, and we will mentor him with time, and I -- I have less
      to add [here]" -- this is the show's recurring closing format,
      proposed and narrated by the host. One panelist (likely Riyaaz
      Amlani, given his own restaurant company's conflict-of-interest
      constraints) says he is not personally allowed to invest in other
      restaurants and instead offers mentorship only.
