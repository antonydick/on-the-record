      ("I like people who are a little bit screwed up in all domains")
      over those who project an idealistic mask, reasoning that mutual
      awareness of each other's flaws ("he is [messed] up like this, I am
      aware; I am [messed] up like that, he is aware") makes for a good
      friendship, and that encountering someone who presents as flawless
      makes him worry, since "we are all inherently flawed as people."
