  - id: nikhil-kamath-188
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-consumer-electronics-ep23
    type: belief
    speaker_confidence: high
    text: >
      Argues, during a discussion of reciprocal US tariffs on phones,
      that while he has "no affinity to America" and is "the biggest
      proponent of India built for India, supporting Indian product,"
      reciprocal tariffs are logically fair: if he were selling to a
      country that charged him a 30% duty on his exports, he would expect
      the same duty to apply when buying that country's goods.
    topic: economics
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lRjprPQHuXw&t=1088s"
      start_timestamp: "18:08"
      end_timestamp: "18:32"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: three-person panel (Nikhil hosting Nothing
      co-founder Carl Pei, Micromax co-founder Rahul Sharma, and Noise
      co-founder Amit Khatri), no diarization in the auto-transcript, but
      confirmed via clear video (Nikhil visibly on camera). Confirmed at
      18:08-18:32 ("US tariff's impact on China, India & the industry"
      chapter -- note per the video description, this segment predates
      later changes to global trade/tariff policy, so Nikhil's views here
      may not reflect current regulations): "Like, I'm just... I have no
      affinity to America. And I'm the biggest proponent of India built
      for India, supporting Indian product. At some level, doesn't it
      sound fair? ... And I was selling them something and they were
      charging me 30% duty on it, I would assume the same duty should
      apply."

