statements:
  - id: nikhil-kamath-188
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-consumer-electronics-ep23
    type: belief
    speaker_confidence: high
    text: >
      Argues, during a discussion of reciprocal US tariffs on phones,
      that while he has "no affinity to America" and is "the biggest
      proponent of India built for India, supporting Indian product,"
      reciprocal tariffs are logically fair: if he were selling to a
      country that charged him a 30% duty on his exports, he would expect
      the same duty to apply when buying that country's goods.
    topic: economics
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: three-person panel (Nikhil hosting Nothing
      co-founder Carl Pei, Micromax co-founder Rahul Sharma, and Noise
      co-founder Amit Khatri), no diarization in the auto-transcript.
      This is a first-person self-description ("I have no affinity to
      America. And I'm the biggest proponent...") offered by the host
      while posing the tariff-fairness question to the panel, distinct
      from the guests' own business narratives.

  - id: nikhil-kamath-189
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-consumer-electronics-ep23
    type: belief
    speaker_confidence: high
    text: >
      Says he prefers befriending people who are open about their flaws
      ("I like people who are a little bit screwed up in all domains")
      over those who project an idealistic mask, reasoning that mutual
      awareness of each other's flaws ("he is [messed] up like this, I am
      aware; I am [messed] up like that, he is aware") makes for a good
      friendship, and that encountering someone who presents as flawless
      makes him worry, since "we are all inherently flawed as people."
    topic: relationships
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-188. Offered in
      first person as a general reflection following a question about
      whether he'd back a repeat-failure entrepreneur over a first-timer,
      generalizing the point ("this prophecy is true for all life") to
      friendship rather than describing his own business record.

  - id: nikhil-kamath-190
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-consumer-electronics-ep23
    type: experience
    speaker_confidence: high
    text: >
      Proposes, as the episode's closing pay-it-forward gesture in place
      of the show's usual single-founder charity pledge, a joint
      "component incubator": he and the three guests would each
      contribute money, time, and resources (potentially including land)
      to support around four young entrepreneurs building electronic
      component companies (rather than full consumer brands), explicitly
      saying they should "not care too much about the upside" and hoping
      others can learn from and replicate the model.
    topic: investing
