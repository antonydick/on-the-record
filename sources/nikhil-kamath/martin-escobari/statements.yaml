  - id: nikhil-kamath-124
    person: nikhil-kamath
    source: nikhil-kamath-martin-escobari
    type: experience
    speaker_confidence: high
    text: >
      Recounts a quote from an unnamed young Indian woman he had
      recently spoken with, about how without a shared memory a person
      is left with "scattered memories" and no one to remind them of it
      -- says the idea resonated with him.
    topic: relationships
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SPLFyVyTI1A&t=2328s"
      start_timestamp: "38:48"
      end_timestamp: "39:12"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-119. Vague on
      context (who this person is, in what setting) -- do not
      over-interpret as a romantic disclosure. Confirmed via the video's
      dense transcript at 38:48-39:12: "Someone said this to me
      recently, a very young Indian lady. She said, you'll have
      scattered memories, nor would you have anyone to remind you of
      them, because you then won't know who you made that memory with.
      Which kind of appealed to me. I would go to dinner with her
      again." (A guest then jokes about Nikhil marrying her.)
