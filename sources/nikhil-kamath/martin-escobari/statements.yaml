    type: assertion
    speaker_confidence: high
    text: >
      States he is 39 years old (noting he has "a few months left" at
      that age before turning 40), in the context of a discussion about
      mortality and giving away wealth within one's lifetime.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SPLFyVyTI1A&t=1761s"
      start_timestamp: "29:21"
      end_timestamp: "29:21"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: dinner-table conversation with multiple
      participants (Nikhil hosting Martin Escobari of General Atlantic,
      with recurring guest Arian/Aryan and, later, additional dinner
      guests Florian Brandt and "Andy"/Anirudh), no diarization.
      Attribution inferred from conversational role and content, not
      confirmed via video. Confirmed via the video's dense transcript at
      29:21: "But most people don't come to terms with mortality in a
      way. Like, maybe I'm wrong. I'm 39 now," and again at 43:17: "And
      I'll ask you what makes sense from a 39 because I still don't want
      to say 40." Cross-reference: consistent with nikhil-kamath-097
      (Howard Marks episode, also age 39, published 2026-05-04, close in
      time to this episode's 2026-05-28 date).

  - id: nikhil-kamath-120
    person: nikhil-kamath
    source: nikhil-kamath-martin-escobari
    type: experience
    speaker_confidence: high
    text: >
      Martin Escobari, addressing Nikhil directly while discussing his
      own marriage, states "I know you're not married" -- Nikhil does
      not contest this and responds jokingly about learning
      Portuguese/Spanish.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SPLFyVyTI1A&t=2258s"
      start_timestamp: "37:38"
      end_timestamp: "37:55"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-119. Second-hand
      (asserted about Nikhil by Martin, not stated by Nikhil himself in
      the first person). Confirmed via the video's dense transcript at
      37:38-37:55: "...28 years together. How long did you date before
      you were married? -- Three years. -- I know you're not married.
      -- Yeah... I'm a voice from the future. Maybe I need to learn
      Spanish. Do you know someone? -- I recommend Portuguese, but you
      can also learn Spanish."

  - id: nikhil-kamath-121
    person: nikhil-kamath
    source: nikhil-kamath-martin-escobari
    type: belief
    speaker_confidence: high
    text: >
      Describes rebalancing his own portfolio so that his largest
      allocation will soon be Indian IT-services and banking stocks,
      buying them at roughly 12-15x earnings -- calling this
      counterintuitive in an AI-first world, but justified by their
      durable competitive moats and his long-term bet that India will
      become a $10 trillion economy, attributing his own wealth to
      having invested heavily in India.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SPLFyVyTI1A&t=4055s"
      start_timestamp: "1:07:35"
      end_timestamp: "1:08:30"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-119.
      Cross-reference: consistent with nikhil-kamath-082 (Brian
      Armstrong episode), where he similarly favors a large, cheap
      Indian IT-services company over an expensive US AI company; this
      statement adds much more specific portfolio-allocation detail.
      Confirmed via the video's dense transcript at 1:07:35-1:08:30:
      "When I allocate money, because I'm all-in on India -- also
      because I made whatever little money I have from that country --
      I draw the extrapolation that at some point we'll be a $10
      trillion economy... And I'm kind of rebalancing my portfolio to
      reflect that in a manner where, strangely enough, my biggest
      allocation soon will be IT services and banking. Because of the
      moats these industries sit on, it's the most counter-intuitive
      thing to invest in, in an AI-first world. Somehow for India, I
      feel like it makes sense, and I can buy these companies at like
      12 times, 14, 15 times -- very well-run large companies, very
      defensible."

  - id: nikhil-kamath-122
    person: nikhil-kamath
    source: nikhil-kamath-martin-escobari
    type: experience
    speaker_confidence: high
    text: >
      Mentions he interviewed Anthropic's CEO the previous month,
      calling him one of his favorite people in the world -- describing
      him as a humble, idealistic biologist-turned-founder, and noting
      his age as 41.
    topic: relationships
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=SPLFyVyTI1A&t=4327s"
      start_timestamp: "1:12:07"
      end_timestamp: "1:12:36"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-119. Anthropic's
      CEO Dario Amodei is confirmed by name in the transcript (a
      corresponding episode already exists in this dataset -- see
      sources/nikhil-kamath/dario-amodei). Confirmed via the video's
      dense transcript at 1:12:07-1:12:36: "I interviewed the Anthropic
      guy last month. He's fantastic, Dario, he's fantastic, one of my
      favorite people in the world... He's a biologist, he's an
      idealist, he's built an amazing company... he's such a humble,
      idealistic person, and young, he's 41." (Martin then mistakenly
      says "he's your age," to which Nikhil clarifies his own age is
      39, not Dario's.)

