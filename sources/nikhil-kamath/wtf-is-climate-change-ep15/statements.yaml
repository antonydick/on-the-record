  - id: nikhil-kamath-175
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-climate-change-ep15
    type: belief
    speaker_confidence: high
    text: >
      Offers his own layperson's explanation of climate change, explicitly
      prefaced as "my very idiotic non-aware description": the sun emits
      rays, each surface on the planet reflects them back differently
      (a phenomenon he identifies as albedo), and as that heat radiates
      back it gets trapped in the atmosphere due to higher concentrations
      of carbon dioxide, methane, and water vapor, raising the temperature.
    topic: climate change
