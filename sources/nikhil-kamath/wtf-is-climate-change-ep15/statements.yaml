statements:
  - id: nikhil-kamath-175
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-climate-change-ep15
    type: belief
    speaker_confidence: high
    text: >
      Offers his own layperson's explanation of climate change, explicitly
      prefaced as "my very idiotic non-aware description": the sun emits
      rays, each surface on the planet reflects them back differently
      (a phenomenon he identifies as albedo), and as that heat radiates
      back it gets trapped in the atmosphere due to higher concentrations
      of carbon dioxide, methane, and water vapor, raising the temperature.
    topic: climate change
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=2q7-cTPwf-g&t=2775s"
      start_timestamp: "46:17"
      end_timestamp: "46:37"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: five-person panel (Nikhil hosting environmental
      researcher Navroz Dubash, RT Industries' Mirik Gogri, actress and
      climate activist Bhumi Pednekar, and Centre for Science and
      Environment director Sunita Narain), no diarization in the
      auto-transcript, but confirmed via clear video (Nikhil on camera).
      Confirmed at 46:17-46:37 ("What is Climate Change? Simplified"
      chapter): "...I'll give you my very idiotic non-aware description
      of IT Sun emits Rays each [surface reflects them back differently]
      ...[alb]edo when the heat is going back it gets trapped in the
      atmosphere by virtue of [CO2, methane, water vapor and temperature]
      rises but I want each of you in your own words describe climate
      change for me."

  - id: nikhil-kamath-176
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-climate-change-ep15
    type: belief
    speaker_confidence: high
    text: >
      States, prefaced as "I have a very basic take on this," that a large
      portion of the Indian public does not know that "climate change" is
      a defined concept, though he distinguishes this from the rural
      population (farmers, fishermen, nomads, and others who work directly
      with the land), who he argues experience and understand the
      phenomenon's effects first-hand even without using that specific
      term.
    topic: climate change
