  - id: nikhil-kamath-035
    person: nikhil-kamath
    source: nikhil-kamath-ted-sarandos
    type: experience
    speaker_confidence: high
    text: >
      Says he was previously an investor in the multiplex cinema chain
      that is now PVR Inox (India's largest, formed from a merger),
      and describes a personal friendship with a person referred to
      as "AJ" who runs the company.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=QT2FGbR0nIM&t=2537s"
      start_timestamp: "42:17"
      end_timestamp: "42:37"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-034. "AJ" is
      confirmed to be "Ajay" (i.e. Ajay Bijli of PVR, corroborating
      nikhil-kamath-188/191 from other episodes), not a separate
      unidentified person. Confirmed via the video's dense transcript
      at 42:17-42:37: "...there's, again, another friend of mine called
      Ajay. I was an investor in that company for a while. Runs the...
      it used to be the largest chain, but now they've combined to
      become the only chain of multiplexes in the country. It's called
      PVR and INOX together. So whenever me and Ajay catch up, I'm
      always asking him, 'What is next for the theatre business?'"

