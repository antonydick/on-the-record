  - id: nikhil-kamath-235
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-cohort-3
    type: experience
    speaker_confidence: high
    text: >
      States that he is 39 years old, and reflects that since an average
      Indian lives to about 73, he has roughly 34 New Year's Eves left,
      of which maybe 20 will come at an age too old to do the things he
      can do today — so practically he estimates he has only around 10
      "good" New Year's Eves left in the sense that matters to him,
      possibly a few more given that he monitors his health.
    topic: personal life
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lJ3Wt-ng1Ls&t=3550s"
      start_timestamp: "59:10"
      end_timestamp: "59:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same format and caveat as nikhil-kamath-231.
      Attributed to Nikhil as a first-person reflection ("I'm 39 years
      old... I probably have 34 New Year's left") in response to a
      founder's question about marriage/societal pressure, continuing the
      same personal exchange as the other statements pulled from this
      episode. Cross-reference: consistent with the recording's early-2026
      publish date and Nikhil's previously established birth-year range
      in this corpus. Confirmed via live captions (this video's
      transcript panel failed to load) at 59:10-59:40: "I'm 39 years
      old... And then, while I was thinking about it, at 39, an average
      Indian lives to 73,... In 34 New Years,... I only probably have
      like ten, if I were to be pushing it." This confirms the age (39),
      life-expectancy figure (73), the "34 New Year's" total, and the "10
      good ones" estimate all word-for-word.

