statements:
  - id: nikhil-kamath-231
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-cohort-3
    type: experience
    speaker_confidence: high
    text: >
      Says he used to be a trader but, having become slower with age, no
      longer really trades day-to-day; instead he now tends to take more
      cyclical, thesis-driven calls on the market. Says he and "a team of
      mine called Naman's team" spend a lot of time doing sector thesis
      work across the whole market to narrow down which sectors have the
      highest growth potential over the next 10 years, then allocate
      capital accordingly. Names energy transition as the sector leading
      that thesis currently, saying the team invested over the prior year
      in solar panel companies, battery companies, electric vehicles, and
      grid/transformer-efficiency companies.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lJ3Wt-ng1Ls&t=4356s"
      start_timestamp: "1:12:36"
      end_timestamp: "1:14:05"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: this source is a WTFund cohort demo-day style
      session (8 founder teams presenting/being interviewed, extensive
      informal back-and-forth banter), with no diarization in the
      auto-transcript, and this particular episode opens with an
      ambiguous framing passage where an unidentified speaker describes
      "simulating Nikhil's persona in my head" to prepare for the
      session — meaning the opening lines cannot be confidently
      attributed to Nikhil himself. However, this statement and the other
      statements pulled from this episode occur later, in an extended,
      continuous personal Q&A exchange where the interviewer reciprocates
      personal questions from a founder; attribution to Nikhil here is
      high-confidence because the trading background and evolution
      described ("used to be a trader," now doing thesis-driven sector
      allocation) matches details already established in this corpus from
      multiple other episodes (e.g. cross-referenced "19-20 years
      full-time trading" self-identification statements in other
      sources). Confirmed via live captions (this video's transcript
      panel failed to load) at 1:12:36-1:14:05: "trading is not subject
      to anything... We've been doing sector thesis of all the
      sectors... So what sector do you think? What were the top three?...
      What is leading right now?... We did, last year, a whole bunch of
      solar panel companies,". The specific "Naman's team" name and the
      full battery/EV/grid-transformer list were not caught verbatim
      within the sampled window, but the sector-thesis methodology and
      the solar-panel/energy-transition investment claim are confirmed.

  - id: nikhil-kamath-232
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-cohort-3
    type: experience
    speaker_confidence: high
    text: >
      Says he takes a bunch of longevity-related supplements and does
      cold plunges, sauna, and workouts every day, describing himself as
      "into all the fads" without being sure whether they work. Says he
      distinguishes legacy from longevity: he doesn't care much about
      legacy or what people think of him after he's gone (he expects
      people will only remember him for "5 years, 10 years max"), but
      values longevity for himself specifically because a better quality
      of life in 10 years — for example, still being able to play padel
      for two hours a day — is something he would personally enjoy.
    topic: personal life
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lJ3Wt-ng1Ls&t=4300s"
      start_timestamp: "1:11:40"
      end_timestamp: "1:11:57"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same format and no-diarization caveat as
      nikhil-kamath-231. Attributed to Nikhil as part of the same
      continuous personal-question exchange with a founder, in first
      person ("I do take a bunch of supplements," "legacy is for others,
      longevity is for myself"). Confirmed via live captions (this
      video's transcript panel failed to load) at 1:11:40-1:11:57:
      "Legacy, why do you believe in longevity,... Because if the quality
      of my life ten years from now can be better..." The specific
      supplements/cold-plunge/sauna/padel details and the "5-10 years
      max" legacy framing were not caught verbatim within the sampled
      window, but the core legacy-vs-longevity distinction and its stated
      rationale are confirmed.

  - id: nikhil-kamath-233
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-cohort-3
    type: experience
    speaker_confidence: high
    text: >
      Recommends the founders invest time in becoming better
      storytellers, admitting he himself "sucked at it." Says he hired a
      speech coach named Michael a few years ago — an Israeli who also
      teaches a number of US politicians, whose company is called
      Virtuoso — who flies in and lives with him for a week at a time,
      taking away his phone and devices and making him write for two and
      a half to three hours without a break.
    topic: personal life
