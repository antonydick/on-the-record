  - id: nikhil-kamath-234
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-cohort-3
    type: experience
    speaker_confidence: high
    text: >
      Describes a personal annual tradition: every year on his birthday
      he hosts a summit where he invites people he considers the
      smartest and most relevant under age 45 across creative fields,
      industry, and journalism. Says they book a large venue for about
      100 people, ban cameras and cell phones from the room, and spend
      the day having debates and conversations about topics people are
      otherwise scared to discuss, calling it a day with "150 of the
      smartest people in India."
    topic: personal life
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lJ3Wt-ng1Ls&t=4110s"
      start_timestamp: "1:08:30"
      end_timestamp: "1:08:46"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same format and caveat as nikhil-kamath-231.
      Attributed to Nikhil as a direct first-person answer ("every year
      on my birthday we have this big summit...") to a founder's question
      of whether he celebrates his birthday. Confirmed via live captions
      (this video's transcript panel failed to load) at 1:08:30-1:08:46:
      "Yeah. Every year, on my birthday, we have this big summit... We
      book a big, fancy place, 100 people sit and have debates... And
      it's a fun day." The specific "under age 45," "150 smartest people
      in India," and no-cameras/phones details were not caught verbatim
      within the sampled window, but the core annual birthday-summit
      claim (large venue, ~100 people, debates) is confirmed word-for-
