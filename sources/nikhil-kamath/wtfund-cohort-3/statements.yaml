      end_timestamp: "1:16:48"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same format and caveat as nikhil-kamath-231.
      Attributed to Nikhil as part of the same continuous personal
      exchange, in first person ("I got a speech coach a few years ago,"
      "he flies down, lives with me for a week"). Confirmed via live
      captions (this video's transcript panel failed to load) at
