  - id: nikhil-kamath-132
    person: nikhil-kamath
    source: nikhil-kamath-neal-mohan
    type: experience
    speaker_confidence: high
    text: >
      Admits a personal quirk: watching Netflix on his TV makes him
      subconsciously feel like he is "doing something wrong," while
      watching YouTube for similar leisure content makes him feel like
      he is "doing something right," which he attributes to an
      unconscious association between YouTube and learning.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=8uFOBdle3WY&t=3560s"
      start_timestamp: "59:20"
      end_timestamp: "59:29"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-130. Confirmed
      via the video's dense transcript at 59:20-59:29: "When I turn on a
      screen, my TV, and I watch Netflix, I feel like I'm doing
      something wrong... but when I turn on my TV and I watch YouTube,
      very subconsciously, I feel like I'm doing something right. I
      don't know how to describe this."

  - id: nikhil-kamath-133
    person: nikhil-kamath
    source: nikhil-kamath-neal-mohan
    type: experience
    speaker_confidence: high
    text: >
      Describes how his app usage has shifted over the past six or
      seven years: he did not use Spotify then, but now turns to
      Spotify for music (a role YouTube used to fill for him), to
      YouTube for podcasts and learning-oriented content, and to
      Netflix for entertainment.
    topic: personal habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=8uFOBdle3WY&t=3684s"
      start_timestamp: "1:01:24"
      end_timestamp: "1:01:56"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-130. Confirmed
      via the video's dense transcript at 1:01:24-1:01:56: "So five
      years ago when I turned on YouTube, it was to play songs... that
      position in my mind somehow has been lost to Spotify. Now when I
      think of a song, I go to Spotify. When I think of
      entertainment-entertainment, I go to Netflix... Why do you feel
      that way about music? -- I don't know, it's just how I use it...
      I didn't have Spotify six, seven years ago, and also I'm not the
      generic Indian user."

