    source: nikhil-kamath-neal-mohan
    type: experience
    text: >
      Admits a personal quirk: watching Netflix on his TV makes him
      subconsciously feel like he is "doing something wrong," while
      watching YouTube for similar leisure content makes him feel like
      he is "doing something right," which he attributes to an
      unconscious association between YouTube and learning.
