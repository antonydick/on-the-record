  - id: nikhil-kamath-130
    person: nikhil-kamath
    source: nikhil-kamath-neal-mohan
    type: assertion
    speaker_confidence: high
    text: >
      States he is 38 years old, and describes his personal media
      journey growing up largely in Bangalore: watching Hindi TV
      serials on traditional broadcast TV, following cricket, and
      getting his first personal media-consumption device around age
      16-17.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=8uFOBdle3WY&t=1041s"
      start_timestamp: "17:21"
      end_timestamp: "18:03"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing YouTube
      CEO Neal Mohan), confirmed via the video's dense transcript at
      17:21-18:03: "So, Neal, I'm 38 years old. I have grown up in
      India, largely in Bangalore. So my relationship with content went
      from watching Hindi TV serials, growing up, on TV, on traditional
      broadcast TV, to cricket, and then maybe getting my first personal
      device or a medium to consume content when I was 16 or 17 years
      old... to where I sit today." Cross-reference: this episode is
      published 2025-05-24, between nikhil-kamath-101 (age 36, Kiran
      Mazumdar-Shaw episode, published 2023-07-22) and
      nikhil-kamath-097/119 (age 39, Howard Marks/Martin Escobari
      episodes, published 2026-05). The 36 -> 38 -> 39 progression
      across these publish dates is internally consistent with a single
      birth year, now backed by direct verification of this instance.

