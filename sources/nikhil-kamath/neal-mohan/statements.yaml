    source: nikhil-kamath-neal-mohan
    type: experience
    text: >
      Describes how his app usage has shifted over the past six or
      seven years: he did not use Spotify then, but now turns to
      Spotify for music (a role YouTube used to fill for him), to
      YouTube for podcasts and learning-oriented content, and to
      Netflix for entertainment.
