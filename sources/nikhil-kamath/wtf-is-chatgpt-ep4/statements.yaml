      same continuous finance monologue block.

  - id: nikhil-kamath-172
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-chatgpt-ep4
    type: experience
    speaker_confidence: high
    text: >
      Says he has a hydroponic farm of roughly 400-500 square feet on the
      terrace of his house in JP Nagar, Bangalore, which he says produces
      enough food for his family, raised in the context of arguing that
      small-space hydroponic farming would be a needed food-production
      method if a large enough population had to become self-sufficient.
    topic: personal life
    verification:
      status: draft
