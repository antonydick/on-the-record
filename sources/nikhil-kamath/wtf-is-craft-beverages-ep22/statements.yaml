    speaker_confidence: high
    text: >
      Describes his investing approach when asked who he'd invest in within
      quick-commerce: he evaluates companies as a multiple of the EBITDA or
      net cash they generate, finds current quick-commerce valuations
      expensive by that measure, and says he has not invested in the space
      as a result, characterizing himself as "more a conservative
      investor."
