  - id: nikhil-kamath-194
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-craft-beverages-ep22
    type: experience
    text: >
      Says he did not drink coffee as recently as three years before this
      recording and avoided caffeine generally, instead drinking green tea
      on the belief it was healthy; says his view of green tea has since
      shifted to associating it with microplastics, and that he now drinks
      coffee daily and feels unwell without having two cups a day.
    topic: personal life
