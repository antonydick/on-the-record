  - id: nikhil-kamath-196
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-craft-beverages-ep22
    type: belief
    text: >
      Says that, having attended the World Economic Forum in Switzerland
      shortly before this recording and heard Europeans and Americans
      discussing Trump-era trade fragmentation, he believes a more
      protectionist world (e.g. India reciprocating against companies like
      Coca-Cola and Pepsi) would be an inflection point favoring India's
      craft beverage industry. Adds that he has a personal "buy Indian"
      rule that extends beyond beverages to clothing, food, sneakers, and
      electronics: he will generally choose an Indian brand over a
      foreign one as long as the quality gap is within about 5% or the
      price premium is within about 5%.
    topic: worldview
    verification:
