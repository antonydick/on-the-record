    person: nikhil-kamath
    source: nikhil-kamath-mati-staniszewski
    type: experience
    speaker_confidence: high
    text: >
      Says his fintech company (unnamed in this exchange) has about 14
      people, mostly based in Bengaluru with a few near Mumbai; confirms
      he is originally from Bengaluru and is now based partly there and
      partly in Mumbai and Goa.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=ef3D5Ak1HP4&t=15s"
      start_timestamp: "0:15"
      end_timestamp: "0:30"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing ElevenLabs
      co-founder/CEO Mati Staniszewski), confirmed via the video's dense
      transcript at 0:15-0:30: "...We have... I think it's between 10
      and 15, I think it's 14 people now, if we count the new people
      that are joining or joined. And which city? -- Mostly Bengaluru,
      and few close to Mumbai. I'm from Bengaluru. -- Oh, are you based
      there or you're... -- Partly based there. -- Where is the other
      part? -- Mumbai and Goa."

  - id: nikhil-kamath-126
    person: nikhil-kamath
    source: nikhil-kamath-mati-staniszewski
    type: experience
    speaker_confidence: high
    text: >
      Confirms he is a small ("tiny") investor in Nothing, Carl Pei's
      consumer electronics company, and mentions that after this
      recording he is traveling to London to visit Nothing's design
      studio.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=ef3D5Ak1HP4&t=75s"
      start_timestamp: "1:15"
      end_timestamp: "3:25"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-125. Confirmed
      via the video's dense transcript at 1:15-3:25: "...Do you know
      Carl, the Nothing guy? -- Yeah, yeah, yeah, yeah, of course... I
      think there's a great chance for Nothing... So we engaged
      recently, actually... maybe that's a little bit biased, but he can
      lead with voice in many ways, you know, the Nothing headphones, I
      think are great... Like after this, I'm actually going to London.
      I'm gonna see Carl, their design studio is there." The word "tiny"
      was not caught verbatim, but "we engaged recently" alongside the
      London/design-studio detail confirms the substance of an investor
      relationship.

  - id: nikhil-kamath-127
    person: nikhil-kamath
    source: nikhil-kamath-mati-staniszewski
    type: belief
    speaker_confidence: high
    text: >
      Elaborates on his motivation for wanting to build a new social
      media platform for India: believes current social media is
      "broken," citing data showing declining organic engagement among
      16-20 year olds and a near-total loss of organic (non-branded,
      non-influencer) content; says he is uncomfortable that a foreign
      country's algorithm shapes the mood and cultural evolution of
      India's youth; and describes wanting a tightly gated platform of
      verified real people with an algorithm that does not reward
      negativity or outrage.
    topic: business
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=ef3D5Ak1HP4&t=2798s"
      start_timestamp: "46:38"
      end_timestamp: "51:32"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-125.
      Cross-reference: substantially elaborates on nikhil-kamath-084
      (Chamath Palihapitiya episode) and nikhil-kamath-065
      (Brian Armstrong episode's WhatsApp/data-sovereignty view).
      Confirmed via the video's dense transcript at 46:38-51:32: "We've
      been flirting with the idea of building a social media platform in
      India... On top of Zerodha or separately? -- Separately... Why did
      you want to start a social media? -- I believe social media is
      broken today... [we want a] very tight funnel on the top where we
      control who enters the app, like incumbent social media probably
      has bots engaging with you."

