statements:
  - id: nikhil-kamath-178
    person: nikhil-kamath
    source: nikhil-kamath-wtf-entrepreneur-flaws-ep16
    type: experience
    speaker_confidence: high
    text: >
      Says he has seen the Rare Rabbit store in the mall near his house in
      UB City, Bangalore, many times, and that he (through his fund/team)
      was in the process of investing in Rare Rabbit; recounts that when
      they began researching the company more closely, its profile seemed
      almost implausible for its era -- a bootstrapped Indian-grown
      Western-clothing manufacturer that was profitable after tax with no
      outside investors and no dilution.
    topic: investing
    verification:
      status: reviewed
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: four-person panel (Nikhil hosting OYO founder
      Ritesh Agarwal, Mamaearth co-founder Ghazal Alagh, and Rare Rabbit
      founder Manish Poddar), no diarization. This episode has each guest
      narrate an extended personal life story in turn, which makes
      first-person passages easy to misattribute -- long stretches
      initially read as candidates for Nikhil (a detailed childhood story
      involving a temple in Odisha, a self-given "Chief Clarity Officer"
      title, a sports-based hiring philosophy, and an India sovereign
      credit rating critique) were on closer reading part of Ritesh
      Agarwal's own narrated segment, not Nikhil's, and were excluded.
      This statement is instead drawn from the host's own introduction of
      Manish Poddar/Rare Rabbit before the interview segment begins,
      which is stylistically distinct (third-person framing of the guest,
      "we started researching the company") from the guests' own
      first-person life narratives. Located to the "Introduction to Rare
      Rabbit" chapter, which the video description's official timestamps
      place at 1:13:50 of the 4:14:42 video
      (https://www.youtube.com/watch?v=FPV5fAkqyBs&t=4430s) -- this is
      the host's spoken segue directly preceding "1:15:01 A biodata was
      created around the time of my marriage," the first line recovered
      from this pass's caption search, so the content fits squarely
      between the chapter marker and that line. Live captions for this
      video did not render in this browsing session despite repeated
      attempts (toggling the CC button, reloading, seeking within the
      chapter), so the exact wording could not be checked against a
      verbatim transcript. Left at reviewed rather than forcing an
      unconfirmed timestamp.

  - id: nikhil-kamath-179
    person: nikhil-kamath
    source: nikhil-kamath-wtf-entrepreneur-flaws-ep16
    type: experience
    speaker_confidence: high
    text: >
      Describes himself as having an "avoidant attachment" tendency: he
      fears being seen as vulnerable or receiving sympathy, and when
      something bad is happening in his life he will tend to hide it
      rather than mention it. Says his coping mechanism when multiple
      things are going wrong at once is to compartmentalize -- setting
      aside the problem that isn't working, addressing the others first,
      and returning to it afterward, which he describes as "what works
      for me."
    topic: personal life
    verification:
      status: reviewed
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-178. This
      self-disclosure comes in first person during the closing
      recap/summary segment, offered in direct response to and contrast
      with Ritesh Agarwal's own account of hiding difficulties from his
      leadership team, with Ritesh then asking Nikhil "how do you look at
      it" before Nikhil's compartmentalizing answer. Based on the video
      description's official chapter list, this most likely falls within
      "04:03:00 - Advice to Entrepreneur to Find Right Opportunity" (the
      general reflective wrap-up chapter that follows Ritesh's own
      low-days/vulnerability discussion at "03:40:35 - What helped Ritesh
      deal with low days?" and precedes the closing "04:12:00 - WTF Fund"
      segment) -- but this pass's caption search only recovered sparse
      "key moments" transcript entries that stop at 3:57:01, well short
      of this chapter, and live captions did not render in this browsing
      session despite repeated attempts. The chapter attribution here is
      inferred from the episode's narrative structure rather than
      confirmed against the video directly. Left at reviewed.

  - id: nikhil-kamath-180
    person: nikhil-kamath
    source: nikhil-kamath-wtf-entrepreneur-flaws-ep16
    type: experience
    speaker_confidence: high
    text: >
      Describes the show's recurring end-of-episode practice of "paying
      forward" some of their luck by funding a young founder, and,
      inspired by Ritesh Agarwal's account of how Peter Thiel's fellowship
      changed his life, proposes doing this episode's version as a "WTF
      Founders Fellowship": he and the other three panelists would each
      commit 20 lakh rupees (80 lakh rupees total) as a grant to a young
      founder selected from open applications reviewed by all four of
      them, noting the show has previously run similar pay-it-forward
      segments for influencers and for EV-sector charities.
    topic: personal life
    verification:
      status: reviewed
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-178. This is the
      show's recurring closing format, proposed and narrated in first
      person by the host ("we'll all uh commit a certain amount of
      money... should we do 20 lakhs each"). Located to the "04:12:00 -
      WTF Fund" chapter per the video description's official timestamps
      (https://www.youtube.com/watch?v=FPV5fAkqyBs&t=14720s), consistent
      with the recurring closing pay-it-forward format confirmed at
      timestamp in every other episode processed this session. This
      pass's sparse "key moments" transcript search stopped at 3:57:01,
      short of this chapter, and live captions did not render in this
      browsing session despite repeated attempts, so the exact wording
      was not checked against a verbatim transcript. Left at reviewed.
