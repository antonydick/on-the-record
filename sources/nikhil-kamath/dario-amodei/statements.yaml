statements:
  - id: nikhil-kamath-042
    person: nikhil-kamath
    source: nikhil-kamath-dario-amodei
    type: experience
    speaker_confidence: high
    text: >
      Describes recently hiring a developer to spend a couple of hours
      a day teaching him the basics of coding, motivated by a fear of
      missing out on how AI is changing the world. Says he connected
      Claude to his Google Drive, mail, and calendar, used Claude's
      "cowork" feature and Claude Code to write simple financial-
      research scripts, and later set up a Claude-based bot
      (referred to as "open claw") on a Mac mini connected to a
      Telegram account, using it to manage files on a remote server.
      Separately admits he personally struggled to get Claude Code
      working at first, describing himself as having no coding
      background.
    topic: work-habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=68ylaeBbdsg&t=1364s"
      start_timestamp: "22:44"
      end_timestamp: "24:15"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Dario
      Amodei), confirmed via live captions at 22:44-24:15 ("Using Claude
      personally, AI knowing you" chapter): "So, in my own journey, I'm
      -- and I'm not a programmer, I don't have a background in coding
      -- [hired a developer] just to, like, push me to sit for a couple
      of hours a day [teaching me]... like the fear of missing out on
      how the world is changing... and then I started using Claude Code
      to write simple programs, basically to research stock markets and
      stuff like that... And then I went into ClawdBot, which is now
      OpenClaw... and now I chat with it and I try and move files from
      A to B." Confirms the "open claw"/"ClawdBot" (now OpenClaw)
      product name and its file-management use.

