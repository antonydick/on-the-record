      Describes recently investing in the coffee brand Subko, and
      says he is considering (but had not yet invested in, as of this
      recording) a brand called "111" that makes shirts using Karnataka
      Bandani/ikat textiles -- cites both as examples of small Indian
      craft brands he's drawn to over larger foreign brands.
