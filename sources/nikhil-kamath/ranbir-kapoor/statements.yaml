  - id: nikhil-kamath-022
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: experience
    text: >
      Describes his father passing away roughly three months before
      this recording, while Nikhil was traveling (in Dubai en route to
      a work meeting); says he received word his father was unlikely
      to survive just before boarding his flight back to Bangalore, and
      that his father died during the flight, before he landed --
      describes significant guilt about not being present. Separately
      describes that 13 days later, during the family's mourning
      rituals, his brother Nithin had a stroke while Nithin's wife was
      simultaneously in Dubai being treated for stage 3 cancer.
    topic: family
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-020. This is
      sensitive personal/family information -- treat with particular
      care during verification, and do not surface any part of it as
      established fact (per SKILL.md) unless and until a human has
      directly confirmed it against the recording. This is a strong
      example of the kind of easily-missed, scattered personal
      disclosure this project exists to capture -- but that makes
      careful, accurate verification more important here, not less.

  - id: nikhil-kamath-023
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: belief
    text: >
      Says he rents rather than owns his home in Bangalore, and is
      skeptical of residential real estate as an investment in India,
      citing rental yields of around 3% against prevailing borrowing
      costs of 10-11% -- says he feels like he's "getting a deal"
      renting rather than buying and has no emotional attachment to
      owning a home.
    topic: investing
