statements:
  - id: nikhil-kamath-020
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: experience
    speaker_confidence: high
    text: >
      Describes his childhood geography: born in Shimoga, Karnataka;
      his father worked at Canara Bank and was transferred roughly
      every three years, taking the family to Hassan (Karnataka) and
      then Karnal; the family settled in Bangalore when he was about 7,
      and he describes himself as "pretty much a Bangalore boy" for
      the 30 years since.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=fEnwMyHejtQ&t=289s"
      start_timestamp: "4:49"
      end_timestamp: "5:49"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Ranbir
      Kapoor), confirmed via the video's dense transcript at 4:49-5:49:
      "Born in Shimoga in Karnataka. Dad worked in Canara Bank, so he got
      transferred typically once every 3 years -- moved from Shimoga to
      Hassan, again in Karnataka, then went to [Karnal]. Lived in a
      place called Karnal for 3 years... I stayed in Karnal till I was
      about six or seven... Then came to Bangalore... from the age of 7
      till 37, for the last 30 years, I've been pretty much a Bangalore
      boy, [and] have immense love for the city, which has in a way
      given me everything." This also independently confirms his age
      as 37 at the time of this recording, matching nikhil-kamath-013.

  - id: nikhil-kamath-021
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: experience
    speaker_confidence: high
    text: >
      Describes his early trading days roughly 19-20 years before this
      recording: starting with small capital and trading aggressively
      (buying far out-of-the-money options), building up a corpus over
      a few years, then losing it all in a single day and "going bust"
      -- says this happened to him a couple of times, but not in the
      13-14 years before this recording.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=fEnwMyHejtQ&t=4767s"
      start_timestamp: "1:19:27"
      end_timestamp: "1:19:51"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-020. Confirmed
      via the video's dense transcript at 1:19:27-1:19:51: "...you trade
      like mad, right, like you buy way out-of-the-money options if you
      don't have enough capital -- to do trading another way, I'm
      talking like 19, 20 years ago now -- you build up enough of a
      corpus over 1 year, 2 years, 3 years, and then you lose it all in
      one day where you go bust. I've had that happen a couple of times.
      Not in the last 13, 14 years, but before that."

  - id: nikhil-kamath-022
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: experience
    speaker_confidence: high
    text: >
      Describes his father passing away roughly three months before
      this recording, while Nikhil was traveling (in Dubai en route to
      a work meeting); says he received word his father was unlikely
      to survive just before boarding his flight back to Bangalore, and
      that his father died during the flight, before he landed --
      describes significant guilt about not being present. Separately
      describes that 13 days later, during the family's mourning
      rituals, his brother Nithin had a stroke while Nithin's wife was
      simultaneously in Dubai being treated for stage 3 cancer.
    topic: family
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=fEnwMyHejtQ&t=2237s"
      start_timestamp: "37:23"
      end_timestamp: "41:41"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-020. This is
      sensitive personal/family information -- treated with particular
      care; the content below is directly confirmed against the
      recording via the video's dense transcript, not surfaced as
      unverified. Confirmed at 37:23-41:41: "...my dad passed away
      recently, like 3 months ago, and abruptly, like we were not
      expecting it... I was in Dubai on the way to a work meeting
      somewhere else, and when I got the call from the hospital, my mom
      said we're rushing him to the hospital, and just before I boarded
      the flight back to Bangalore, the doctor told me he's not making
      it... I actually boarded, and just before taking off... a 3, 3 and
      a half hour flight to Bangalore... [Nikhil: did he make it?] No,
      no, no, he was gone. He was gone while I was on the flight, and
      the doctor told me they were not able to revive him. But the guilt
      started becoming exponentially bigger from that point... 3 months
      ago, somewhere in Jan, day 13, we went to eight temples in one day
      in [his hometown]... we said we will go do the last 13th in his
      hometown. We did that, came back to Bangalore. Day 15, brother has
      a stroke... while Nithin has a stroke on the 15th day, his wife is
      in Dubai getting treated for cancer, she had stage three cancer...
      I'm in the hospital then again with Nithin for 3, 4 days."

  - id: nikhil-kamath-023
    person: nikhil-kamath
    source: nikhil-kamath-ranbir-kapoor
    type: belief
    speaker_confidence: high
    text: >
      Says he rents rather than owns his home in Bangalore, and is
      skeptical of residential real estate as an investment in India,
      citing rental yields of around 3% against prevailing borrowing
      costs of 10-11% -- says he feels like he's "getting a deal"
      renting rather than buying and has no emotional attachment to
      owning a home.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=fEnwMyHejtQ&t=5610s"
      start_timestamp: "1:33:30"
      end_timestamp: "1:33:59"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-020. Confirmed
      via the video's dense transcript at 1:33:30-1:33:59: "I'm not a
      fan. I feel like rental yields on residential real estate in
      India are 3%... the rate of borrowing in society today is 10, 11%.
      Even after you made so much of money... I just feel like I'm
      getting a deal when I'm renting versus buying. I feel like
      there's no emotional thing that I want to own a home."

