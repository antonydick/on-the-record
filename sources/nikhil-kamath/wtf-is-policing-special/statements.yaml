statements:
  - id: nikhil-kamath-217
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-policing-special
    type: experience
    speaker_confidence: high
    text: >
      Says he (along with Accel) recently invested in an electric flying-
      taxi (eVTOL) company that is planning to take off from locations
      such as hotel rooftops in Bangalore, with a range of about 160
      kilometers, capacity for six passengers, and a per-machine cost of
      roughly 7-8 crore rupees; says the company's plan is to price the
      service at a premium (perhaps 3-5x) over Uber and recoup the
      machine cost quickly at that price point.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=LcWoP6KtZKw&t=832s"
      start_timestamp: "13:52"
      end_timestamp: "14:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: this episode is a ride-along interview with
      Bengaluru's police commissioner and traffic police commissioner
      (referred to as "Anuchet" in the auto-transcript), no diarization,
      but the two-plus-host format makes turn-taking clearer than in
      multi-founder panels. Confirmed via video at 13:52-14:40, during a
      seated outdoor conversation (the "Why is Bengaluru [criticized for
      traffic]" segment, before the later ride-along car segment):
      Nikhil says "I did, and Accel did" (prompting a reaction "Oh, that
      air taxi?" from an officer) ... "So it's an electric vehicle" ...
      "And the cost per machine is something like 7-8 crores" (corrects
      an auto-transcript garble of "78 crores" seen via NotebookLM) ...
      ending with "It's very interesting, maybe that's the answer" from
      the officer.

