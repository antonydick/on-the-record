    speaker_confidence: high
    text: >
      Says he (along with Accel) recently invested in an electric flying-
      taxi (eVTOL) company that is planning to take off from locations
      such as hotel rooftops in Bangalore, with a range of about 160
      kilometers, capacity for six passengers, and a per-machine cost of
      roughly 7-8 crore rupees; says the company's plan is to price the
      service at a premium (perhaps 3-5x) over Uber and recoup the
      machine cost quickly at that price point.
    topic: investing
