statements:
  - id: nikhil-kamath-212
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-longevity-ep21
    type: experience
    speaker_confidence: high
    text: >
      Discloses that his brother and Zerodha co-founder Nithin Kamath
      suffered a stroke in January (shortly before this recording),
      despite being, in Nikhil's description, an "obsessive workout guy"
      who takes around 20-30 supplement tablets a day and had completed
      an Ironman triathlon at peak fitness just a few months earlier, in
      October/November of the previous year. Nithin confirms the account
      himself on camera, noting this was his first appearance on camera
      since the stroke.
    topic: personal life
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=fEUoJSTYtyc&t=730s"
      start_timestamp: "12:10"
      end_timestamp: "14:20"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: multi-guest panel (Nikhil hosting his brother
      Nithin Kamath, Bryan Johnson, Accel India/BioPeak & Longevity
      India's Prashanth Prakash [correcting the draft's "Prashant
      Pitti"], Fittr's Jitendra Chouksey ("JC"), and Zerodha director
      Seema Kamath), no diarization in the auto-transcript, but confirmed
      via clear video. Confirmed at 12:10-12:47 ("Future of Medical
      Innovations" chapter): Nikhil says "...that's me and uh I'm better
      known as nich's [Nithin's] brother so let him [tell you] a little
      bit about health so ... n[ithin] is like this obsessive workout guy
      ... maybe 20 to 30 tablets not prescribed by me not prescribed ...
      works out for a long time every day and he had a health Calamity
      earlier this year so he had a stroke even though he was very [fit]."
      Nithin's own on-camera confirmation follows separately at
      13:45-14:20, in the same continuous segment: "...yeah I I mean I
      had the same question about last October last November I did Iron
      Man like I was I was really at my fittest I was ever been and
      January I was met with a stroke it was it was so accidental ... and
      this is like really the first time I guess I'm in front of a camera
      uh after the stroke."

