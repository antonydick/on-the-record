      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-212, resolved the
      same way. Told in first person while asking Prashanth Prakash
      [correcting the draft's "Prashant Pitti"] to explain what NAD is.
      Content confirmed present via NotebookLM (exact line: "can you
      elaborate and say what is NAD a little bit I've tried NAD once uh
