  - id: nikhil-kamath-103
    person: nikhil-kamath
    source: nikhil-kamath-kiran-mazumdar-shaw
    type: mechanism
    text: >
      Describes the podcast's original charity model: the show was
      never intended to make money, so at the end of each episode he
      and the guest each donate a set amount (proposing 25 lakh rupees
      each, 50 lakh total, for this episode) and the audience votes to
      decide which charity receives the pooled donation, with the
      stated goal of keeping the process as democratic as possible and
      scaling it up over time.
    topic: philanthropy
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-100.
      Cross-reference: an earlier, audience-vote-based version of the
      charity mechanism later described (in the more recent Chamath
      Palihapitiya episode, nikhil-kamath-083) as guest-matched startup
      grants to young Indian founders -- during verification, determine
      whether the program evolved over time from this audience-choice
      model to the founder-grant model, or whether both run in
      parallel.

