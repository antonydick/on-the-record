      pledge like I did") that he has signed the Giving Pledge, and
      mentions he consulted Nandan Nilekani for advice when considering
      it. Explains his reasoning as reaching clarity that, having
      decided he will never have children, there is no point dying with
      unspent wealth that has nowhere to go.
