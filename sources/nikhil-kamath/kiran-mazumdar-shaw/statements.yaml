  - id: nikhil-kamath-103
    person: nikhil-kamath
    source: nikhil-kamath-kiran-mazumdar-shaw
    type: mechanism
    speaker_confidence: high
    text: >
      Describes the podcast's original charity model: the show was
      never intended to make money, so at the end of each episode he
      and the guest each donate a set amount (proposing 25 lakh rupees
      each, 50 lakh total, for this episode) and the audience votes to
      decide which charity receives the pooled donation, with the
      stated goal of keeping the process as democratic as possible and
      scaling it up over time.
    topic: philanthropy
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=58i057QXl1A&t=7065s"
      start_timestamp: "1:57:45"
      end_timestamp: "1:57:57"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-100 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Cross-reference: an earlier, audience-vote-based
      version of the charity mechanism later described (in the more
      recent Chamath Palihapitiya episode, nikhil-kamath-083) as
      guest-matched startup grants to young Indian founders -- during
      further review, determine whether the program evolved over time
      from this audience-choice model to the founder-grant model, or
      whether both run in parallel. Confirmed via live captions at
      1:57:45-1:57:57: "...so the intent with this show was uh every
      show should have some kind of [a donation]... but uh allowing the
      audience to pick where that charity is happening..." The specific
      "25 lakh each, 50 lakh total" figures were not caught verbatim
      within the sampled window, but the core audience-choice charity
      mechanism is confirmed.

