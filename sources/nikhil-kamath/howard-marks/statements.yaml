    type: assertion
    text: >
      Describes the podcast's format and target audience to Howard
      Marks at the outset: most episodes are free-flowing conversations
      aimed at entrepreneurial-minded people of Indian origin roughly
      25 to 30 years old, who are looking to invest, trade, or start a
      business from the bottom up.
