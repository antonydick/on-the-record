    type: assertion
    text: >
      States that he is 39 years old, that most of his investing is in
      India, and asks Howard Marks whether -- assuming India keeps
      growing around 6-7% and per-capita GDP keeps rising -- it would be
      reasonable to stay roughly 80% allocated to equities for the next
      20 to 30 years.
