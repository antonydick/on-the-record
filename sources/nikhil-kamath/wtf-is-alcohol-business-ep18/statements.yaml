    text: >
      Discloses, while introducing guest Abhishek (of Radico Khaitan), that
      he holds a stock market equity position in Radico Khaitan bought on
      the open market -- describing it as "a very small miniature"
      shareholding relative to Abhishek's own, on the order of roughly
      400 crore rupees -- and calls it a great investment that has done
      very well for him, noting they had not previously spoken about it
      publicly.
    topic: investing
