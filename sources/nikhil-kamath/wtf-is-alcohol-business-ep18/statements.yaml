    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: four-person panel (Nikhil hosting bar
      owner/mixologist Minakshi, Goa Brewing Company co-founder Sagar,
      an alcohol-industry marketing/events entrepreneur, and Radico
      Khaitan's Abhishek Khaitan), no diarization in the auto-transcript.
      This episode's format has each guest narrate an extended personal
      story in turn, which makes first-person passages easy to
      misattribute. This statement is attributed to Nikhil because it
      immediately follows the host's own framing line ("I have to preface
      Abhishek's introduction") before the interview segment begins, and
      names Abhishek in the third person as the counterparty holding the
      much larger stake, consistent with an outside investor (not
      Abhishek himself) speaking. The exact rupee figure is somewhat
      garbled in the transcript (numbers named include both "500 crores"
      and "400 crores" in the exchange) -- confirm the precise amount
      during verification.

