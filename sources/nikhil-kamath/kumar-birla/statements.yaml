  - id: nikhil-kamath-028
    person: nikhil-kamath
    source: nikhil-kamath-kumar-birla
    type: experience
    speaker_confidence: high
    text: >
      Admits that he estimates he does no more than about 90 minutes
      of genuinely productive work on a typical day, describing the
      rest as "pretending to work" -- says this realization came from
      a conversation with his brother and a company CXO about how
      little of a workday is actually spent on focused, high-value
      work.
    topic: work-habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=e6FqC4pWy8I&t=6285s"
      start_timestamp: "1:44:45"
      end_timestamp: "1:45:49"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-026. Confirmed
      via the video's dense transcript at 1:44:45-1:45:49: "...I've
      realized that most of what I do is pretend to work. I had this
      conversation with somebody at some point of time... one day I was
      sitting in my office and having this conversation with some CXO
      of our company and my brother and a couple other guys, and we all
      started saying this one after the other, one is like, okay, I
      pretend to work X hours a day out of the insecurity of knowing
      you're sitting in front of me and pretending to work. I don't
      think I do productive work for more than -- quite complex, maybe
      like 90 minutes a day, and that would be pushing it -- the rest of
      the time is very repetitive work."
