    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-026.
      Cross-reference: corroborates nikhil-kamath-022 (Ranbir Kapoor
      episode), which describes the father's death and brother's stroke
      in more detail -- two independent extractions naming the same
      events is a useful signal but not itself verification. Treat with
      the same sensitivity-during-verification note as
      nikhil-kamath-022.

  - id: nikhil-kamath-028
