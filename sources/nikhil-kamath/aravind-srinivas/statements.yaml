    notes: >
      SPEAKER ATTRIBUTION: 1:1 video call interview (Nikhil interviewing
      Aravind Srinivas), no diarization, but confirmed via video at
      43:46-45:08: Nikhil is visibly on camera self-interrupting his own
      question ("can you explain what a neural network actually is...
      define machine learning? Yeah, um, machine learning is broadly...")
      then saying "I have a little bit of history with this because I
      work in the stock investor world and we've had neural networks for
      a long time... put all this data into a neural network, try to get
      it to predict what will happen next and start maybe a robo-advisory
      kind of service... but none of this played out in the manner that
      we perceived it," immediately before Aravind picks up with "So a
