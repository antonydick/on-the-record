    text: >
      Describes working in "the stock investor world" and says that
      over much of the last decade, he/his team experimented with
      neural networks trained on stock market data (price, volume,
      time-based factors) to try to predict future price movements or
      power a robo-advisory service, but says this did not play out the
      way they expected.
    topic: investing
