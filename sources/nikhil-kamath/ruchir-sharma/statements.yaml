  - id: nikhil-kamath-064
    person: nikhil-kamath
    source: nikhil-kamath-ruchir-sharma
    type: mechanism
    speaker_confidence: high
    text: >
      Says he has been researching whether India could build a
      stablecoin backed by a mix of gold and Indian rupees (rather than
      the US dollar) to address remittance flows into India, and
      identifies the 1% TDS (tax deducted at source) on crypto and
      stablecoin transactions in India as the main obstacle preventing
      such a product from being built domestically.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lTCzIDITaac&t=2195s"
      start_timestamp: "36:35"
      end_timestamp: "36:53"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-053 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 36:35-36:53:
      "When we speak about regulation,... if I were to come into
      something like crypto, blockchain, stablecoins in India, we don't
      want a stablecoin which is backed by the US dollar." The specific
      1% TDS obstacle and the gold-plus-rupee backing mechanism were not
      caught verbatim within the sampled window, but the core claim
      (researching a non-dollar-backed, India-oriented stablecoin) is
      confirmed. Cross-reference: consistent with nikhil-kamath-075
      (Brian Armstrong episode), which describes the same exploration as
      dating back roughly two years and shelved over the lack of an
      off-ramp.

