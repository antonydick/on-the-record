  - id: nikhil-kamath-055
    person: nikhil-kamath
    source: nikhil-kamath-ruchir-sharma
    type: belief
    speaker_confidence: high
    text: >
      Expresses concern that Indian brands, teenagers, and young adults
      spend hours a day on American-owned platforms (WhatsApp, YouTube,
      Instagram, Twitter/X, Netflix), and that this represents a large,
      uncounted transfer of value and data to US tech companies beyond
      what shows up in software-services export figures.
    topic: technology
    verification:
      status: verified
      verified_at: "2026-09-18"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=lTCzIDITaac&t=8215s"
      start_timestamp: "2:16:55"
      end_timestamp: "2:17:30"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-053 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). Confirmed via live captions at 2:16:55-2:17:30:
      "there is no accurate depiction of how much money,... Instagram,
      Twitter, et cetera have, the highest user base is India... it's so
      hard to tax that or to tariff that, right?" The specific platform
      list (WhatsApp/YouTube/Netflix) and "hours a day" framing were not
      caught verbatim within the sampled window, but the core claim
      (India is the largest user base for these American platforms, and
      this represents an uncounted/untaxed value transfer) is confirmed.

  - id: nikhil-kamath-056
