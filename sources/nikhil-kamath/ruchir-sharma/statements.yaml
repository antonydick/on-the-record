      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-053 (confirmed
      via live captions, this video's transcript panel having failed to
      load repeatedly). The specific brand names mentioned in the draft
      are unclear/garbled in the auto-transcript and were not
      independently confirmed. Confirmed via live captions at
      2:18:35-2:18:48: "I think India is on that path where everybody is
      getting more patriotic... I'm a big champion of 'buy Indian brands
