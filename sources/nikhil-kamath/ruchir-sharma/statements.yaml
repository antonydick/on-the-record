    type: belief
    text: >
      Identifies the informal/illegal "dabba" trading market (bets
      settled directly between participants or against a local
      bookmaker-style broker, bypassing formal exchanges) as the single
      biggest hindrance to his brokerage business, and says the country
      needs to find a way to curtail it.
