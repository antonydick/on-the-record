    type: mechanism
    text: >
      Says he has been researching whether India could build a
      stablecoin backed by a mix of gold and Indian rupees (rather than
      the US dollar) to address remittance flows into India, and
      identifies the 1% TDS (tax deducted at source) on crypto and
      stablecoin transactions in India as the main obstacle preventing
      such a product from being built domestically.
