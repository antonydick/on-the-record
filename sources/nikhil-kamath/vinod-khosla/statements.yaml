  - id: nikhil-kamath-010
    person: nikhil-kamath
    source: nikhil-kamath-vinod-khosla
    type: experience
    text: >
      Says that over the past couple of years he invested across the
      electric-mobility sector -- scooter companies, cars, trucks,
      buses, and even a flying-taxi company -- on the assumption that
      mobility would shift from internal-combustion to electric, and is
      now questioning that thesis given what he describes as slowing EV
      adoption in the current cycle.
    topic: investing
