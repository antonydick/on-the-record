  - id: nikhil-kamath-009
    person: nikhil-kamath
    source: nikhil-kamath-vinod-khosla
    type: experience
    speaker_confidence: high
    text: >
      Describes his team's ongoing research into an investment thesis
      built around demographic shifts -- an aging, "sicker" global
      population, declining birth rates, and rising discretionary
      spending among people with more free time potentially favoring
      speculative and luxury businesses. The same thesis (aging
      population, discretionary/luxury spend) recurs in his interview
      with Sam Altman (see nikhil-kamath-005), suggesting it's a
      standing framework he brings to multiple conversations, not a
      one-off remark.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=O7O204wD82s&t=3947s"
      start_timestamp: "1:05:47"
      end_timestamp: "1:06:24"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-008 -- inferred
      from conversational role, not confirmed via video, but content
      confirmed via live captions at 1:05:47-1:06:24 ("Speculation vs
      Adaptation" chapter): "...trying to come up with a thesis of what
      sectors might do better [than others as this change in the world
      happens]... some of the things that we've been digging data up
      around... [people are having fewer kids] than they're having or
      were having 10 years ago... when people have more time and
      discretionary spending power... so, speculative businesses might
      do better." Cross-reference with nikhil-kamath-005 (Sam Altman
      episode) remains based on textual similarity across two
      independently-extracted sources, not a confirmed direct link, but
      is now backed by direct verification of this instance.

  - id: nikhil-kamath-010
    person: nikhil-kamath
    source: nikhil-kamath-vinod-khosla
    type: experience
    speaker_confidence: high
    text: >
      Says that over the past couple of years he invested across the
      electric-mobility sector -- scooter companies, cars, trucks,
      buses, and even a flying-taxi company -- on the assumption that
      mobility would shift from internal-combustion to electric, and is
      now questioning that thesis given what he describes as slowing EV
      adoption in the current cycle.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=O7O204wD82s&t=4108s"
      start_timestamp: "1:08:28"
      end_timestamp: "1:08:56"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-008 -- inferred
      from conversational role ("I have a personal question," "I bet on
      everything from..."), not confirmed via video, but content
      confirmed via live captions at 1:08:28-1:08:56 ("Will All Mobility
      Be Electric?" chapter): "For the last couple of years, I had come
      up... and I bet on everything from scooter companies to a car,
      truck, bus... [Guest:] Do you agree with that thesis that all
      vehicle[s will go electric]?... [Nikhil:] But the adoption to EV
      in this last cycle seems to be slowing down."
