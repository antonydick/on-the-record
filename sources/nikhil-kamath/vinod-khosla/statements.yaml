  - id: nikhil-kamath-009
    person: nikhil-kamath
    source: nikhil-kamath-vinod-khosla
    type: experience
    text: >
      Describes his team's ongoing research into an investment thesis
      built around demographic shifts -- an aging, "sicker" global
      population, declining birth rates, and rising discretionary
      spending among people with more free time potentially favoring
      speculative and luxury businesses. The same thesis (aging
      population, discretionary/luxury spend) recurs in his interview
      with Sam Altman (see nikhil-kamath-005), suggesting it's a
      standing framework he brings to multiple conversations, not a
      one-off remark.
    topic: investing
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
