statements:
  - id: nikhil-kamath-083
    person: nikhil-kamath
    source: nikhil-kamath-chamath-palihapitiya
    type: experience
    speaker_confidence: high
    text: >
      Describes a grant program tied to his podcast: he has guests give
      money to a charity he chooses, matches their donation himself
      (sometimes joined by friends), and uses the pooled funds to make
      pure grants -- no equity taken, no repayment required -- directly
      to young, technical Indian founders (under 25) who lack startup
      capital. Says he funds a dozen or so founders every couple of
      months, and cites a pet-protein company called "Posible," now
      worth an estimated $40-50 million, along with a few other
      roughly $50 million outcomes, as results of the program.
    topic: philanthropy
    verification:
      status: draft
      verified_at: null
      verified_by: null
      source_url: null
      start_timestamp: null
      end_timestamp: null
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview (Nikhil interviewing Chamath
      Palihapitiya), no diarization. Attribution inferred from
      conversational role, not confirmed via video. Cross-reference:
      compare against nikhil-kamath-079 (Brian Armstrong episode), which
      describes a differently-detailed program called "Foundry"
      ($500k per founder, cohorts of 20-25, consumer companies, founders
      living together) -- during verification, determine whether these
      are the same initiative described inconsistently, or genuinely
      distinct programs (this one reads as closer to the "WTFund" this
      notebook/podcast is named after).

  - id: nikhil-kamath-084
