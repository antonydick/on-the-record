statements:
  - id: nikhil-kamath-227
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-c2-24-founders
    type: belief
    speaker_confidence: high
    text: >
      Explains the WTFund's investment thesis to the assembled cohort of
      founders: the 20-lakh-rupee grant is meant to get startups to
      market readiness, WTFund retains the right to invest further as
      each startup raises down the line, and each cohort is chosen for
      sector traction/stickiness and "exponentiality" (many possible use
      cases). Says the fund's job as an investor isn't just to put in
      money but to see the future alongside the founders, and that its
      broader purpose is to accelerate the Indian entrepreneurial
      journey — adding that people complain about why young people in
      India aren't building important things (giving DeepSeek as an
      example) without recognizing there's little support, and that
      WTFund is meant to be "the first arm of support."
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=yFyIBKK361E&t=432s"
      start_timestamp: "7:12"
      end_timestamp: "8:20"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: this source is a WTFund cohort demo-day style
      session with ~10 founder teams presenting in turn; no diarization
      in the auto-transcript. This statement is confidently attributed to
      Nikhil because it is delivered in first-person-plural framing
      specific to the fund itself ("we give a 20 lakh grant," "we have
      rights... to invest further," "our job... as investors"), matching
      his established role as WTFund's founder/host across this episode
      and the main WTF interview series. Confirmed via live captions at
      7:12-8:20 ("About WTFund" chapter): "...part of the WTF fund that
      while we give a 20 lakh grant, we also [retain the right to invest
      further] down the line as they raise further... the aim of [this]
      to market readiness, and to get them prepared for a further
      [raise]... [we look at two things,] one is the kind of sectors
      that they can enter... in India, where is the support? We are the
      first arm of support."

  - id: nikhil-kamath-228
    person: nikhil-kamath
    source: nikhil-kamath-wtfund-c2-24-founders
    type: experience
    speaker_confidence: high
    text: >
      While questioning the beverage-brand ("drink") founders, discloses
      that he is personally an investor in "some of these coffee
      brands," and says it always helps a brand to have a clearer
      demarcation of what sets it apart. Goes on to give his own market
      analysis of India's drinks category: that the business model doesn't
      translate from the West because the Indian real-estate-to-cup-sold
      economics are worse (Indians don't buy a coffee and walk the
      streets with it the way people do abroad), calling the space "very
      complicated and nuanced" and saying nobody in it is really making
      money despite the number of players that have scaled.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=yFyIBKK361E&t=1715s"
      start_timestamp: "28:35"
      end_timestamp: "29:10"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same multi-founder demo-day format and
      no-diarization caveat as nikhil-kamath-227. Attributed to Nikhil
      because it is framed as personal investing experience ("the little
      bit of experience that I have as an investor in some of these
      coffee brands") from the panel's questioner, addressed directly to
      the beverage-brand founders being interviewed, consistent with his
      host/investor role throughout. Confirmed via live captions at
      28:35-29:10 (during the "drnk" Q&A): "...[in]vest, and you account
      for real estate to cost of cup... buying a coffee or a slushy or a
      matcha and walking the streets, so your [economics don't
      translate]... scaled, so as I -- I -- I do get a point of the
      comparative, but that's why I think [it's very complicated and
      nuanced]."

