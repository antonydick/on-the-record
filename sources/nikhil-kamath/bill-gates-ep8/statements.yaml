statements:
  - id: nikhil-kamath-015
    person: nikhil-kamath
    source: nikhil-kamath-bill-gates-ep8
    type: assertion
    speaker_confidence: high
    text: >
      States his age as 38 at the time of this recording, while having
      lunch with team members in their early 20s.
    topic: biography
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=YY7J1pHfSyY&t=2057s"
      start_timestamp: "34:17"
      end_timestamp: "34:33"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: 1:1 interview, confirmed via the video's
      dense transcript at 34:17-34:33: "So, I engaged every emotion to
      drive myself in my 20s... So, I was having lunch with my team
      today. A bunch of them are 21, 23, 24. And even at 38, I'm so
      disconnected from how they think. Their version of reality, in a
      way." Cross-reference: nikhil-kamath-013 (Bill Gates Ep #1,
      published 2024-06-14) has him stating his age as 37; this episode
      published 2025-04-10 has him at 38 -- consistent with a birthday
      in that ~10-month window, now backed by direct verification.

