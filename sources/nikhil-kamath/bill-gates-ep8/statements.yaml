  - id: nikhil-kamath-017
    person: nikhil-kamath
    source: nikhil-kamath-bill-gates-ep8
    type: experience
    speaker_confidence: high
    text: >
      Describes what has driven him at different points in life: early
      on, simply wanting money because he grew up without it and
      associated it with happiness; later, feeling driven more by
      power, jealousy, insecurity, and seeking validation; currently
      describes himself as uncertain and moving between wanting to make
      more money and wanting to give it away.
    topic: motivation
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=YY7J1pHfSyY&t=1674s"
      start_timestamp: "27:58"
      end_timestamp: "28:17"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-015. Confirmed
      via the video's dense transcript at 27:58-28:17: "...when I was to
      think about what drives me deeply, in the beginning, I think it
      was just money. I feel like I didn't have money, I wanted money.
      Because of my conditioning, my years growing up looking at the
      people around me with money, they looked happy. I think money
      transitioned into relatively more power, jealousy, insecurity,
      seeking validation, and different drivers for different parts of
      my life."

  - id: nikhil-kamath-018
    person: nikhil-kamath
    source: nikhil-kamath-bill-gates-ep8
    type: experience
    speaker_confidence: high
    text: >
      Says he spent about a week (roughly 14-15 hours total, during
      travel and before bed) reading Bill Gates's memoir "Source Code"
      in preparation for this interview.
    topic: work-habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=YY7J1pHfSyY&t=141s"
      start_timestamp: "2:21"
      end_timestamp: "2:39"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-015. Confirmed
      via the video's dense transcript at 2:21-2:39: "...we met recently
      in Switzerland and I asked you many things off camera. So, I spent
      the last week reading Source Code. It took me a long time, I read
      much slower than you, I presume. It took me 14-15 hours. So, my
      time in the car, on my flight, in all my travels, and before going
      to bed has been Source Code."

  - id: nikhil-kamath-019
    person: nikhil-kamath
    source: nikhil-kamath-bill-gates-ep8
    type: experience
    speaker_confidence: high
    text: >
      Half-jokingly asks Bill Gates for career advice at the end of the
      interview, saying he feels he is "losing out" on the AI wave and
      is considering taking an unpaid internship or job in the US (e.g.
      at an AI lab) to get direct exposure to the field.
    topic: work-habits
    verification:
      status: verified
      verified_at: "2026-09-16"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=YY7J1pHfSyY&t=2372s"
      start_timestamp: "39:32"
      end_timestamp: "39:40"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-015. This
      exchange happens in informal post-interview banter, immediately
      after Nikhil thanks Bill and they discuss meeting again at the
      Giving Pledge -- tone is light/half-joking, consistent with the
      draft's framing. Confirmed via the video's dense transcript at
      39:32-39:40: "Actually I wanted to ask you some advice. So, I am
      seeking that I am losing out on the whole AI world. So, I want to
      take some job somewhere in the US or an internship, unpaid one."
