    text: >
      He struggles to fall asleep and typically gets only 5-5.5 hours;
      because he starts work early in the morning, he ends up working
      out late at night (around 10-11pm), which he describes as making
      it harder to sleep the following night -- a self-reinforcing
      cycle he has not resolved.
