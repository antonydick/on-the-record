    type: experience
    text: >
      Says he has been researching consumption as a sector and that he
      (through his fund) created a fund specifically to invest in
      consumption-focused companies. Describes noticing a disconnect
      shortly before this recording: top-line reported consumption
      numbers looked healthy, but people he spoke to on the ground were
      describing a consumption slowdown over the prior two to three
      months across travel, fashion, and e-commerce.
