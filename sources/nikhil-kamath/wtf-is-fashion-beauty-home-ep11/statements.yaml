  - id: nikhil-kamath-204
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-fashion-beauty-home-ep11
    type: experience
    speaker_confidence: high
    text: >
      Says he has been researching consumption as a sector and that he
      (through his fund) created a fund specifically to invest in
      consumption-focused companies. Describes noticing a disconnect
      shortly before this recording: top-line reported consumption
      numbers looked healthy, but people he spoke to on the ground were
      describing a consumption slowdown over the prior two to three
      months across travel, fashion, and e-commerce.
    topic: investing
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=hjiZ11lKCrU&t=1s"
      start_timestamp: "0:03"
      end_timestamp: "1:10"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: three-person panel (Nikhil hosting Mensa
      Brands' founder Ananth Narayanan, House of X/Figuring Out founder
      Raj Shamani, and Future Group's Kishore Biyani), no diarization in
      the auto-transcript. Stated in first person in the host's opening
      framing of the episode (a continuous monologue over the intro
      music/disclaimer overlay, not a separate cold-open trailer clip as
      initially suspected). Confirmed via video at 0:03-1:10 ("Intro"
      chapter): "so I have been looking into consumption we created a
      fund to invest into companies around consumption uh there seems to
      be a double standard in a way wherein the reported numbers on the
      top are looking good but everyone I talk to on the ground is
      talking about how consumption seems to have dropped in the last two
      or three months uh this could be in travel this could be in fashion
      this could be eCommerce uh across segments."

  - id: nikhil-kamath-205
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-fashion-beauty-home-ep11
    type: experience
    speaker_confidence: high
    text: >
      In the show's recurring end-of-episode charity segment, proposes
      doing it differently this time: funding one or two entrepreneurs
      under the age of 22 (reasoning that founders that young find it
      especially hard to raise money) building something in fashion,
      cosmetics, or another topic discussed in the episode, rather than
      donating to a charity. After other panelists suggest 10 lakh rupees
      each, he proposes increasing it and committing 20 lakh rupees each
      across two companies (40 lakh rupees total), citing the show's
      previous grant of 40 lakh rupees to the (then 18-year-old) Zepto
      founders as precedent for how much a young grantee can do with that
      amount.
    topic: personal life
    verification:
      status: verified
      verified_at: "2026-09-15"
      verified_by: Antony Dick
      source_url: "https://www.youtube.com/watch?v=hjiZ11lKCrU&t=12081s"
      start_timestamp: "3:21:21"
      end_timestamp: "3:23:02"
    evidence:
      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-204, resolved the
      same way (Nikhil visibly on camera throughout). Proposed and
      narrated in first person by the host near the end of the episode
      ("Special Announcement: Apply Below!" chapter). Confirmed via video
      across two parts of the same continuous closing negotiation: at
      3:21:21-3:21:42, "...sure finding young people when he started like
      yeah yeah like him ... in the last episode we had the zepto guys and
      you know the one thing they said that was so incredibly cool is
      they got a grant of 40 lakhs from this fund when they were 18 and
      that's what helped them build [Ze]pto ... amazing yeah so we'll
      figure out an investment between all of this"; then at 3:22:42-
      3:23:02, "...much better also should we do a larger amount so it'll
      be game changing we can do we can do whatever or we can do two
      companies so should we do 20 lakhs each and two companies 40 lakhs
      ... yeah that's much better yeah I think it'll increase the
      probability also done and we will ask them to incorporate."
