  - id: nikhil-kamath-205
    person: nikhil-kamath
    source: nikhil-kamath-wtf-is-fashion-beauty-home-ep11
    type: experience
    text: >
      In the show's recurring end-of-episode charity segment, proposes
      doing it differently this time: funding one or two entrepreneurs
      under the age of 22 (reasoning that founders that young find it
      especially hard to raise money) building something in fashion,
      cosmetics, or another topic discussed in the episode, rather than
      donating to a charity. After other panelists suggest 10 lakh rupees
      each, he proposes increasing it and committing 20 lakh rupees each
      across two companies (40 lakh rupees total), citing the show's
      previous grant of 40 lakh rupees to the (then 18-year-old) Zepto
      founders as precedent for how much a young grantee can do with that
      amount.
    topic: personal life
