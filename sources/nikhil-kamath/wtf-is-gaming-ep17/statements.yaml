      excerpt: null
    notes: >
      SPEAKER ATTRIBUTION: same caveat as nikhil-kamath-208, resolved the
      same way (clear video, Nikhil identifiable). CORRECTION TO DRAFT:
      the original draft said Nikhil's 1-crore pledge matches "Krafton's"
      commitment; per NotebookLM cross-reference and the real video, the
      1-crore commitment sequence is actually Nitish Mittersain (Nazara)
      pledging first ("1 CR to start with but we can double down on that
