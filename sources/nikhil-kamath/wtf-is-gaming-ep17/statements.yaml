    text: >
      In the show's recurring end-of-episode community-support segment,
      proposes identifying 20 promising young people in Indian gaming
      through an open application process (with the panelists jointly
      selecting the 20), to receive mentorship, internships, grants, and
      cloud credits from the assembled companies; commits 1 crore rupees
      of his own toward this, matching Nazara/Nitish Mittersain's 1 crore
      rupee commitment (Krafton's separate contribution is cloud credits
      and partner-program support, not a matching cash commitment).
    topic: personal life
