id: nikhil-kamath
name: Nikhil Kamath
credentials: "Co-founder, Zerodha and True Beacon; host, WTF is"
bio: >
  Indian entrepreneur and investor. Co-founded the discount brokerage
  Zerodha in 2010 with his brother Nithin Kamath, and later co-founded
  the asset management firm True Beacon. Since March 2024 hosts the
  interview podcast "WTF is", featuring entrepreneurs, investors,
  scientists, and other public figures.
