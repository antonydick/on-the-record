id: raj-shamani
name: Raj Shamani
credentials: "Founder, Shamani Industries; co-founder, House of X; host, Figuring Out"
bio: >
  Indian entrepreneur, angel investor, and podcaster born July 29, 1997
  in Indore, Madhya Pradesh. Took over his family's chemicals and
  household-cleaning-products business, Shamani Industries, as a
  teenager, and later co-founded House of X, a platform that helps
  digital creators launch consumer brands. Launched the long-form
  interview podcast "Figuring Out with Raj Shamani" in 2021, featuring
  entrepreneurs, scientists, politicians, athletes, and other public
  figures; it has grown into one of India's most-watched podcasts.
