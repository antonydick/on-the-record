name: Update stats

on:
  push:
    branches: [main]
    paths-ignore:
      - "STATS.md"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/generate_stats.py

      - name: Commit STATS.md if changed
        run: |
          if git diff --quiet -- STATS.md; then
            echo "No change to STATS.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATS.md
          git commit -m "Update STATS.md"
          git push
